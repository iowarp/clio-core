# DTSchedule workload: WfCommons Seismology, 2 nodes, stage-set placement.
#
# Same stack as montage_2n.yaml (clio_runtime -> clio_cte RAM 1.0 + NVMe
# 0.7 -> clio_wfcommons_dist with stage_sets=2 and the CTE POSIX
# interposer). Seismology is a wide fan-in: many sG1IterDecon tasks
# (float traces, .stf -> float_field) feeding one wrapper_siftSTFByMisfit
# (.gz -> mixed_binary), so almost every file of level 0 is consumed on
# the other node by the single level-1 task.
#
# num_tasks 103 is the seismology recipe minimum (base graph); the 30 GiB
# footprint is spread over ~200 files (~150 MiB each).
#
# Run:  jarvis ppl load yaml <this file> && jarvis ppl run

name: dtschedule_seismology_2n

ssh_cmd: "env -u LD_LIBRARY_PATH ssh"

env:
  CLIO_MEMFD_DIR: "${HOME}/iowarp_clio_tmp_${HOSTNAME}"
  WFBENCH_DROP_CACHE: "1"

scheduler:
  name: slurm
  job_name: dtschedule_seismology_2n
  nodes: 2
  ntasks_per_node: 1
  cpus_per_task: 40
  partition: debug
  time: "01:00:00"
  output: slurm-%j.out
  error: slurm-%j.err
  suffix: "-40g"
  pre_cmds:
    - 'mkdir -p /mnt/nvme/${USER}/dtschedule_seismology_2n'

pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    client_data_segment_size: "2G"
    port: 9413
    ipc_mode: "shm"
    log_level: "info"
    sleep: 4
    swim_enabled: false

  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
      - ["ram::cte_ram_tier1", "16GB", 1.0]
      - ["/mnt/nvme/${USER}/dtschedule_seismology_2n/cte_target.bin", "64GB", 0.7]
    dpe_type: "max_bw"
    pool_query: "local"
    default_target_timeout_ms: 30000
    poll_period_ms: 5000

  # DTSchedule policy layer: appended on TOP of cte_core's compose chain
  # at 566.0 -> 512.0 (no cache/indexer pool here) and exported as
  # CLIO_CTE_POOL=566.0 so the POSIX interposer enters the chain there.
  # dag_path is derived from the wfcommons package below (its
  # shared_dir/placement.json); tiers from cte_core's devices (ram 1.0,
  # nvme 0.7). Trace: one CSV per container under ${HOME}/jarvis-runs.
  - pkg_type: jarvis_clio_core.clio_dtschedule
    pkg_name: dtschedule
    ccm: qtable
    workflow_aware: dag
    load_aware: true
    qos_objective: performance
    qos_max_error: 1.0e-3
    force_scenario: auto
    decision_order: joint
    net_bw_gbps: 40
    trace_path: ${HOME}/jarvis-runs/dtschedule_seismology_2n/dtschedule_trace
    trace_candidates: true

  - pkg_type: jarvis_clio_core.clio_wfcommons_dist
    pkg_name: wfcommons
    recipe: seismology
    num_tasks: 103
    data_footprint: "30G"
    cpu_work: 1
    percent_cpu: 1.0
    drop_page_cache: true
    clio_prefix: true
    placement: stage_sets
    stage_sets: 2
    data_class: auto
    data_noise: 0.05
    wf_python: ${HOME}/venv-dtschedule/bin/python
    out: ${HOME}/dtschedule-runs/seismology_2n
    ssh_cmd: "env -u LD_LIBRARY_PATH ssh"
    interceptors: [cte_posix]

interceptors:
  - pkg_type: jarvis_clio_core.clio_adapters
    pkg_name: cte_posix
    posix: true
