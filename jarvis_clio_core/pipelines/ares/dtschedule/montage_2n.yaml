# DTSchedule workload: WfCommons Montage, 2 nodes, stage-set placement.
#
# Stack:
#   clio_runtime (shm IPC, every node)
#     -> clio_cte with two tiers: RAM (score 1.0) and node-local NVMe
#        (score 0.7), registered on every node
#     -> clio_wfcommons_dist: the DAG is levelled and level i runs on node
#        subset (i mod 2), so every producer/consumer pair of consecutive
#        levels sits on different nodes and every inter-level file is a
#        cross-node transfer the scheduler can act on. Task I/O goes
#        through the CTE POSIX interposer (clio:: prefix + LD_PRELOAD).
#
# Montage shape: fan-out (mProject) -> fan-in (mDiffFit/mConcatFit) ->
# mBackground fan-out -> mAdd fan-in; data class float_field (.fits) with
# .txt/.tbl tables in between, see dt_datagen.EXT_TABLE.
#
# num_tasks 60 is the montage recipe minimum. 30 GiB total footprint ->
# ~430 MiB per file over ~70 files. The RAM tier is sized below the
# footprint on purpose so tiering (Alg. 2) has to spill to NVMe.
#
# Run:  jarvis ppl load yaml <this file> && jarvis ppl run
# Stat: jarvis ppl stat  (wfcommons.makespan_ms, wfcommons.level<i>_ms,
#       dtschedule.puts / .compressed / .mean_ratio / .lib.* / .scenario.*)
# DAG:  ${HOME}/dtschedule-runs/montage_2n/placement.json (also copied to
#       the package shared_dir and exported as DTSCHEDULE_DAG_PATH)

name: dtschedule_montage_2n

ssh_cmd: "env -u LD_LIBRARY_PATH ssh"

env:
  CLIO_MEMFD_DIR: "${HOME}/iowarp_clio_tmp_${HOSTNAME}"
  WFBENCH_DROP_CACHE: "1"

scheduler:
  name: slurm
  job_name: dtschedule_montage_2n
  nodes: 2
  ntasks_per_node: 1
  cpus_per_task: 40
  partition: debug
  time: "01:00:00"
  output: slurm-%j.out
  error: slurm-%j.err
  suffix: "-40g"
  pre_cmds:
    - 'mkdir -p /mnt/nvme/${USER}/dtschedule_montage_2n'

pkgs:
  - pkg_type: jarvis_clio_core.clio_runtime
    pkg_name: runtime
    num_threads: 4
    client_data_segment_size: "2G"
    port: 9413
    ipc_mode: "shm"
    log_level: "info"
    sleep: 4
    swim_enabled: false

  - pkg_type: jarvis_clio_core.clio_cte
    pkg_name: cte_core
    devices:
      - ["ram::cte_ram_tier1", "16GB", 1.0]
      - ["/mnt/nvme/${USER}/dtschedule_montage_2n/cte_target.bin", "64GB", 0.7]
    dpe_type: "max_bw"
    pool_query: "local"
    default_target_timeout_ms: 30000
    poll_period_ms: 5000

  # DTSchedule policy layer: appended on TOP of cte_core's compose chain
  # at 566.0 -> 512.0 (no cache/indexer pool here) and exported as
  # CLIO_CTE_POOL=566.0 so the POSIX interposer enters the chain there.
  # dag_path is derived from the wfcommons package below (its
  # shared_dir/placement.json); tiers from cte_core's devices (ram 1.0,
  # nvme 0.7). Trace: one CSV per container under ${HOME}/jarvis-runs.
  - pkg_type: jarvis_clio_core.clio_dtschedule
    pkg_name: dtschedule
    ccm: qtable
    workflow_aware: dag
    load_aware: true
    qos_objective: performance
    qos_max_error: 1.0e-3
    force_scenario: auto
    decision_order: joint
    net_bw_gbps: 40
    trace_path: ${HOME}/jarvis-runs/dtschedule_montage_2n/dtschedule_trace
    trace_candidates: true

  - pkg_type: jarvis_clio_core.clio_wfcommons_dist
    pkg_name: wfcommons
    recipe: montage
    num_tasks: 60
    data_footprint: "30G"
    cpu_work: 1
    percent_cpu: 1.0
    drop_page_cache: true
    clio_prefix: true
    placement: stage_sets
    stage_sets: 2
    data_class: auto
    data_noise: 0.05
    wf_python: ${HOME}/venv-dtschedule/bin/python
    out: ${HOME}/dtschedule-runs/montage_2n
    ssh_cmd: "env -u LD_LIBRARY_PATH ssh"
    interceptors: [cte_posix]

interceptors:
  - pkg_type: jarvis_clio_core.clio_adapters
    pkg_name: cte_posix
    posix: true
