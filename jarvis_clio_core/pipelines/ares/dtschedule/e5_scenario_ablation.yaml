# E5 -- scenario ablation (EVAL_PLAN.md section 2, reviewer concerns B6/B1).
#
# Jarvis pipeline TEST: the montage_2n stack, swept over
# dtschedule.force_scenario in {auto, 1, 2, 3}:
#   1    compress at the producer, store at the producer
#   2    compress at the producer, store at the consumer
#   3    ship raw, compress and store at the consumer
#   auto Algorithm 2 picks per blob
# Every row re-runs the whole workflow; the dtschedule trace (one CSV per
# container) is reset at each configure, and `dtschedule.scenario.<k>`
# in results.csv is the histogram of scenarios actually chosen.
#
# The load / network grid of E5 (consumer load idle / 50% / 100%, producer
# sim-only / sim+50%, 25 GbE vs tc-throttled 5 GbE) is injected OUTSIDE
# jarvis -- see README.md "Load and network injection"; run this test once
# per grid cell with a distinct `output:`.
#
# Run (Mode A, one allocation wraps all 4 rows):
#   jarvis ppl submit <abs path>/e5_scenario_ablation.yaml
# Or inside an existing allocation:
#   python3 sweep.py --exp e5 --from-test e5_scenario_ablation.yaml
# Figure: dtschedule/eval/e5_scenario_heatmap.py

scheduler:
  name: slurm
  job_name: dtschedule_e5
  nodes: 2
  ntasks_per_node: 1
  cpus_per_task: 40
  partition: debug
  time: "04:00:00"
  output: slurm-%j.out
  error: slurm-%j.err
  suffix: "-40g"
  pre_cmds:
    - 'mkdir -p /mnt/nvme/${USER}/dtschedule_e5'

config:
  name: dtschedule_e5

  ssh_cmd: "env -u LD_LIBRARY_PATH ssh"

  env:
    CLIO_MEMFD_DIR: "${HOME}/iowarp_clio_tmp_${HOSTNAME}"
    WFBENCH_DROP_CACHE: "1"

  pkgs:
    - pkg_type: jarvis_clio_core.clio_runtime
      pkg_name: runtime
      num_threads: 4
      client_data_segment_size: "2G"
      port: 9413
      ipc_mode: "shm"
      log_level: "info"
      sleep: 4
      swim_enabled: false

    - pkg_type: jarvis_clio_core.clio_cte
      pkg_name: cte_core
      devices:
        - ["ram::cte_ram_tier1", "16GB", 1.0]
        - ["/mnt/nvme/${USER}/dtschedule_e5/cte_target.bin", "64GB", 0.7]
      dpe_type: "max_bw"
      pool_query: "local"
      default_target_timeout_ms: 30000
      poll_period_ms: 5000

    - pkg_type: jarvis_clio_core.clio_dtschedule
      pkg_name: dtschedule
      ccm: qtable
      workflow_aware: dag
      load_aware: true
      qos_objective: performance
      qos_max_error: 1.0e-3
      force_scenario: auto
      decision_order: joint
      net_bw_gbps: 40
      trace_path: ${HOME}/jarvis-runs/dtschedule_e5/dtschedule_trace
      trace_candidates: true

    - pkg_type: jarvis_clio_core.clio_wfcommons_dist
      pkg_name: wfcommons
      recipe: montage
      num_tasks: 60
      data_footprint: "30G"
      cpu_work: 1
      percent_cpu: 1.0
      drop_page_cache: true
      clio_prefix: true
      placement: stage_sets
      stage_sets: 2
      data_class: auto
      data_noise: 0.05
      wf_python: ${HOME}/venv-dtschedule/bin/python
      out: ${HOME}/dtschedule-runs/e5
      ssh_cmd: "env -u LD_LIBRARY_PATH ssh"
      interceptors: [cte_posix]

  interceptors:
    - pkg_type: jarvis_clio_core.clio_adapters
      pkg_name: cte_posix
      posix: true

vars:
  dtschedule.force_scenario: ["auto", "1", "2", "3"]

loop:
  - [dtschedule.force_scenario]

# One montage run is a few minutes; a wedged row must not eat the job.
run_timeout: 2400
repeat: 1
output: "${HOME}/jarvis-runs/dtschedule-results/e5_scenario_ablation"
