# Three-tier variant of prodcons_2n.yaml (user, 2026-10-07): per-node tier
# capacities sized from the per-node footprint -- RAM 10%, NVMe 20%, HDD
# 100%+ -- so most data has to land on the HDD and storing compressed bytes
# matters. 20 steps x 40 ranks x 32 MB = 26.8 GB total, ~13.4 GB per node
# (hash-owned), which is above the kernel dirty-page throttle (~9 GB at
# dirty_ratio 20 on 46 GB nodes), so HDD writes are really bounded by the
# disk rather than absorbed by the page cache.
#   RAM  1342 MB  score 1.0  (~20 GB/s)
#   NVMe 2684 MB  score 0.7  (~2 GB/s)
#   HDD  16 GB    score 0.3  (~200 MB/s, Seagate ST1000LM049)
# Producer payload: montage-like data staged at /mnt/nvme/llogan/dt_payload
# on the producer node (the heat field itself barely compresses losslessly).
# Self-comparison defaults (user, 2026-10-07): every run is dtschedule with
# its own placement (placement: dtschedule) and owner-local devices
# (neighborhood: 1); configurations differ only in compression decisions.
name: dtschedule_prodcons_3tier
ssh_cmd: env -u LD_LIBRARY_PATH ssh
env: {CLIO_MEMFD_DIR: '${HOME}/iowarp_clio_tmp_${HOSTNAME}', WFBENCH_DROP_CACHE: '1',
  CLIO_CFS_WRITE_WINDOW: '16'}
scheduler:
  name: slurm
  job_name: dtschedule_prodcons_3tier
  nodes: 2
  ntasks_per_node: 1
  cpus_per_task: 40
  partition: debug
  time: 01:00:00
  output: slurm-%j.out
  error: slurm-%j.err
  suffix: -40g
  pre_cmds: ['mkdir -p /mnt/nvme/${USER}/dtschedule_prodcons_3tier /mnt/hdd/${USER}/dtschedule_prodcons_3tier']
pkgs:
- {pkg_type: jarvis_clio_core.clio_runtime, pkg_name: runtime, num_threads: 4, client_data_segment_size: 2G,
  port: 9413, ipc_mode: shm, log_level: info, sleep: 4, swim_enabled: false}
- pkg_type: jarvis_clio_core.clio_cte
  pkg_name: cte_core
  devices:
  - ['ram::cte_ram_tier1', 1342MB, 1.0]
  - ['/mnt/nvme/${USER}/dtschedule_prodcons_3tier/cte_target.bin', 2684MB, 0.7]
  - ['/mnt/hdd/${USER}/dtschedule_prodcons_3tier/cte_target.bin', 16GB, 0.3]
  dpe_type: max_bw
  pool_query: local
  default_target_timeout_ms: 30000
  poll_period_ms: 5000
  neighborhood: 1
- pkg_type: jarvis_clio_core.clio_dtschedule
  pkg_name: dtschedule
  ccm: qtable
  workflow_aware: dag
  load_aware: true
  qos_objective: performance
  qos_max_error: 0.0
  force_scenario: auto
  decision_order: joint
  net_bw_gbps: 40
  trace_path: ${HOME}/jarvis-runs/dtschedule_prodcons_3tier/dtschedule_trace
  trace_candidates: true
  min_compress_bytes: 65536
  load_period_ms: 500
  tier_bw_mbps: {ram: 20000.0, nvme: 2000.0, hdd: 200.0}
  placement: dtschedule
- pkg_type: jarvis_clio_core.clio_prodcons
  pkg_name: prodcons
  mpirun: /mnt/common/llogan/spack/opt/spack/linux-skylake_avx512/openmpi-5.0.8-aaqsri5t5df5mcygbtc3le7l7lumndvj/bin/mpirun
  launch_agent: /mnt/common/llogan/spack/opt/spack/linux-skylake_avx512/prrte-4.0.0-pag2d45mbp4iiutlhvzgrlzer65cm5if/bin/prted
  bin_dir: /mnt/common/llogan/iowarp/dtschedule/build/bin
  out: /mnt/common/llogan/dtschedule-runs/prodcons_3tier
  run: prodcons_3tier
  producer_nodes: 1
  ppn_producer: 40
  ppn_consumer: 20
  steps: 20
  nx: 2048
  ny: 2048
  iters_per_step: 50
  noise: 0.0
  passes: 4
  net_if: 172.25.0.0/16
  interceptors: [cte_posix]
  payload: /mnt/nvme/llogan/dt_payload
interceptors:
- {pkg_type: jarvis_clio_core.clio_adapters, pkg_name: cte_posix, posix: true}
