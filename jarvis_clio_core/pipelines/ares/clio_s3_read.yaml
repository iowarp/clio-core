# =============================================================================
# Issue #968 — CLIO vs Zarr S3 READ benchmark (non-containerized, Mode A).
# =============================================================================
#
# Compares two ways of reading array data out of real Amazon S3:
#
#   1. CLIO  -> clio_s3_bench (mode: read): CAE assimilator pulls flat objects
#               IN-PROCESS (ParseOmni -> S3FileAssimilator -> persistent
#               Poco+SigV4 GET streamed into CTE PutBlob -- no fork+exec, no
#               temp file), driving the clio_s3_read_bench binary
#   2. Zarr   -> zarr_s3_bench (mode: read): zarr-python + s3fs reads an
#               UNCOMPRESSED Zarr v3 store
#   3. raw_get -> s3_raw_get_bench: the wire-speed FLOOR -- K concurrent
#               `cae_s3_tool get` processes over the same keys. Report
#               ratio-to-floor; the absolute MB/s is a property of the link.
#
#   ZARR-ZSTD IS DELIBERATELY NOT A COMPARATOR. CLIO gets its own compression
#   mechanism later this year; until it does, a compressed Zarr store moves
#   ~20-26x fewer bytes for the same logical payload, so the comparison would
#   measure zstd rather than either system. `variants: ["none"]` below is the
#   whole switch -- restore ["none", "zstd"] once CLIO can compress too, and
#   put back the zarr_s3.readzstd.* column in post_cmds.
#
#   Grid: bytes-per-request {512 KiB, 4 MiB, 32 MiB, 256 MiB}
#         x concurrency {1, 8, 32}
#       = 12 combinations x repeat 3 = 36 rows.
#
#   Both stacks move the SAME 2 GiB of logical data in every row; only the
#   request count changes across the granularity axis (4096/512/64/8 requests).
#
# THIS SWEEP DOES NOT EXERCISE THE S3 BDEV (ReadBlocks -> the whole-buffer
# GetObject), which has its own ctests (clio_run_s3_rest_test). It DOES now
# exercise the shared S3RestClient persistent-connection code: the CAE
# assimilator reuses that transport in-process (BeginGetObject/ReadBody streamed
# into CTE), landing in the `ram::cte_ram_tier1` device below. Cross-object
# socket reuse is proven by the daemon's "CAE S3 keepalive TOTAL sockets=..
# requests=.." line (sockets==1 & requests>>1 is reuse), and the pre_cmds CAE
# link gate asserts the runtime is the in-process (no-AWS-SDK) build.
#
# This is a "pipeline test" (scheduler: + config: + vars: + loop: + output:),
# NOT a plain pipeline — only this shape produces results.csv. There are no
# `scheduler.*` entries in vars:, which is what makes it Mode A: the whole
# sweep runs inside ONE Slurm allocation via `jarvis ppl submit`.
#
# BARE METAL: there are deliberately no base_deploy_mode / container_* keys.
# The clio_* packages' container_kwargs() degrades to a no-op without them.
#
# Prerequisites (see docs/CLIO_S3_BENCH.md for the full setup):
#   - Dataset staged once:  jarvis_clio_core/scripts/stage_s3_read_bench_data.py
#   - IOWarp built with +cae +s3_cae and exposed via a spack view (IOWARP_VIEW)
#   - A venv with zarr/s3fs/numpy (ZARR_VENV)
#   - ~/.aws/credentials (mode 600) + a profile name in S3_BENCH_PROFILE
#
# Usage:
#   export S3_BENCH_BUCKET=my-bucket S3_BENCH_PROFILE=clio-bench
#   export IOWARP_VIEW=/mnt/common/$USER/iowarp-s3-view ZARR_VENV=$HOME/zarr-venv
#   jarvis ppl submit <abs path>/clio_s3_read.yaml
#
#   pre_cmds expand when the JOB runs, so export any overrides BEFORE submitting.
#
# Output:
#   ${HOME}/clio_s3_read_results/results.csv — 36 rows. Per-stack columns:
#   clio_s3.read.*, zarr_s3.read.* (agg_bw_mbps, wire_bw_mbps, bytes_moved,
#   logical_bytes, get_count, compression, decode_step, subprocess_spawns,
#   temp_file_bytes, max_rss_kb, ...).
#
#   READ THE FAIRNESS COLUMNS. agg_bw_mbps is logical-bytes throughput on both
#   sides and is directly comparable; wire_bw_mbps is what crossed the network.
#   With zstd out of the grid these two now agree on both stacks, and a gap
#   between them means something other than compression. CLIO additionally
#   lands its bytes in a distributed CTE tag while Zarr lands a NumPy array in
#   one process's heap — CLIO does strictly more work, so Zarr's number is NOT
#   "CLIO minus overhead". See docs/CLIO_S3_BENCH.md.

scheduler:
  name: slurm
  job_name: clio_s3_read_bench
  nodes: 1
  ntasks_per_node: 1
  # Must stay large: Ares Slurm uses proctrack/cgroup with ConstrainCores, and
  # the S3 assimilator blocks a whole runtime worker thread on waitpid() for
  # the duration of each GET. A narrow cgroup silently caps concurrency.
  cpus_per_task: 40
  partition: compute
  # 18 h for a ~10.4 h sweep. The margin is not padding, it is variance cover:
  # the SAME 32 MiB / K=1 cell measured 6.95 and 10.59 MB/s on different jobs
  # (23911 vs 23923), a 1.5x swing on a shared WAN link, and the whole sweep is
  # link-bound. At the slow end ~10.4 h becomes ~15.6 h. Slurm bills actual
  # usage, not the request, so over-asking costs only queue priority -- whereas
  # under-asking truncates the tail of results.csv. Budget basis: each of the 36
  # rows moves 2 GiB through THREE engines = 6 GiB, ~546 s of pure transfer at
  # the measured ~11.2 MB/s ceiling, plus per-request overhead that dominates at
  # fine granularity (the 512 KiB / K=1 cell alone is 3930.9 s; job 23924).
  # Check the cap before raising further: scontrol show partition compute.
  time: "18:00:00"
  output: ${HOME}/clio_s3_read-%j.out
  error: ${HOME}/clio_s3_read-%j.err
  # MUST stay literally identical to config.hostfile below.
  hostfile: "${HOME}/.jarvis-s3-bench/clio_s3_read_hostfile.txt"
  pre_cmds:
    # 1) Toolchain. Pure PATH prepends -- never `spack load` / `conda activate`
    #    (they install shell functions that misbehave under `set -euo pipefail`).
    - 'export PATH="${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/bin:${JARVIS_VENV:-$HOME/jarvis-venv}/bin:$PATH"'
    - 'export LD_LIBRARY_PATH="${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/lib:${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/lib64:${LD_LIBRARY_PATH:-}"'
    - 'command -v clio_run           >/dev/null 2>&1 || { echo "ERROR: clio_run not on PATH (view: ${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view})" >&2; exit 1; }'
    - 'command -v clio_s3_read_bench >/dev/null 2>&1 || { echo "ERROR: clio_s3_read_bench not on PATH — was IOWarp built with +cae +s3_cae?" >&2; exit 1; }'
    - 'command -v cae_s3_tool        >/dev/null 2>&1 || { echo "ERROR: cae_s3_tool not on PATH — was IOWarp built with +s3_cae?" >&2; exit 1; }'
    - 'command -v jarvis             >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH (venv: ${JARVIS_VENV:-$HOME/jarvis-venv})" >&2; exit 1; }'
    - '"${ZARR_VENV:-$HOME/zarr-venv}/bin/python3" -c "import zarr,s3fs,numpy" || { echo "ERROR: zarr venv broken at ${ZARR_VENV:-$HOME/zarr-venv}" >&2; exit 1; }'
    - 'echo "toolchain: clio_run=$(command -v clio_run) bench=$(command -v clio_s3_read_bench) jarvis=$(command -v jarvis)"'
    # 1b) CAE runtime link gate. The s3:// read path is now IN-PROCESS over
    #     Poco+SigV4 (no fork+exec, no AWS SDK in the runtime). Assert the
    #     installed library actually is that build: Poco NetSSL present, AWS SDK
    #     ABSENT, and the CAE keep-alive tally literal present (which also proves
    #     the install post-dates this change -- a `spack develop` tree does not
    #     rebuild on `git pull`, so `spack install iowarp@dev` after every pull).
    - |
      echo "cae gate: host=$(hostname -s) time=$(date -Is)"
      CLIO_RUN_BIN="$(command -v clio_run || true)"
      LIB="${CLIO_RUN_BIN%/bin/clio_run}/lib/libclio_cae_core_runtime.so"
      [ -f "$LIB" ] || LIB="${LIB%/lib/*}/lib64/libclio_cae_core_runtime.so"
      [ -f "$LIB" ] || { echo "ERROR: libclio_cae_core_runtime.so not found under the install root" >&2; exit 1; }
      echo "cae gate: lib -> $(readlink -f "$LIB" 2>&1 || true)"
      LDD_OUT="$(ldd "$LIB" 2>&1)" || { echo "ERROR: ldd failed on $LIB:" >&2; printf '%s\n' "$LDD_OUT" >&2; exit 1; }
      printf '%s\n' "$LDD_OUT" | grep -q PocoNetSSL || { echo "ERROR: $LIB has no Poco NetSSL — CAE built without the in-process S3 path?" >&2; exit 1; }
      printf '%s\n' "$LDD_OUT" | grep -q aws-cpp-sdk && { echo "ERROR: $LIB links the AWS SDK — that stack-smashes runtime init" >&2; exit 1; }
      KA_RC=0
      KA_COUNT="$(grep -acF "CAE S3 keepalive" "$LIB")" || KA_RC=$?
      echo "cae gate: keepalive tally matches = ${KA_COUNT:-0} (grep rc=$KA_RC)"
      [ "$KA_RC" -le 1 ] || { echo "ERROR: could not read $LIB (grep exit $KA_RC)" >&2; exit 1; }
      [ "${KA_COUNT:-0}" -ge 1 ] || {
        echo "ERROR: $LIB PREDATES the in-process persistent-connection read path." >&2
        echo "  Rebuild first:  spack install iowarp@dev" >&2
        exit 1; }
      echo "cae link check OK: $LIB (Poco present, no AWS SDK, CAE keepalive tally present)"
    # 2) AWS credentials. NO SECRETS IN THIS FILE. Credentials live in
    #    ~/.aws/credentials (mode 600); both the AWS C++ SDK default chain
    #    (cae_s3_tool) and botocore (s3fs) read it. Only non-secret profile and
    #    region names appear here.
    - 'export AWS_PROFILE="${S3_BENCH_PROFILE:-clio-bench}"'
    - 'export AWS_DEFAULT_REGION="${S3_BENCH_REGION:-us-east-1}"'
    # Real AWS: an endpoint override flips cae_s3_tool to path-style addressing
    # against a nonexistent host, so both must stay unset.
    - 'unset S3_ENDPOINT AWS_ENDPOINT_URL'
    - '[ -r "$HOME/.aws/credentials" ] || { echo "ERROR: ~/.aws/credentials missing/unreadable" >&2; exit 1; }'
    - '[ -n "${S3_BENCH_BUCKET:-}" ] || { echo "ERROR: S3_BENCH_BUCKET not set" >&2; exit 1; }'
    # 3) The runtime no longer forks cae_s3_tool for the read path (it signs and
    #    streams in-process over Poco, resolving credentials from AWS_PROFILE ->
    #    ~/.aws/credentials with HOME already in the daemon env). But the raw-GET
    #    FLOOR (s3_raw_get_bench) still drives cae_s3_tool, so keep it on PATH and
    #    give it a node-local TMPDIR with room for concurrency * object_size.
    - 'export CAE_S3_TOOL="$(command -v cae_s3_tool)"'
    - 'export TMPDIR=/tmp/clio_s3_bench; mkdir -p "$TMPDIR"'
    # 4) Stale-state cleanup. pkill patterns are BRACKETED so they never match
    #    this script's own argv.
    - 'pkill -9 -f "[c]himaera" 2>/dev/null || true'
    - 'pkill -9 -f "[c]lio_run" 2>/dev/null || true'
    - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
    - 'rm -f /dev/shm/chi_* 2>/dev/null || true'
    - 'rm -rf "$TMPDIR"/cae_s3_* /tmp/iowarp_chi* 2>/dev/null || true'
    # 5) Experiment dirs + repo registration + clean slate (the sweep runner
    #    RESUMES over an existing results.csv and would skip failed rows).
    - 'mkdir -p "$HOME/clio_s3_read_results" "$HOME/.jarvis-s3-bench"'
    - 'jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true'
    - 'rm -f "$HOME/clio_s3_read_results/results.csv"'
  post_cmds:
    - 'RES="$HOME/clio_s3_read_results/results.csv"; n=$(grep -c success "$RES" 2>/dev/null || true); n=${n:-0}; echo "successful rows: $n / 36"'
    # A green row with a blank throughput column is a FAILURE, not a success.
    # Assert it here instead of leaving it to manual inspection.
    - |
      python3 - "$HOME/clio_s3_read_results/results.csv" <<'EOF'
      import csv, os, sys
      path = sys.argv[1]
      if not os.path.exists(path):
          print("NO RESULTS CSV AT", path); sys.exit(0)
      need = ["clio_s3.read.agg_bw_mbps", "zarr_s3.read.agg_bw_mbps",
              "raw_get.rawget.agg_bw_mbps"]
      rows = list(csv.DictReader(open(path)))
      bad = [r.get("run_idx") for r in rows
             if r.get("status") == "success" and any(not r.get(c) for c in need)]
      print("rows:", len(rows))
      print("GREEN ROWS WITH BLANK THROUGHPUT (== FAILURES):", bad or "none")
      EOF

config:
  name: clio_s3_read

  # MUST stay literally identical to scheduler.hostfile above.
  hostfile: "${HOME}/.jarvis-s3-bench/clio_s3_read_hostfile.txt"

  pkgs:
    - pkg_type: jarvis_clio_core.clio_runtime
      pkg_name: runtime
      num_threads: 16          # SWEPT with concurrency -- see the note above
      client_data_segment_size: "4G"
      port: 9413
      # IPC (unix socket), NOT shm: the benchmark is a detached client, not a
      # descendant of the runtime daemon, and Ares compute nodes run
      # ptrace_scope=1. SHM mode attaches the daemon's main segment by
      # reopening /proc/<server_pid>/fd via a memfd symlink, which ptrace_scope=1
      # denies for a non-descendant (shm_open -> EACCES, "Failed to initialize
      # Clio"). The unix-socket transport needs no /proc reopen; it is ~38x
      # faster than TCP (issue #768) so the throughput cost vs SHM is small.
      ipc_mode: "ipc"
      log_level: "info"
      # SWIM off: transient errors must not promote a peer to dead mid-bench.
      swim_enabled: false
      sleep: 4

    - pkg_type: jarvis_clio_core.clio_cte
      pkg_name: cte_core
      # 24 GB is ~12x the 2 GiB working set, so a row never spills or evicts.
      devices:
        - ["ram::cte_ram_tier1", "24GB", 1.0]
      dpe_type: "max_bw"
      neighborhood: 1
      pool_query: "local"

    - pkg_type: jarvis_clio_core.clio_s3_bench
      pkg_name: clio_s3
      mode: read
      bucket: "${S3_BENCH_BUCKET}"
      key_prefix: "clio-s3-read-bench/raw/33554432"   # SWEPT
      object_size: "32m"                              # SWEPT
      num_objects: 64                                 # SWEPT
      concurrency: 8                                  # SWEPT
      worker_threads: 16                              # SWEPT (reported only)
      tag_prefix: "s3rb"
      tmpdir: "/tmp/clio_s3_bench"
      aws_region: "${S3_BENCH_REGION}"
      # Set explicitly so the benchmark's env carries AWS_PROFILE deterministically;
      # the benchmark forwards region+profile into each assimilation context so the
      # ssh-launched runtime daemon's cae_s3_tool (which inherits neither) can sign
      # correctly. Without this the daemon defaults to us-east-1/anonymous.
      aws_profile: "${S3_BENCH_PROFILE}"
      verify: false

    - pkg_type: jarvis_clio_core.zarr_s3_bench
      pkg_name: zarr_s3
      mode: read
      bucket: "${S3_BENCH_BUCKET}"
      store_prefix: "clio-s3-read-bench"
      chunk_edge: 256                                 # SWEPT
      # Uncompressed only -- see the zstd note in the header. The staged
      # dataset still carries the zstd stores; nothing reads them.
      variants: ["none"]
      async_concurrency: 8                            # SWEPT
      aws_region: "${S3_BENCH_REGION}"
      venv: "${ZARR_VENV}"

    # Raw-GET wire-speed FLOOR: K concurrent `cae_s3_tool get` processes reading
    # the SAME obj_%06d.bin keys the CLIO row reads. It is the only thing a CLIO
    # read number is attributable against (report ratio-to-floor, not absolute
    # MB/s). key_prefix/object_size/num_objects/concurrency mirror clio_s3 so the
    # two measure identical work. NOTE it is NOT a floor at K=1 (serialized
    # spawn + temp file per object only pipelines at K>=8).
    - pkg_type: jarvis_clio_core.s3_raw_get_bench
      pkg_name: raw_get
      bucket: "${S3_BENCH_BUCKET}"
      key_prefix: "clio-s3-read-bench/raw/33554432"   # SWEPT (== clio_s3.key_prefix)
      object_size: "32m"                              # SWEPT
      num_objects: 64                                 # SWEPT
      concurrency: 8                                  # SWEPT
      s3_tool: "cae_s3_tool"
      tmpdir: "/tmp/clio_s3_bench"
      aws_region: "${S3_BENCH_REGION}"
      aws_profile: "${S3_BENCH_PROFILE}"

vars:
  # --- Granularity: bytes per request. Zipped, length 4. ---
  # Chunk edge c -> c^3 * 2 bytes:
  #   512 -> 256 MiB / 8 objs ; 256 -> 32 MiB / 64 ;
  #   128 -> 4 MiB / 512      ; 64  -> 512 KiB / 4096
  # Total bytes stay 2 GiB in every row; only request COUNT varies.
  #
  # ORDERED LARGEST-FIRST ON PURPOSE -- do not "tidy" this back to ascending.
  # results.csv is written incrementally, so an allocation overrun truncates the
  # TAIL of the sweep. Two measurements decide which tail is cheapest to lose:
  # (a) 512 KiB is by far the most expensive column (3930.9 s for its K=1 cell
  # alone, vs 885 s at 32 MiB), and (b) it is the LEAST informative one --
  # CLIO's edge over Zarr GROWS with object size (K=1: 1.0008x at 512 KiB,
  # 1.73x at 32 MiB), because at small granularity both stacks are pinned by the
  # same serial S3 round-trip and connection reuse cannot remove a round-trip
  # you have to wait for. So the headline lives at 256 MiB and the filler at
  # 512 KiB; running big-to-small means a kill costs the filler.
  clio_s3.key_prefix:  ["clio-s3-read-bench/raw/268435456",
                        "clio-s3-read-bench/raw/33554432",
                        "clio-s3-read-bench/raw/4194304",
                        "clio-s3-read-bench/raw/524288"]
  clio_s3.object_size: ["256m", "32m", "4m", "512k"]
  clio_s3.num_objects: [8, 64, 512, 4096]
  zarr_s3.chunk_edge:  [512, 256, 128, 64]
  # The raw-GET floor reads the same keys/sizes/counts as the CLIO row.
  raw_get.key_prefix:  ["clio-s3-read-bench/raw/268435456",
                        "clio-s3-read-bench/raw/33554432",
                        "clio-s3-read-bench/raw/4194304",
                        "clio-s3-read-bench/raw/524288"]
  raw_get.object_size: ["256m", "32m", "4m", "512k"]
  raw_get.num_objects: [8, 64, 512, 4096]

  # --- Concurrency. Zipped, length 3. ---
  # runtime.num_threads rides along because the S3 assimilator blocks a runtime
  # worker for the whole in-process GET: with too few workers, raising CLIO's
  # concurrency buys nothing. The port removed the per-object fork+exec cost, NOT
  # this worker-blocking ceiling. clio_s3.worker_threads mirrors the value into
  # the fairness columns so every row records the confound.
  clio_s3.concurrency:       [1, 8, 32]
  zarr_s3.async_concurrency: [1, 8, 32]
  runtime.num_threads:       [4, 16, 48]
  clio_s3.worker_threads:    [4, 16, 48]
  raw_get.concurrency:       [1, 8, 32]

loop:
  - [clio_s3.key_prefix, clio_s3.object_size, clio_s3.num_objects,
     zarr_s3.chunk_edge,
     raw_get.key_prefix, raw_get.object_size, raw_get.num_objects]
  - [clio_s3.concurrency, zarr_s3.async_concurrency, runtime.num_threads,
     clio_s3.worker_threads, raw_get.concurrency]

# Per-combination wall-clock backstop. Expiry marks that row failed and the
# sweep continues, so one wedged row can no longer lose the other 35.
#
# 5400 is set from measurement, not taste: the 512 KiB / K=1 cell took 3930.9 s
# (job 23924, clio_s3_read_probe.yaml) -- 4096 requests x ~0.27 s serial, paid
# three times over because all three engines run it. At the old 1800 the kill
# landed inside zarr_s3 (cumulative CLIO 1121 s, Zarr 2243 s, floor 3918 s) and
# EVERY 512 KiB row would have been voided. 5400 leaves ~37% headroom on that
# worst cell; do not lower it without re-running the probe.
run_timeout: 5400

repeat: 3
output: "${HOME}/clio_s3_read_results"
