name: GPU Tests (CUDA)

on:
  # Push to main/dev runs UNCONDITIONALLY -- no path filter. A merge is the
  # gate that decides what lands, so it must exercise everything; a path
  # filter here meant a merge touching only, say, CI or docs skipped the CUDA
  # compile entirely, and the next unrelated merge inherited the breakage.
  # PRs keep the path filter (below): breadth on every PR commit costs queue
  # time for little signal, and the merge sweep still gates the branch.
  push:
    branches: [main, dev]
  # Also run on PRs touching the same paths. Previously this workflow fired
  # ONLY on push to main/dev, so a change that broke the CUDA device compile
  # was invisible in PR review and only surfaced after merge, on dev — which
  # is exactly how the shm_metadata_cache.h device-pass break (#812, from
  # #788) landed. Running the same compile-only build on PRs catches these
  # before merge. Same path filter, so PRs that don't touch buildable source
  # still skip it.
  pull_request:
    branches: [main, dev]
    paths:
      - 'context-runtime/**'
      - 'context-transfer-engine/**'
      - 'context-transport-primitives/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'installers/conda/**'
      - '.github/workflows/gpu-tests.yml'
  workflow_dispatch:

# One in-flight run per ref; a new push to a PR branch cancels the previous
# GPU build rather than piling them up (the CUDA toolchain install + conda
# build is ~15 min).
concurrency:
  group: gpu-tests-${{ github.ref }}
  # Cancel superseded runs on PR branches only. On a SHARED branch (main/dev)
  # github.ref is identical for every merge, so `true` here made each merge
  # cancel the PREVIOUS merge's validation mid-flight -- which is exactly the
  # "lots of skipped tests after merging" symptom, and it silently drops the
  # coverage that decides what is on dev. A merge's run must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-cuda-conda:
    name: Build CUDA conda package (compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    # ── Install CUDA toolkit ──────────────────────────────────────────
    - name: Install CUDA toolkit
      run: |
        if ! command -v nvcc &>/dev/null; then
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-toolkit-12-6 cuda-driver-dev-12-6
        fi
        echo "/usr/local/cuda/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

    - name: Verify CUDA
      run: nvcc --version

    # ── Install Miniconda + conda-build ──────────────────────────────
    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: false
        # Pin a py312-base Miniconda: the runner's bundled conda moved its
        # base to Python 3.14 (2026-07-30), which crashes conda-build
        # (execute_download_actions IndexError). See CI/ci-deps.sh.
        miniconda-version: 'py312_26.5.3-2'
        python-version: '3.12'
        activate-environment: iowarp

    # conda-build is a plugin registered against the BASE env's conda CLI and
    # must be installed there (see installers/conda + CI/ci-deps.sh). Without
    # `-n base` this installs conda-build into the active `iowarp` env, leaving
    # an `iowarp/bin/conda` ahead of base on PATH that can't import the `conda`
    # module — so conda-build's build-env activation crashes the recipe with
    # "ModuleNotFoundError: No module named 'conda'".
    - name: Install conda-build
      shell: bash -el {0}
      run: conda install -n base -y conda-build -c conda-forge

    # ── Build CUDA conda package via CI/ci-deps.sh ──────────────────────
    - name: Build CUDA conda package
      shell: bash -el {0}
      run: |
        chmod +x CI/ci-deps.sh
        ./CI/ci-deps.sh cuda-release

    # ── Verify installation ──────────────────────────────────────────
    - name: Verify CUDA package installed
      shell: bash -el {0}
      run: |
        conda list iowarp
        test -f "$CONDA_PREFIX/lib/libclio_run_cxx.so"
        test -f "$CONDA_PREFIX/lib/libclio_run_cxx_gpu.so"
        echo "CUDA conda package installed successfully"

    # ── Compile the GPU tests (no GPU needed) ────────────────────────
    # nvcc compiles CUDA without a device, so the GPU TESTS can at least be
    # BUILT on a normal runner even while they cannot be RUN. That matters
    # here: the conda recipe above does not build tests, so until this step
    # existed nothing in CI ever compiled the gpu_vector tests or the
    # yieldable kernels, and a change that broke them was invisible.
    #
    # The in-kernel nvcomp decoder needs the device API, which the distro
    # nvcomp package does not ship (host/manager API only). cmake FETCHES the
    # standalone archive, pinned by SHA256, so this needs no runner setup and
    # no hand-placed directory. If the download is unavailable the build still
    # succeeds and cte_gpu_vector_hbm_nvcomp SKIPS, rather than silently
    # measuring the scalar LZ4 fallback and calling it nvcomp.
    - name: Compile GPU tests (compile-only, no device)
      shell: bash -el {0}
      run: |
        cmake -S . -B build-gpu-compile \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=ON \
          -DCLIO_CORE_ENABLE_CUDA=ON
        cmake --build build-gpu-compile -j "$(nproc)" \
          --target test_yieldable test_yield_stack \
                   test_gpu_vector_smoke test_gpu_vector_semantics \
                   test_gpu_vector_workloads test_gpu_vector_compress \
                   test_gpu_vector_race test_gpu_vector_hbm_nvcomp \
                   clio_gpu_vector_weights_bench

    # NOTE: GPU tests are disabled until self-hosted GPU runners are available.
    # To re-enable, change runs-on to [self-hosted, gpu], add nvidia-smi
    # verification step, and uncomment the test steps below.
    #
    # - name: Run GPU unit tests
    #   shell: bash -el {0}
    #   working-directory: build
    #   run: |
    #     ctest -R "cte_gpu_tiered_test|cte_gpu_coroutine|cte_gpu_core_all|cte_gpu_create" \
    #       --output-on-failure --timeout 120
    #
    # - name: Run GPU runtime tests
    #   shell: bash -el {0}
    #   working-directory: build
    #   run: |
    #     ctest -R "test_gpu_runtime|cr_gpu_client_process|cr_gpu_parallelism|cr_gpu_runtime_tests|cr_gpu_task_trace|test_gpu_pod_transfer|clio_run_bdev_gpu_kernel|cr_bdev_gpu" \
    #       --output-on-failure --timeout 120
    #
    # - name: Run GPU allocator tests
    #   shell: bash -el {0}
    #   working-directory: build
    #   run: |
    #     ctest -R "test_gpu_shm_mmap|test_local_serialize_gpu|test_local_transfer_gpu|test_buddy_alloc_gpu|test_buddy_alloc_stack_gpu|test_thread_alloc_gpu|test_round_robin_alloc_gpu|test_ipc_allocate_buffer_gpu|test_buddy_benchmark_gpu" \
    #       --output-on-failure --timeout 120
    #
    # - name: Run gpu_vector paging tests
    #   shell: bash -el {0}
    #   working-directory: build
    #   run: |
    #     # RUN_SERIAL: these share a runtime port and SHM; -j gives false
    #     # failures. cte_gpu_vector_hbm_nvcomp is the one that asserts the
    #     # GPU-only contract (kHBM-only tier, nvcomp, device-to-device,
    #     # yielding faults). It SKIPS only if the nvcomp device archive could
    #     # not be fetched at configure time.
    #     ctest -R "cte_gpu_vector" --output-on-failure --timeout 900
