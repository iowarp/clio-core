name: Leak Diagnostic (temp)

# TEMPORARY diagnostic for #563: determine whether cte_tag_force_net /
# cte_query_force_net hang in CI because of the leak-detection build, or whether
# they hang under a plain release build too (i.e. a pre-existing reorganize
# wedge). Builds the release preset with io_uring OFF (so the ONLY difference
# from the leak-check build is the absence of CLIO_CORE_ENABLE_LEAK_CHECK), then
# runs the two suspect tests. Delete this workflow once the question is settled.

on:
  push:
    branches: [563-leak-detection]
  workflow_dispatch:

jobs:
  control-no-leak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev liburing-dev

    - name: Install dependencies (conda env)
      run: |
        chmod +x install.sh
        ./install.sh --only-deps

    - name: Build release (NO leak flag, io_uring off) and run suspect tests
      run: |
        if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
          source "$HOME/miniconda3/etc/profile.d/conda.sh"
        elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
          source "$HOME/anaconda3/etc/profile.d/conda.sh"
        elif command -v conda &>/dev/null; then
          eval "$(conda shell.bash hook)"
        fi
        conda activate iowarp
        cmake --preset=release -DCLIO_CORE_ENABLE_IO_URING=OFF -DCLIO_CORE_ENABLE_PYTHON=OFF
        cmake --build build -j"$(nproc)"
        ctest --test-dir build \
          -R "cte_tag_force_net|cte_query_force_net" \
          --output-on-failure --no-tests=error
