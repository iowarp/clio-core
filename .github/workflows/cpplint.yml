name: cpplint
# Scoped to main/dev (#921). The bare `on: [push, pull_request]` fired twice for
# every PR -- once for the branch push, once for the PR -- and also on pushes to
# branches with no PR open, where nobody reads the result.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Merge queue (issue #1013): same full-matrix-before-merge rationale as the
  # other gates -- see ci-adapters.yml.
  merge_group:
jobs:
  cpplint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - run: pipx run cpplint --recursive .
