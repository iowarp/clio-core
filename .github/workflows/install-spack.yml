name: Spack Install Test

on:
  push:
    branches: [main]
    paths:
      - 'installers/spack/**'
  workflow_dispatch:

jobs:
  spack-install:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Checkout spack
      uses: actions/checkout@v4
      with:
        repository: spack/spack
        path: ./spack

    - name: Install IOWarp via spack
      run: |
        . ./spack/share/spack/setup-env.sh
        spack repo add installers/spack
        spack install iowarp+posix
        spack load iowarp+posix

    # A variant that maps to a dead CMake flag still installs cleanly, so
    # check the feature was actually built (#1194).
    - name: Verify the POSIX adapter was installed
      run: |
        . ./spack/share/spack/setup-env.sh
        prefix=$(spack location -i iowarp+posix)
        lib=$(find "$prefix" -name 'libclio_cte_posix.so*' | head -1)
        if [ -z "$lib" ]; then
          echo "::error::iowarp+posix installed without libclio_cte_posix.so"
          exit 1
        fi
        echo "found $lib"
