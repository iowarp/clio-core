name: CI macOS

# Consolidated macOS build-and-test pipeline (issue #649). One workflow per OS:
# the real macOS unit-test build (formerly mac-test.yml — build-and-test.yml's
# macOS half only built the conda package and never ran ctest) plus the
# Boost.Context coroutine variant as a parallel job, replacing the macOS halves
# of build-and-test.yml, mac-test.yml, and boost-coroutines.yml.
# Runs on every PR and on push to main/dev (per #649 decision).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Merge queue (issue #1013): the full matrix -- macFUSE, WinFsp, the boost
  # backend, the wide macOS sweep -- is gated on `event_name != pull_request`,
  # so it never ran on a PR and only spoke up AFTER the merge, on dev, where a
  # single bad commit turns every later push red. A merge_group run is that
  # same full matrix executed on the PROSPECTIVE merge commit, before it lands.
  # Cost is unchanged for PRs; dev stops being where breakage is discovered.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  # Cancel superseded runs on PR branches only. On a SHARED branch (main/dev)
  # github.ref is identical for every merge, so `true` here made each merge
  # cancel the PREVIOUS merge's validation mid-flight -- which is exactly the
  # "lots of skipped tests after merging" symptom, and it silently drops the
  # coverage that decides what is on dev. A merge's run must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Matrix tier selection (issue #921) -----------------------------------
  # A pull request builds ONE representative macOS runner; the full arm64 +
  # Intel, macOS 14 -> 26 sweep runs on push to main/dev. Breadth on every PR
  # commit bought little: the five runners fail together on real breakage, so
  # what the extra four mostly added was more chances to hit a flake, more
  # queue time, and more reruns. The sweep still gates what lands, just at the
  # merge point instead of on every push to a branch.
  #
  # macos-15 (arm64) is the PR runner: current-generation Apple silicon, the
  # default arch for contributors, and where cr_cli_cfs_rename surfaced.
  matrix-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'os=["macos-15"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["macos-14","macos-15","macos-15-intel","macos-26","macos-26-intel"]' >> "$GITHUB_OUTPUT"
          fi

  # ---- Standard build + ctest (arm64 + Intel, macOS 14 -> 26) ---------------
  build-test:
    name: build-test (${{ matrix.os }})
    needs: matrix-tier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-tier.outputs.os) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (conda)
        run: |
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh --only-deps release

      - name: Configure and build
        run: |
          set -x
          # Re-activate the conda env created by CI/ci-deps.sh (env vars do
          # not persist across GitHub Actions steps).
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda >/dev/null 2>&1; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp

          export CMAKE_PREFIX_PATH="${CONDA_PREFIX}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          export PKG_CONFIG_PATH="${CONDA_PREFIX}/lib/pkgconfig:${CONDA_PREFIX}/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          # Pin ar/ranlib to the Xcode toolchain, not conda's llvm-tools
          # (issue #797 has the full rationale). Short version: CMake otherwise
          # detects conda's llvm-ranlib from the package cache, which cannot
          # load its own runtime dylib and aborts static-lib archiving
          # intermittently. System ar/ranlib have no such dependency and are
          # correct here (this project builds no LTO/bitcode archives). NOTE:
          # keep this comment free of the literal dyld-error string — the step
          # runs under `set -x`, so any such line is echoed into every macOS
          # build log and reads like a live failure.
          AR_BIN="$(xcrun -f ar 2>/dev/null || echo /usr/bin/ar)"
          RANLIB_BIN="$(xcrun -f ranlib 2>/dev/null || echo /usr/bin/ranlib)"

          # SITE/BUILDNAME label the CDash build (cnd = conda deps, d = debug).
          cmake --preset=debug \
            -DCMAKE_AR="${AR_BIN}" \
            -DCMAKE_RANLIB="${RANLIB_BIN}" \
            -DSITE="${{ matrix.os }}" \
            -DBUILDNAME="cnd/d" \
            -DCLIO_CORE_ENABLE_COVERAGE=OFF \
            -DCLIO_CORE_ENABLE_CONDA=ON \
            -DCLIO_CORE_ENABLE_DOCKER_CI=OFF \
            -DCLIO_CTE_ENABLE_ADIOS2_ADAPTER=OFF \
            -DCLIO_CTE_ENABLE_COMPRESS=OFF \
            -DCLIO_CORE_ENABLE_GRAY_SCOTT=OFF

          cmake --build build -- -j"$(sysctl -n hw.ncpu)"

      - name: Run ctest
        run: |
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda >/dev/null 2>&1; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp

          cd build
          # -T Test writes the dashboard XML once for the CDash step. Retry
          # intermittently-flaky in-process-runtime tests up to 3x (#482/#485).
          ctest -T Test --output-on-failure --timeout 120 --repeat until-pass:3 \
            -LE "integration|restart|functional|query|stress|docker|flaky" \
            -E "cr_bdev_|cr_mpi_|cr_per_process_shm_stress|cte_tag_large|cte_tiered_storage_all|cte_tiered_dram_default_all|cte_reorganize_all"

      - name: Submit results to CDash
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda >/dev/null 2>&1; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp || true
          cd build
          ctest -T Submit || true

      - name: Summarize failed tests
        if: always()
        run: |
          LOG="build/Testing/Temporary/LastTest.log"
          echo "## macOS test summary (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "Test #|\*\*\*Failed|\*\*\*Exception|Passed|Failed" "$LOG" \
              | grep -E "Failed|Exception" >> "$GITHUB_STEP_SUMMARY" || \
              echo "(no failures parsed from LastTest.log)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(LastTest.log not found)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report retried-but-passed tests
        if: always()
        shell: bash
        # A green check must not mean "some test failed and we retried until it
        # did not" (#921). Reports only -- never fails the job.
        run: bash CI/report_flaky_tests.sh build/Testing/Temporary/LastTest.log "macos ${{ matrix.os }}"

      - name: Upload test logs
        if: always()
        # Never let the artifact service sink an otherwise-green job (#921).
        # These logs are diagnostics; the verdict already came from "Run tests".
        # Seen on PR #920: build-test (windows-11-arm) passed every one of its
        # tests, then failed the job on an upload-artifact BlobNotFound.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-logs-${{ matrix.os }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/CTestCostData.txt
          if-no-files-found: warn

  # ---- Boost.Context stackful coroutine backend (#620) ----------------------
  boost:
    name: boost (${{ matrix.os }})
    # Push-only (#921): the Boost.Context coroutine backend is a build variant,
    # not an arch. It gates main/dev rather than every PR commit.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies (conda env, incl. Boost.Context)
        run: |
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh --only-deps release
      - name: Build with Boost backend + run ctest
        run: |
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda &>/dev/null; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          # Pin ar/ranlib to Xcode's, not conda's llvm-tools — see the
          # "Configure and build" step above and #797.
          AR_BIN="$(xcrun -f ar 2>/dev/null || echo /usr/bin/ar)"
          RANLIB_BIN="$(xcrun -f ranlib 2>/dev/null || echo /usr/bin/ranlib)"
          cmake --preset boost \
            -DCMAKE_AR="${AR_BIN}" \
            -DCMAKE_RANLIB="${RANLIB_BIN}"
          cmake --build build-boost -j"$(sysctl -n hw.ncpu)"
          # #619's fallback-runtime punting has no macOS support yet (#634);
          # those cases are excluded until it lands.
          ctest --test-dir build-boost --output-on-failure --timeout 180 --repeat until-pass:3 \
            -LE "ollama|flaky" -E "cr_cli_cte_fallback|cr_cli_fallback_runtime|cte_tag_large|cte_tiered_storage_all|cte_tiered_dram_default_all|cte_reorganize_all"
      - name: Report retried-but-passed tests
        if: always()
        shell: bash
        # A green check must not mean "some test failed and we retried until it
        # did not" (#919/#921). Reports only -- never fails the job.
        run: bash CI/report_flaky_tests.sh build-boost/Testing/Temporary/LastTest.log "macos boost ${{ matrix.os }}"
