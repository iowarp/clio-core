name: CI Linux

# Consolidated Linux build-and-test pipeline (issue #649). One workflow per OS:
# the standard release+coverage build plus every Linux flag-variant as a
# parallel job in the SAME workflow, replacing four separate files —
#   build-and-test.yml (Linux half), boost-coroutines.yml (docker/linux/arm),
#   sanitizers.yml (asan/ubsan/msan), and leak-check.yml.
# All variants run on every PR and on push to main/dev (per #649 decision).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Merge queue (issue #1013): the full matrix -- macFUSE, WinFsp, the boost
  # backend, the wide macOS sweep -- is gated on `event_name != pull_request`,
  # so it never ran on a PR and only spoke up AFTER the merge, on dev, where a
  # single bad commit turns every later push red. A merge_group run is that
  # same full matrix executed on the PROSPECTIVE merge commit, before it lands.
  # Cost is unchanged for PRs; dev stops being where breakage is discovered.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-linux-${{ github.ref }}
  # Cancel superseded runs on PR branches only. On a SHARED branch (main/dev)
  # github.ref is identical for every merge, so `true` here made each merge
  # cancel the PREVIOUS merge's validation mid-flight -- which is exactly the
  # "lots of skipped tests after merging" symptom, and it silently drops the
  # coverage that decides what is on dev. A merge's run must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Phased build + ctest + coverage --------------------------------------
  # Each phase builds only the config it needs, runs only its labeled tests, and
  # uploads coverage scoped to the code it exercises under its own Codecov flag
  # (issue: phased coverage). Codecov merges the flags (carryforward on) into one
  # report. The multi-node cluster phase (deps-cpu container + docker-compose
  # node containers, with gcov pulled out of the nodes) is folded in next; until
  # then it still runs, without coverage, in cluster-tests.yml.
  # ---- Matrix tier selection (issue #921) -----------------------------------
  # A pull request runs `unit amd64` and `cae`; the full phase sweep runs on
  # push to main/dev. Every PR commit fanning out to six phases plus four
  # variant jobs made Linux the slowest gate and multiplied flake exposure
  # without multiplying signal -- the remaining phases each scope themselves to
  # one subtree and rarely fail alone. They still gate what lands, at the merge
  # point rather than on every push to a branch.
  #
  # `unit amd64` is a PR phase because it is the only one that runs the core
  # suite (everything except adapter/integration/docker/cae/cee), so a
  # regression in the runtime, transport, or CTE shows up there first.
  #
  # `cae` is a PR phase because it is the ONLY phase that runs the CAE suite at
  # all: those tests are label-gated (`ctest -L cae`) and the `unit` phase's
  # default exclude set drops every CAE test carrying `integration` -- which is
  # most of the ones that exercise a live runtime, since that label is what
  # keeps them off macOS (issue #504). Without this phase a PR touching CAE
  # skipped its own tests entirely and reported near-zero patch coverage, so a
  # CAE regression only surfaced after merge. It is amd64-only and scoped to
  # */context-assimilation-engine/*, so it adds one job, not a sweep.
  #
  # The phase list lives here as JSON rather than as a `strategy.matrix.include`
  # block because a job-level `if:` cannot see the `matrix` context -- filtering
  # has to happen before the matrix expands. Field notes, previously inline on
  # each entry:
  #
  #   unit       Everything except adapter/integration/docker/cae/cee (empty
  #              labels => the script's default exclude set). ENABLE_LLAMA
  #              without LLAMA_SERVER builds just the llm-hooks kvcache/lmcache
  #              libraries and their store tests (CTE-only, no llama.cpp
  #              external) -- otherwise that code has zero CI coverage.
  #   fuse       Native libfuse3; system fuse3.pc lives in the pkgconfig path
  #              below, since the conda build otherwise only sees the conda
  #              env's path and reports FUSE3 missing. Live-mount suites are
  #              excluded (a real FUSE mount needs /dev/fuse + privileges) and
  #              run in ci-adapters' mount-smoke step. `extract` covers BOTH
  #              the adapter tree and the filesystem (CFS) tree: the adapter
  #              sits on the CFS client+runtime and the fuse|adapter tests
  #              exercise it, so extracting adapter/* alone silently dropped
  #              context-transfer-engine/filesystem/** and made it read 0% on
  #              Codecov. cdash_scope keeps the CDash headline scoped to the
  #              adapter (== the codecov "fuse" component) instead of a
  #              whole-repo number diluted by code the fuse-only selection does
  #              not exercise.
  #   cae/cee    Context Assimilation / Exploration Engine.
  #   prediction Stands up the real Python model server and drives a LightGBM
  #              inference through the C++ prediction path and the bdev
  #              Monitor("stats") entry point. Needs the Git-LFS models and the
  #              server's Python deps, both installed in the job below.
  matrix-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phases: ${{ steps.pick.outputs.phases }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        shell: bash
        run: |
          cat > /tmp/phases.json <<'JSON'
          [
            {"phase":"unit","arch":"amd64","os":"ubuntu-24.04","site":"ubu-24.amd64.unit","flag":"unit","apt":"","cmake_args":"-DCLIO_CORE_ENABLE_LLAMA=ON","labels":"","extract":""},
            {"phase":"unit","arch":"arm64","os":"ubuntu-24.04-arm","site":"ubu-24.arm64.unit","flag":"unit","apt":"","cmake_args":"-DCLIO_CORE_ENABLE_LLAMA=ON","labels":"","extract":""},
            {"phase":"fuse","arch":"amd64","os":"ubuntu-24.04","site":"ubu-24.amd64.fuse","flag":"fuse","apt":"libfuse3-dev fuse3","pkgconfig":"/usr/lib/x86_64-linux-gnu/pkgconfig","cmake_args":"-DCLIO_CTE_ENABLE_FUSE_ADAPTER=ON -DCLIO_CTE_ENABLE_FILESYSTEM=ON","labels":"fuse|adapter","exclude_labels":"docker|copy_workspace|integration","extract":"*/context-transfer-engine/adapter/* */context-transfer-engine/filesystem/*","cdash_scope":"context-transfer-engine/adapter"},
            {"phase":"cae","arch":"amd64","os":"ubuntu-24.04","site":"ubu-24.amd64.cae","flag":"cae","apt":"","cmake_args":"-DCLIO_CORE_ENABLE_CAE=ON","labels":"cae","extract":"*/context-assimilation-engine/*"},
            {"phase":"cee","arch":"amd64","os":"ubuntu-24.04","site":"ubu-24.amd64.cee","flag":"cee","apt":"","cmake_args":"-DCLIO_CORE_ENABLE_CEE=ON","labels":"cee","extract":"*/context-exploration-engine/*"},
            {"phase":"prediction","arch":"amd64","os":"ubuntu-24.04","site":"ubu-24.amd64.prediction","flag":"prediction","apt":"python3-venv","cmake_args":"","labels":"prediction_e2e","extract":"*/hw_failure_monitor/* */context-transport-primitives/src/system_info.cc */context-runtime/modules/bdev/*"}
          ]
          JSON
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            sel=$(jq -c '{include: [.[] | select((.phase == "unit" and .arch == "amd64") or .phase == "cae")]}' /tmp/phases.json)
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            sel=$(jq -c '{include: .}' /tmp/phases.json)
          fi
          echo "phases=$sel" >> "$GITHUB_OUTPUT"

  build-test:
    name: build-test (${{ matrix.phase }} ${{ matrix.arch }})
    needs: matrix-tier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-tier.outputs.phases) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install lcov (+ phase deps)
        run: |
          bash CI/retry.sh sudo apt-get update
          bash CI/retry.sh sudo apt-get install -y lcov ${{ matrix.apt }}
      - name: Install project dependencies (CI/ci-deps.sh)
        run: |
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh
      # The prediction phase's E2E tests SKIP without the trained models and the
      # server's Python deps; provide both so they actually run.
      - name: Pull prediction models (Git LFS)
        if: matrix.phase == 'prediction'
        run: git lfs pull --include="context-runtime/modules/bdev/hw_failure_monitor/models/*.pkl"
      - name: Install hw_failure_monitor server deps
        if: matrix.phase == 'prediction'
        run: |
          # Isolated venv (mirrors local validation) so the E2E driver's
          # interpreter definitely carries fastapi/uvicorn/scikit-learn/lightgbm/
          # joblib/pandas/numpy. Installing into the conda env instead left them
          # unreachable to the python3 that ctest's driver actually invokes, so
          # the tests SKIPped. Export the venv python via GITHUB_ENV as
          # PREDICT_PYTHON; the driver scripts prefer it over python3.
          python3 -m venv "$HOME/predenv"
          "$HOME/predenv/bin/pip" install --quiet --upgrade pip
          "$HOME/predenv/bin/pip" install --quiet -r context-runtime/modules/bdev/hw_failure_monitor/requirements.txt
          echo "PREDICT_PYTHON=$HOME/predenv/bin/python" >> "$GITHUB_ENV"
      - name: Calculate coverage (${{ matrix.phase }})
        env:
          PHASE_CMAKE_ARGS: ${{ matrix.cmake_args }}
          PHASE_CTEST_INCLUDE_LABELS: ${{ matrix.labels }}
          PHASE_CTEST_EXCLUDE_LABELS: ${{ matrix.exclude_labels }}
          PHASE_EXTRACT_PATHS: ${{ matrix.extract }}
          # Scope the CDash coverage submission (ctest_coverage has no include
          # filter, so the script excludes every other component). Unset phases
          # keep whole-build CDash coverage.
          PHASE_CDASH_KEEP: ${{ matrix.cdash_scope }}
          PKG_CONFIG_PATH: ${{ matrix.pkgconfig }}
        run: |
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda &>/dev/null; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          ./CI/calculate_coverage.sh --build --run-ctest --clean --site ${{ matrix.site }}
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage_filtered.info
          flags: ${{ matrix.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: iowarp/clio-core

  # ---- Boost.Context stackful coroutine backend (#620) ----------------------
  # Docker (deps-cpu) is the canonical reproducible build; native + arm64 cover
  # the io_uring path the container seccomp profile blocks, and the arm64 memory
  # model.
  boost-docker:
    name: boost (docker deps-cpu)
    # Push-only (#921): a coroutine-backend build variant, not an arch. It
    # gates main/dev rather than every PR commit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build with Boost backend + run ctest (inside deps-cpu)
        run: |
          # --shm-size: docker's default /dev/shm is 64 MB, far too small for the
          # clio runtime's GB-scale SHM segments; a 1 MB blob PutBlob in
          # cte_tiered_storage_all then fails (rc=21) where native builds pass.
          docker run --rm --shm-size=2g -v "${{ github.workspace }}":/workspace -w /workspace -u 0 \
            iowarp/deps-cpu:latest bash -c '
              set -e
              export LD_LIBRARY_PATH=/usr/local/lib:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
              export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
              git config --global --add safe.directory /workspace
              (dpkg -s libboost-context-dev >/dev/null 2>&1) || \
                (for i in 1 2 3; do apt-get update -qq && apt-get install -y -qq libboost-context-dev libboost-dev && break || sleep 5; done)
              cmake --preset boost
              cmake --build build-boost -j"$(nproc)"
              cd build-boost
              # -LE "force_net|flaky": the CLIO_FORCE_NET loopback-network stress
              # variants are single-node net-path tests (some CI-only flaky,
              # e.g. #579); they are covered by the leak + cluster jobs and do
              # not belong in this containerized build. Excluded by label so
              # new force_net tests are handled automatically.
              #
              # -E excludes tests incompatible with THIS docker variant
              # specifically -- they pass on the native amd64 + arm64 boost
              # jobs (verified), which provide the real coverage:
              #  * cte_tiered_storage_all and cte_tiered_dram_default_all --
              #    the reorganize-down leg intermittently fails a few blob
              #    PutBlobs with rc=7 (3/96) ONLY in the constrained deps-cpu
              #    container. Enlarging the slow file tier to hold the whole
              #    working set was tried and did NOT help, so the binding
              #    constraint is the deps-cpu container memory/CPU limits
              #    during the rapid Get/Del/Put reorganize burst, not the tier
              #    size. The
              #    failure count varies run to run (95 vs 93 /96), consistent
              #    with a transient container-resource limit rather than a code
              #    bug. Tracked for a deeper in-container bdev-allocation fix.
              #  * ctp_async_io -- unrelated deps-cpu incompatibility.
              ctest --output-on-failure --timeout 180 --repeat until-pass:3 -LE "ollama|force_net|flaky" -E "ctp_async_io|cte_tiered_storage_all|cte_tiered_dram_default_all"
            '

  boost-native:
    name: boost (${{ matrix.os }})
    # Push-only (#921): same reasoning as boost-docker, times two arches.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install system libraries
        run: |
          bash CI/retry.sh sudo apt-get update
          bash CI/retry.sh sudo apt-get install -y libhdf5-dev liburing-dev
      - name: Install dependencies (conda env, incl. Boost.Context)
        run: |
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh --only-deps
      - name: Build with Boost backend + run ctest
        run: |
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda &>/dev/null; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          cmake --preset boost
          cmake --build build-boost -j"$(nproc)"
          ctest --test-dir build-boost --output-on-failure --timeout 180 --repeat until-pass:3 -LE "ollama|flaky"
      - name: Report retried-but-passed tests
        if: always()
        shell: bash
        # A green check must not mean "some test failed and we retried until it
        # did not" (#919/#921). Reports only -- never fails the job.
        run: bash CI/report_flaky_tests.sh build-boost/Testing/Temporary/LastTest.log "linux boost ${{ matrix.os }}"

  # ---- Sanitizers: asan / ubsan / msan --------------------------------------
  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    needs: matrix-tier
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # asan on every PR -- it is the highest-yield of the three and catches
        # the memory errors most likely to reach review. ubsan and msan join on
        # push to main/dev (#921).
        sanitizer: ${{ needs.matrix-tier.outputs.full == 'true' && fromJSON('["asan","ubsan","msan"]') || fromJSON('["asan"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install sanitizer runtime libraries (ASan/UBSan)
        if: matrix.sanitizer != 'msan'
        run: |
          bash CI/retry.sh sudo apt-get update
          bash CI/retry.sh sudo apt-get install -y libasan8 libubsan1 libhdf5-dev
      - name: Install Clang for MSan
        if: matrix.sanitizer == 'msan'
        run: |
          bash CI/retry.sh sudo apt-get update
          bash CI/retry.sh sudo apt-get install -y clang llvm libhdf5-dev
      - name: Build and test with ${{ matrix.sanitizer }}
        run: |
          chmod +x CI/ci-deps.sh CI/run_sanitizers.sh
          ./CI/ci-deps.sh
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda &>/dev/null; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          ./CI/run_sanitizers.sh \
            --${{ matrix.sanitizer }} \
            --build \
            --site "ubu-24.amd64"

  # ---- Leak check (gating allocation-leak detection, #560/#563) -------------
  leak-check:
    name: leak-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install system libraries
        run: |
          bash CI/retry.sh sudo apt-get update
          bash CI/retry.sh sudo apt-get install -y libhdf5-dev liburing-dev
      - name: Install dependencies (conda env)
        run: |
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh --only-deps
      - name: Build with leak tracking and run leak tests
        run: |
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda &>/dev/null; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          cmake --preset=leak-check
          cmake --build build-leak -j"$(nproc)"
          # In a leak-tracking build every test auto-checks that the runtime
          # private heap returns to its pre-test level. Run the calibrated
          # force-net suites + the per-RPC leak test. cte_tag_force_net /
          # cte_query_force_net are excluded (pre-existing CI-only hang, #579).
          ctest --test-dir build-leak \
            -R "leak|cr_streaming_force_net|cte_.*force_net" \
            -E "cte_tag_force_net|cte_query_force_net" \
            --output-on-failure --no-tests=error
