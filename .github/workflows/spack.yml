name: Spack Install

# Installs the iowarp Spack package from THIS checkout (spack develop), once per
# feature group, and checks that each feature's files were actually installed.
# No unit tests run here: the point is that `spack install iowarp +<feature>`
# works for every feature the package offers, GPU ones included. The GPU jobs
# need no GPU; they only compile, against toolkits installed from the vendors'
# apt repositories and registered with Spack as externals.

on:
  # Never on pull requests: this runs only after a merge (push to dev/main).
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'installers/spack/**'
      - '.github/workflows/spack.yml'

concurrency:
  group: spack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spack:
    name: spack (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything that needs no GPU and no cloud credentials: the I/O
          # adapters, FUSE, the dashboard, Python, compression, clio-ml (CPU).
          - name: cpu-features
            toolchain: none
            spec: >-
              +posix +stdio +mpiio +elf +hdf5 +vol +vfd +adios2 +fuse +viz
              +python +compress +clio_ml +io_uring +openmp ~test ~benchmark
            expect: >-
              lib*/libclio_cte_posix.so lib*/libclio_cte_stdio.so
              lib*/libclio_cte_mpiio.so lib*/libclio_hdf5_vol.so
              lib*/libclio_vfd.so lib*/libiowarp_engine.so bin/clio_cte_fuse
              share/clio/viz/clio_admin/index.html
              include/clio_cte/cpu_vector/cpu_vector.h
          # Storage backends and transports.
          - name: cloud-and-network
            toolchain: none
            spec: >-
              +s3_bdev +gcs_bdev +s3_cae +gcs +globus +mochi
              ~test ~benchmark
            expect: >-
              bin/clio_run
          # NVIDIA: gpu_vector through clang, GDS, clio-ml on CUDA.
          - name: cuda
            toolchain: cuda
            spec: >-
              +cuda cuda_arch=89 +gpu_vector +gds +elf +clio_ml
              ~test ~benchmark ^cuda@12.6
            expect: >-
              include/clio_cte/gpu_vector/gpu_vector.h
              include/clio_cte/gpu_vector/device_vector.h
              lib*/libclio_cte_nvidia_gds.so
          # AMD.
          - name: rocm
            toolchain: rocm
            spec: >-
              +rocm amdgpu_target=gfx90a ~test ~benchmark
            expect: >-
              bin/clio_run
          # Intel: SYCL with the oneAPI compiler, gpu_vector and clio-ml.
          - name: sycl
            toolchain: sycl
            spec: >-
              +sycl +clio_ml ~test ~benchmark %oneapi
            expect: >-
              include/clio_cte/gpu_vector/gpu_vector.h

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # clio-ml is its own repository. The package fetches it as a resource,
      # but a `spack develop` build uses this checkout as-is, so put it where
      # the CMake build looks for it. iowarp/clio-ml is private: the job's
      # GITHUB_TOKEN cannot read it, so +clio_ml is built only when a
      # CLIO_ML_TOKEN secret (read access to iowarp/clio-ml) is configured,
      # and dropped from the spec otherwise. SPEC is the spec every later step
      # installs and verifies.
      - name: Fetch clio-ml
        env:
          CLIO_ML_TOKEN: ${{ secrets.CLIO_ML_TOKEN }}
        run: |
          SPEC="${{ matrix.spec }}"
          if [[ "$SPEC" == *+clio_ml* ]]; then
            if [ -n "$CLIO_ML_TOKEN" ]; then
              git clone --depth 1 \
                "https://x-access-token:${CLIO_ML_TOKEN}@github.com/iowarp/clio-ml.git" \
                external/clio-ml
            else
              echo "::notice::CLIO_ML_TOKEN is not set and iowarp/clio-ml is private; building without +clio_ml"
              SPEC="${SPEC//+clio_ml/}"
            fi
          fi
          echo "SPEC=$(echo $SPEC)" >> "$GITHUB_ENV"

      # Outside the workspace: Spack installs under its own tree, and CMake
      # refuses to export include paths that sit inside the source directory.
      - name: Checkout spack
        run: git clone --depth 1 https://github.com/spack/spack.git "$HOME/spack"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran python3-dev \
            pkg-config autoconf automake libtool

      - name: Install CUDA 12.6 and clang 22
        if: matrix.toolchain == 'cuda'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          # The full 12.6 toolkit, as gpu-tests.yml installs for its clang 22
          # build: clang needs more of the toolkit (libdevice, CUPTI headers,
          # ...) than the nvcc-only package set, and CMake could not identify
          # clang as a CUDA compiler against that.
          sudo apt-get install -y cuda-toolkit-12-6 cuda-driver-dev-12-6 \
            libcufile-dev-12-6
          # The CUDA compiler for gpu_vector (CLIO_GPU_CLANG): device
          # coroutines need a recent clang; the tree is tested with 22.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          /usr/lib/llvm-22/bin/clang++ --version | head -1

      - name: Install ROCm 6.4
        if: matrix.toolchain == 'rocm'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.4 noble main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu's universe ships older hipcc / rocm-cmake that apt would
          # otherwise prefer, leaving rocm-hip-runtime-dev unsatisfiable. Pin
          # AMD's repository above it, as AMD's install guide does.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y rocm-hip-runtime-dev hipcc rocm-cmake
          /opt/rocm/bin/hipconfig --version

      - name: Install oneAPI DPC++ 2025
        if: matrix.toolchain == 'sycl'
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp-2025.2

      - name: Configure spack
        run: |
          # Convert SSH submodule URLs to HTTPS so spack can clone without keys.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          . "$HOME/spack/share/spack/setup-env.sh"
          spack repo add installers/spack
          # Public binary cache: anything whose hash matches is not rebuilt.
          spack mirror add --type binary spack-develop https://binaries.spack.io/develop
          spack buildcache keys --install --trust --yes-to-all
          spack compiler find
          # Reuse the runner's build tools instead of building them.
          spack external find --not-buildable cmake perl git curl openssl \
            autoconf automake libtool m4 pkgconf gmake bison flex
          case "${{ matrix.toolchain }}" in
            cuda)
              # Pin the apt toolkits as externals, by their own prefixes:
              # `external find` reports apt.llvm.org's clang under /usr (whose
              # plain clang++ is the runner's older system clang) and missed
              # the CUDA 12.6 install, so Spack built CUDA 13 instead.
              cuda_ver=$(/usr/local/cuda-12.6/bin/nvcc --version | grep -oE 'V[0-9]+[.][0-9]+[.][0-9]+' | tr -d V)
              llvm_ver=$(/usr/lib/llvm-22/bin/clang++ --version | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | head -1)
              cat >> "$(spack location -r)/etc/spack/packages.yaml" <<EOF2
          packages:
            cuda:
              buildable: false
              externals:
              - spec: cuda@${cuda_ver}+allow-unsupported-compilers
                prefix: /usr/local/cuda-12.6
            llvm:
              buildable: false
              externals:
              - spec: llvm@${llvm_ver}+clang
                prefix: /usr/lib/llvm-22
          EOF2
              ;;
            rocm)
              spack external find --not-buildable --path /opt/rocm \
                hip llvm-amdgpu hsa-rocr-dev comgr rocm-core rocminfo \
                rocm-cmake hipcc hip-tensile rocprofiler-register
              ;;
            sycl)
              spack compiler find /opt/intel/oneapi/compiler/latest/bin
              ;;
          esac
          spack compilers
          spack config get packages | head -80

      - name: Concretize
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          spack env create --without-view -d ci-env
          spack -e ci-env develop --path "$GITHUB_WORKSPACE" iowarp@=dev
          spack -e ci-env add "iowarp@=dev ${SPEC}"
          spack -e ci-env concretize -f | tee concretized.txt

      - name: Install
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          spack -e ci-env install --fail-fast -j "$(nproc)" || {
            echo "=== spack build logs ==="
            find /tmp -path '*spack-stage*' -name 'spack-build-out.txt' \
              -exec sh -c 'echo "--- $1"; tail -200 "$1"' _ {} \;
            exit 1
          }

      # A variant that maps to a dead CMake flag still installs cleanly, so
      # check each feature's files are really there (#1194).
      - name: Verify the features were installed
        run: |
          . "$HOME/spack/share/spack/setup-env.sh"
          prefix=$(spack -e ci-env location -i iowarp)
          echo "prefix: $prefix"
          missing=0
          for pat in ${{ matrix.expect }}; do
            if ! compgen -G "$prefix/$pat*" > /dev/null; then
              echo "::error::iowarp ${{ matrix.name }} installed without $pat"
              missing=1
            else
              echo "found $(compgen -G "$prefix/$pat*" | head -1)"
            fi
          done
          if [[ "${SPEC}" == *+clio_ml* ]]; then
            if ! find "$prefix" -iname '*clio_ml*' | grep -q .; then
              echo "::error::+clio_ml installed nothing named clio_ml"
              missing=1
            fi
          fi
          exit $missing
