[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "iowarp-core"
dynamic = ["version"]
description = "IOWarp Context Management Platform"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "IOWarp Team", email = "grc@illinoistech.edu"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pyyaml",
    "msgpack",
    # flask powers the context visualizer dashboard, which ships as a standard
    # feature (the `context-visualizer` console script below). Keep it a core
    # dependency so `pip install iowarp-core` yields a working visualizer.
    "flask>=2.0",
]

[project.optional-dependencies]
# Retained for backward compatibility; `flask` is now a core dependency, so
# `pip install iowarp-core[visualizer]` is equivalent to the bare install.
visualizer = [
    "flask>=2.0",
    "pyyaml",
    "msgpack",
]

[project.scripts]
clio_run = "iowarp_core._cli:clio_run_main"
clio_cte_bench = "iowarp_core._cli:cte_bench_main"
clio_run_thrpt_bench = "iowarp_core._cli:run_thrpt_main"
clio_cte_fuse = "iowarp_core._cli:cte_fuse_main"
context-visualizer = "context_visualizer.__main__:main"

[project.urls]
Homepage = "https://iowarp.ai"
Repository = "https://github.com/iowarp/clio-core"
Documentation = "https://docs.iowarp.ai"

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.build-type = "Release"
install.components = ["pip_package"]
wheel.packages = [
    "iowarp_core",
    "../../context-visualizer/context_visualizer",
]
# Sets CMAKE_INSTALL_PREFIX = <wheel>/platlib/iowarp_core, so every install()
# DESTINATION is package-relative ("lib", "bin", "ext", ...) instead of having
# to manually prefix each one with iowarp_core/.  The single exception is the
# .pth file, which uses DESTINATION ".." in CMakeLists.txt to escape one level
# up so it lands at site-packages root.
wheel.install-dir = "iowarp_core"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "ON"
CLIO_CORE_STATIC_DEPS = "ON"
CLIO_CORE_ENABLE_RUNTIME = "ON"
CLIO_CORE_ENABLE_CTE = "ON"
CLIO_CORE_ENABLE_CAE = "ON"
CLIO_CORE_ENABLE_CEE = "ON"
CLIO_CORE_ENABLE_PYTHON = "ON"
CLIO_CORE_ENABLE_TESTS = "OFF"
CLIO_CORE_ENABLE_BENCHMARKS = "ON"
CLIO_CORE_ENABLE_RPATH = "OFF"
CLIO_CORE_ENABLE_ZMQ = "ON"
CLIO_CORE_ENABLE_CEREAL = "ON"
CLIO_CORE_ENABLE_MPI = "OFF"
CLIO_CORE_ENABLE_HDF5 = "OFF"
CLIO_CORE_ENABLE_ELF = "OFF"
CLIO_CTE_ENABLE_COMPRESS = "OFF"
# FUSE adapter: OFF here is the macOS value; Linux and Windows wheels turn
# it ON via the per-OS overrides at the bottom of this file (#899).
CLIO_CTE_ENABLE_FUSE_ADAPTER = "OFF"
# Cache + replication chimods ship by default (#886/#899). They already
# default ON in CMake; pin them here so a future default flip cannot
# silently drop them from published wheels.
CLIO_CTE_ENABLE_CACHE = "ON"
CLIO_CTE_ENABLE_REPLICATION = "ON"
CLIO_CORE_ENABLE_ENCRYPT = "OFF"
CLIO_CORE_ENABLE_CUDA = "OFF"
CLIO_CORE_ENABLE_ROCM = "OFF"
CLIO_CORE_ENABLE_OPENMP = "OFF"
CTP_LOG_LEVEL = "1"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../CMakeLists.txt"
regex = 'project\(iowarp-core VERSION (?P<value>[\d.]+)'

# ---------------------------------------------------------------------------
# Per-OS overrides (#899): ship the OS-specific FUSE adapter by default.
# `if.platform-system` regex-matches sys.platform ("linux", "win32",
# "darwin").
#   - Linux: libfuse3. The binary links libfuse3.so.3, which the wheel does
#     NOT bundle (see repair_wheel.sh — external system libs stay external);
#     users need their distro's fuse3/libfuse3 packages at mount time, as
#     documented in iowarp_core._cli.cte_fuse_main.
#   - Windows: WinFsp (https://winfsp.dev). The build finds WinFsp's
#     FUSE3-compatible SDK (adapter/libfuse/CMakeLists.txt); end users need
#     the WinFsp runtime installed.
#   - macOS: stays OFF — there is no fuse3 pkg-config on macOS (macFUSE
#     exposes the FUSE2 API), so the base define above applies.
# ---------------------------------------------------------------------------
# inherit.cmake.define = "append" is load-bearing: without it an override's
# cmake.define table REPLACES the whole base table (verified against
# scikit-build-core 0.12), silently dropping STATIC_DEPS and every other
# base define from the wheel build.
[[tool.scikit-build.overrides]]
if.platform-system = "linux"
inherit.cmake.define = "append"
cmake.define.CLIO_CTE_ENABLE_FUSE_ADAPTER = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.CLIO_CTE_ENABLE_FUSE_ADAPTER = "ON"
