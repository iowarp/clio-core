# IOWarp Core - Full Variant (Source Build)
# The release preset plus MPI, HDF5, ELF interception and CUDA.
#
# Usage:
#   IOWARP_PRESET=release \
#   IOWARP_CMAKE_ARGS="-DCLIO_CORE_ENABLE_MPI=ON -DCLIO_CORE_ENABLE_HDF5=ON \
#     -DCLIO_CORE_ENABLE_ELF=ON -DCLIO_CORE_ENABLE_CUDA=ON" \
#   conda build installers/conda/ -c conda-forge
#
# (This file used to say IOWARP_PRESET=custom, a preset CMakePresets.json
# does not define, and listed options such as mpi_enabled that the recipe
# never read, so the variant could not build at all -- #1195.)

preset:
  - release
