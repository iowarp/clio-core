{# Conda package version.  Originally driven by an environ.get(PKG_VERSION,
   '1.0.0') jinja, mirroring the pip wheel.  conda-build 26.x sandboxed
   the jinja `environ` so neither the PKG_VERSION env var nor the
   default fallback resolves anymore — `version` evaluates to the
   literal string "None" and the resulting "iowarp-core-None-..." pkg
   name then fails libmamba's _test_env solve.  Hardcode until conda-
   build exposes a working environ-bridge again; the CMake-side source
   of truth is in /CMakeLists.txt project(iowarp-core VERSION X.Y.Z),
   keep this number in sync when bumping. #}
{% set version = "2.2.1" %}
{% set preset = environ.get('IOWARP_PRESET', 'release') %}

package:
  name: iowarp-core
  version: {{ version }}

source:
  path: ../..

build:
  number: 0
  string: {{ preset.replace('-', '_') }}_h{{ PKG_HASH }}
  script_env:
    - IOWARP_PRESET
  # Drop the `python` spec that the host python weak-run-exports, and keep
  # everything else it exports (notably `python_abi 3.12.* *_cp312`, which the
  # release preset does need -- it builds the nanobind extension modules with
  # CLIO_CORE_ENABLE_PYTHON=ON). conda-build's _filter_run_exports matches by
  # exported-spec name, so listing `python` here removes only that one spec.
  #
  # conda-forge's python-3.12.14-h5f976f7_2_cpython -- a NON-debug build, and
  # the one the host env resolves to -- ships a run_export that belongs to the
  # debug variant:
  #
  #   weak: ["python_abi 3.12.* *_cp312", "python 3.12.* *_debug_cpython"]
  #
  # In the feedstock that second entry sits behind a jinja guard on
  # py_interp_debug == "yes" (written out in prose, not quoted as a tag:
  # conda-build renders jinja over this whole file BEFORE parsing it as YAML,
  # comments included, so an if-tag in a comment is a real unbalanced block and
  # fails the render). It leaked into the regular output of build _2 and is
  # unique to it -- every other python 3.12.x build on the channel exports
  # python_abi alone. conda-build then carries the spec into `run`, where
  # get_pin_from_build keeps the build glob and rewrites the version to the
  # x.x pin, giving `python >=3.12,<3.13.0a0 *_debug_cpython`. Debug builds are
  # published only under conda-forge's `python_debug` label, never `main`, so
  # the _test_env solve cannot satisfy it and the build dies before compiling:
  #
  #   ExplainedDependencyNeedsBuildingError: Unsatisfiable dependencies for
  #   platform linux-64: {MatchSpec("python[version='>=3.12,<3.13.0a0',
  #   build=*_debug_cpython]")}
  #
  # This broke every conda leg org-wide on 2026-09-02 (gpu-tests on dev and on
  # unrelated PR branches alike) with no recipe change on either side -- the
  # 2026-09-01 run of the same recipe was green. Remove once the feedstock
  # ships a fixed build; `python` stays in `run:` below either way, so the
  # x.x pin conda-build applies there is unaffected.
  ignore_run_exports:
    - python

requirements:
  build:
    - {{ compiler('cxx') }}
    # {{ stdlib("c") }} pulls in sysroot_linux-64 (version pinned by
    # c_stdlib_version in conda_build_config.yaml) and adds the matching
    # __glibc>=x.y run-constraint to the package.
    #
    # Without it (#973) the conda-forge compiler activation packages no
    # longer bring a sysroot of their own, so the build silently compiled
    # against the CI runner host headers -- /usr on ubuntu-latest, glibc
    # 2.39. The published 2.2.0 linux-64 package imports GLIBC_2.38
    # symbols (__isoc23_strtol, ...) and GLIBC_2.34 pthread_create, so it
    # cannot load on RHEL8-family HPC nodes (glibc 2.28) -- and because no
    # __glibc constraint was recorded either, conda installed it there
    # anyway and the failure only surfaced at import time.
    - {{ stdlib("c") }}
    - cmake >=3.20
    - make
    - pkg-config
  host:
    - python
    - zeromq
    - yaml-cpp
    - cereal
    - msgpack-c
    - hdf5
    - catch2
    - libaio      # [linux]
    - liburing    # [linux]
    - nlohmann_json
    - libcurl
    - poco            # Poco::Net: HTTP client for the drive-failure prediction path
    - libboost-devel  # Boost.Context: optional stackful coroutine backend (#620)
    # Optional cloud-import SDKs for the CAE assimilator. Uncomment alongside
    # the matching CMake flag: aws-sdk-cpp for -DCAE_ENABLE_S3=ON (s3://),
    # google-cloud-cpp for -DCAE_ENABLE_GCS=ON (gs://).
    # - aws-sdk-cpp
    # - google-cloud-cpp
  run:
    - python
    - zeromq
    - yaml-cpp
    - cereal
    - msgpack-c
    - hdf5
    - catch2
    - libaio      # [linux]
    - liburing    # [linux]
    - nlohmann_json
    - libcurl
    - poco            # Poco::Net: HTTP client for the drive-failure prediction path
    # Optional cloud-import SDKs for the CAE assimilator (see build/host notes).
    # - aws-sdk-cpp
    # - google-cloud-cpp
    - pyyaml
    - msgpack-python

test:
  commands:
    - test -f $PREFIX/lib/libclio_run_cxx.so    # [linux]
    - test -f $PREFIX/lib/libclio_run_cxx.dylib  # [osx]

about:
  home: https://www.iowarp.ai
  license: BSD-3-Clause
  license_file: LICENSE
  summary: IOWarp Context Management Platform - AI-accelerated scientific workflow orchestration
  description: |
    IOWarp Core provides a unified framework for context-aware data management
    in scientific workflows, including the Context Transfer Engine (CTE),
    Context Assimilation Engine (CAE), and Context Exploration Engine (CEE).
  dev_url: https://github.com/iowarp/clio-core
  doc_url: https://docs.iowarp.ai

extra:
  recipe-maintainers:
    - lukemartinlogan
