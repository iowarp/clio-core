{# Version is driven by IOWARP_PKG_VERSION which the workflow exports from
   CMakeLists.txt's `project(iowarp-core VERSION ...)` before invoking
   `conda build` (so the conda package version tracks the same single
   source of truth as the pip wheel). The "1.0.0" fallback keeps local
   `conda build installers/conda/` working without setup.
   NOTE: do NOT name this PKG_VERSION — conda-build reserves PKG_VERSION
   in its meta.yaml environ (environ.py:595 `d["PKG_VERSION"] = meta.version()`)
   and overrides whatever os.environ has with the *unrendered* meta.version
   (which resolves to Python None), so `environ.get('PKG_VERSION', '1.0.0')`
   returns None (key present, default ignored) and the recipe renders as
   `iowarp-core-None-...conda`. Same collision risk for PKG_NAME, PKG_HASH,
   PKG_BUILDNUM, PKG_BUILD_STRING, RECIPE_DIR, GIT_*, HG_*, SHLIB_EXT, PATH. #}
{% set version = environ.get('IOWARP_PKG_VERSION') or '1.0.0' %}
{% set preset = environ.get('IOWARP_PRESET', 'release') %}

package:
  name: iowarp-core
  version: {{ version }}

source:
  path: ../..

build:
  number: 0
  string: {{ preset.replace('-', '_') }}_h{{ PKG_HASH }}
  script_env:
    - IOWARP_PRESET

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake >=3.20
    - make
    - pkg-config
  host:
    - python
    - zeromq
    - yaml-cpp
    - cereal
    - msgpack-c
    - hdf5
    - catch2
    - libaio      # [linux]
    - liburing    # [linux]
  run:
    - python
    - zeromq
    - yaml-cpp
    - cereal
    - msgpack-c
    - hdf5
    - catch2
    - libaio      # [linux]
    - liburing    # [linux]
    - pyyaml
    - msgpack-python
    - flask

test:
  commands:
    - test -f $PREFIX/lib/libchimaera_cxx.so    # [linux]
    - test -f $PREFIX/lib/libchimaera_cxx.dylib  # [osx]

about:
  home: https://www.iowarp.ai
  license: BSD-3-Clause
  license_file: LICENSE
  summary: IOWarp Context Management Platform - AI-accelerated scientific workflow orchestration
  description: |
    IOWarp Core provides a unified framework for context-aware data management
    in scientific workflows, including the Context Transfer Engine (CTE),
    Context Assimilation Engine (CAE), and Context Exploration Engine (CEE).
  dev_url: https://github.com/iowarp/clio-core
  doc_url: https://docs.iowarp.ai

extra:
  recipe-maintainers:
    - lukemartinlogan
