networking:
  port: 9436

runtime:
  num_threads: 4
  queue_depth: 4096
  first_busy_wait: 2000000000

gpu:
  queue_depth: 4096

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "512MB"

  - mod_name: clio_cte_compressor
    pool_name: cte_compressor
    pool_query: local
    pool_id: "512.0"
    next_pool_id: "513.0"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "513.0"
    storage:
      - path: "hbm::gv_hbm_only"
        bdev_type: "hbm"
        capacity_limit: "2MB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
