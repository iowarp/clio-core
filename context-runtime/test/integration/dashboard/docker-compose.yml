# Dashboard Integration Test -- 4-node Clio cluster serving the BUILT-IN web
# dashboard (issue #990): node1's daemon hosts it on :5000; the other nodes run
# bare runtimes. No Python package involved.
#
# Usage:
#   docker compose up -d
#   # Dashboard available at http://localhost:5000
#   docker compose down

services:
  # Node 1 - Runs runtime + dashboard + sshd
  iowarp-node1:
    image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
    init: true
    stop_grace_period: 5s
    security_opt:
      - seccomp:unconfined
    container_name: iowarp-dashboard-node1
    hostname: iowarp-node1
    networks:
      dashboard-cluster:
        ipv4_address: 172.20.0.10
    ports:
      - "5000:5000"
    volumes:
      - ${HOST_WORKSPACE:-${IOWARP_CORE_ROOT:-/workspace}}:/workspace:rw
      - ssh-keys:/shared-ssh:rw
    environment:
      - NODE_ID=1
      - NODE_IP=172.20.0.10
      - CLIO_SERVER_CONF=/workspace/context-runtime/test/integration/dashboard/clio_conf.yaml
      - CONTAINER_HOSTFILE=/workspace/context-runtime/test/integration/dashboard/hostfile
      - CLIO_WITH_RUNTIME=0
      - CLIO_NUM_CONTAINERS=4
      - PATH=/home/iowarp/venv/bin:/workspace/build/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - LD_LIBRARY_PATH=/workspace/build/bin:/usr/local/cuda/lib64:/usr/local/lib
      # Built-in dashboard: daemon-served, reachable from off-container.
      - CLIO_VIZ_ENABLE=1
      - CLIO_VIZ_PORT=5000
      - CLIO_VIZ_BIND=0.0.0.0
    mem_limit: 16g
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
        echo 'Node 1: Configuring SSH...' &&
        sudo mkdir -p /run/sshd &&
        sudo ssh-keygen -A 2>/dev/null;
        mkdir -p ~/.ssh &&
        ssh-keygen -t rsa -N '' -f ~/.ssh/id_rsa -q &&
        cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys &&
        chmod 600 ~/.ssh/authorized_keys &&
        cp ~/.ssh/id_rsa.pub /shared-ssh/node1.pub &&
        sudo /usr/sbin/sshd;

        echo 'Node 1: Starting runtime (dashboard built in, on :5000)...' &&
        /workspace/build/bin/clio_run runtime start &
        RUNTIME_PID=\$! &&

        echo 'Node 1: Runtime PID='\$RUNTIME_PID &&
        wait \$RUNTIME_PID
      "

  # Node 2 - Runtime + sshd
  iowarp-node2:
    image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
    init: true
    stop_grace_period: 5s
    security_opt:
      - seccomp:unconfined
    container_name: iowarp-dashboard-node2
    hostname: iowarp-node2
    networks:
      dashboard-cluster:
        ipv4_address: 172.20.0.11
    volumes:
      - ${HOST_WORKSPACE:-${IOWARP_CORE_ROOT:-/workspace}}:/workspace:rw
      - ssh-keys:/shared-ssh:ro
    environment:
      - NODE_ID=2
      - NODE_IP=172.20.0.11
      - CLIO_SERVER_CONF=/workspace/context-runtime/test/integration/dashboard/clio_conf.yaml
      - CONTAINER_HOSTFILE=/workspace/context-runtime/test/integration/dashboard/hostfile
      - CLIO_WITH_RUNTIME=0
      - CLIO_NUM_CONTAINERS=4
      - PATH=/home/iowarp/venv/bin:/workspace/build/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - LD_LIBRARY_PATH=/workspace/build/bin:/usr/local/cuda/lib64:/usr/local/lib
    mem_limit: 16g
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
        echo 'Node 2: Configuring SSH...' &&
        sudo mkdir -p /run/sshd &&
        sudo ssh-keygen -A 2>/dev/null;
        mkdir -p ~/.ssh &&
        echo 'Node 2: Waiting for node 1 SSH key...' &&
        while [ ! -f /shared-ssh/node1.pub ]; do sleep 0.5; done &&
        cat /shared-ssh/node1.pub >> ~/.ssh/authorized_keys &&
        chmod 600 ~/.ssh/authorized_keys &&
        sudo /usr/sbin/sshd;

        echo 'Node 2: Starting runtime...' &&
        /workspace/build/bin/clio_run runtime start &
        sleep infinity
      "

  # Node 3 - Runtime + sshd
  iowarp-node3:
    image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
    init: true
    stop_grace_period: 5s
    security_opt:
      - seccomp:unconfined
    container_name: iowarp-dashboard-node3
    hostname: iowarp-node3
    networks:
      dashboard-cluster:
        ipv4_address: 172.20.0.12
    volumes:
      - ${HOST_WORKSPACE:-${IOWARP_CORE_ROOT:-/workspace}}:/workspace:rw
      - ssh-keys:/shared-ssh:ro
    environment:
      - NODE_ID=3
      - NODE_IP=172.20.0.12
      - CLIO_SERVER_CONF=/workspace/context-runtime/test/integration/dashboard/clio_conf.yaml
      - CONTAINER_HOSTFILE=/workspace/context-runtime/test/integration/dashboard/hostfile
      - CLIO_WITH_RUNTIME=0
      - CLIO_NUM_CONTAINERS=4
      - PATH=/home/iowarp/venv/bin:/workspace/build/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - LD_LIBRARY_PATH=/workspace/build/bin:/usr/local/cuda/lib64:/usr/local/lib
    mem_limit: 16g
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
        echo 'Node 3: Configuring SSH...' &&
        sudo mkdir -p /run/sshd &&
        sudo ssh-keygen -A 2>/dev/null;
        mkdir -p ~/.ssh &&
        echo 'Node 3: Waiting for node 1 SSH key...' &&
        while [ ! -f /shared-ssh/node1.pub ]; do sleep 0.5; done &&
        cat /shared-ssh/node1.pub >> ~/.ssh/authorized_keys &&
        chmod 600 ~/.ssh/authorized_keys &&
        sudo /usr/sbin/sshd;

        echo 'Node 3: Starting runtime...' &&
        /workspace/build/bin/clio_run runtime start &
        sleep infinity
      "

  # Node 4 - Runtime + sshd
  iowarp-node4:
    image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
    init: true
    stop_grace_period: 5s
    security_opt:
      - seccomp:unconfined
    container_name: iowarp-dashboard-node4
    hostname: iowarp-node4
    networks:
      dashboard-cluster:
        ipv4_address: 172.20.0.13
    volumes:
      - ${HOST_WORKSPACE:-${IOWARP_CORE_ROOT:-/workspace}}:/workspace:rw
      - ssh-keys:/shared-ssh:ro
    environment:
      - NODE_ID=4
      - NODE_IP=172.20.0.13
      - CLIO_SERVER_CONF=/workspace/context-runtime/test/integration/dashboard/clio_conf.yaml
      - CONTAINER_HOSTFILE=/workspace/context-runtime/test/integration/dashboard/hostfile
      - CLIO_WITH_RUNTIME=0
      - CLIO_NUM_CONTAINERS=4
      - PATH=/home/iowarp/venv/bin:/workspace/build/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - LD_LIBRARY_PATH=/workspace/build/bin:/usr/local/cuda/lib64:/usr/local/lib
    mem_limit: 16g
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
        echo 'Node 4: Configuring SSH...' &&
        sudo mkdir -p /run/sshd &&
        sudo ssh-keygen -A 2>/dev/null;
        mkdir -p ~/.ssh &&
        echo 'Node 4: Waiting for node 1 SSH key...' &&
        while [ ! -f /shared-ssh/node1.pub ]; do sleep 0.5; done &&
        cat /shared-ssh/node1.pub >> ~/.ssh/authorized_keys &&
        chmod 600 ~/.ssh/authorized_keys &&
        sudo /usr/sbin/sshd;

        echo 'Node 4: Starting runtime...' &&
        /workspace/build/bin/clio_run runtime start &
        sleep infinity
      "

volumes:
  ssh-keys:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=1777"

networks:
  dashboard-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
