        [package]
        name = "ctp-io"
        version.workspace = true
        edition.workspace = true
        license.workspace = true
        repository.workspace = true
        description = "Async file I/O (Rust port of clio_ctp/io, issue #756)"

        [lib]
        name = "ctp_io"

        [dependencies]
        ctp-types = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_IO", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

