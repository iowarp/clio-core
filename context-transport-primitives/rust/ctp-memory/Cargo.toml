[package]
name = "ctp-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared-memory backends, ShmPtr ABI, and allocators (Rust adaptation of clio_ctp/memory, issue #756)"

[lib]
name = "ctp_memory"

[dependencies]
ctp-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
] }
