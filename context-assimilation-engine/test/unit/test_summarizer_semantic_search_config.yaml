# Compose configuration for the summarization + CTE semantic-search test.
# Same shape as the summarizer labeling test: the CAE core is the entrypoint
# at 512.0, the summarizer at 401.0 holds one rule that fires on every doc
# blob, and the indexer chimod at 564.0 owns the BM25 search (issue #905)
# over the CTE core at 513.0.

networking:
  port: 9413

runtime:
  num_threads: 4
  queue_depth: 1024

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "256MB"

  # CTE core at the bottom of the chain. Composed FIRST: an interposer's
  # next_pool_id must already exist when its container is created.
  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "513.0"
    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "128MB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"

  # Indexer chimod (issue #905): puts maintain the index inline and the
  # search is served from it.
  - mod_name: clio_cte_indexer
    pool_name: clio_cte_indexer
    pool_query: local
    pool_id: "564.0"
    next_pool_id: "513.0"

  # Summarizer interposer: labels every `docN` blob on its way through.
  - mod_name: clio_cae_summarizer
    pool_name: clio_cae_summarizer
    pool_query: local
    pool_id: "401.0"
    next_pool_id: "564.0"
    label_endpoint: "http://127.0.0.1:11434"
    label_prompts:
      summarize: "Summarize the following text in one short sentence."
    label_matches:
      - tag_re: ".*"
        blob_re: "^doc[0-9]+$"
        model: "gemma3:1b"
        prompt: "summarize"
        context_length: 4096
        num_predict: 64

  - mod_name: clio_cae_core
    pool_name: cae_main
    pool_query: local
    pool_id: "512.0"
    next_pool_id: "401.0"
