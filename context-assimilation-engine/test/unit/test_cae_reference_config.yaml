# Compose for the CAE by-reference (zero-copy) test. The CTE pool owns the
# tags; CAE (400.0) registers itself as the fault handler of each tag it
# assimilates by reference, so a CTE miss on page N is read from the file.

networking:
  port: 9437

runtime:
  num_threads: 4
  queue_depth: 1024

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "64MB"

  - mod_name: clio_cae_core
    pool_name: cae_main
    pool_query: local
    pool_id: "400.0"
    next_pool_id: "512.0"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "32MB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
