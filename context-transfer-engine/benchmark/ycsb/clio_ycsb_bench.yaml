# YCSB benchmark config (issue #862): the CTE core over one RAM tier, with
# the shared-memory write-through cache (core_shm_cache_writethru, pool 568)
# in front of it. The YCSB binding's synchronous PutBlob / GetBlobSize /
# GetBlob are then served by copying between the JVM's buffer and the cache
# segment in the client process: no task and no round trip to the runtime.
# The cache writes every put through to the core in the background.
#
# Sized for the comparison's default dataset (1M records of ~1.1 KB, about
# 1.1 GB): the cache holds every record (max_blobs above the record count,
# capacity above the dataset), and the RAM tier below holds them again.
# The other stores are likewise fully memory-resident: Redis by design,
# RocksDB on tmpfs with a block cache larger than the dataset, DynamoDB
# Local with -inMemory.
runtime:
  num_threads: 8
  queue_depth: 1024

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "0g"

  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "4GB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
    targets:
      neighborhood: 1
      default_target_timeout_ms: 30000
      poll_period_ms: 5000

  - mod_name: clio_cte_core_shm_cache_writethru
    pool_name: clio_cte_core_shm_cache_writethru
    pool_query: local
    pool_id: "568.0"
    next_pool_id: "512.0"
    md_only: false          # cache the bytes, not just metadata
    capacity: "6G"          # segment: buffers + tables + dirty-range log
    max_blobs: 2097152      # above the record count, or puts write around
    max_tags: 64
