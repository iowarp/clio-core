# Replication ChiMod (issue #886) — policy layer over the CTE core's blob
# replicas, INTERPOSING on the core's own task interface. The core stores
# replicas and addresses them (Context::replica_); this module decides WHAT
# gets copied WHERE. It handles the core's kPutBlob/kGetBlob/kGetBlobSize
# ids with the core task structs (write-through to persistent replicas,
# replica-served reads + primary re-cache, logical sizes) and forwards
# every other core method to next_pool_id — so a clio::cte::core::Client
# pointed at this pool (CLIO_CTE_POOL=561.0) works unchanged. Its own verbs
# (ReplicateBlob/FlushTag) are numbered above the core's method space.
module_name: replication
namespace: clio::cte
version: 1.0.0

kCreate: 0
kDestroy: 1
kMonitor: 9

# Interposed core data verbs (MUST equal the core's ids)
kPutBlob: 15
kGetBlob: 16
kGetBlobSize: 23

# Replication operations (above the core's method-id space)
kReplicateBlob: 100
kFlushTag: 101
