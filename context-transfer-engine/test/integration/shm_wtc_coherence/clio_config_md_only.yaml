# The default chain order: indexer(564) -> shm cache(568, md_only)
#   -> core_persist_write_back(567) -> volatile core(540) / replication(561)
#   -> persistent core(512).
# Clients bind via CLIO_CTE_POOL=564.0 (the cache's entry_pool_id) and map
# the md_only cache segment below; blob bytes go down the chain.

memory:
  main_segment_size: auto
  client_data_segment_size: 2GB
  runtime_data_segment_size: 2GB

networking:
  port: 8080
  neighborhood_size: 32
  hostfile: /workspace/context-transfer-engine/test/integration/shm_wtc_coherence/hostfile

logging:
  level: info
  file: /tmp/clio.log

runtime:
  num_threads: 8
  queue_depth: 1024
  local_sched: "default"
  heartbeat_interval: 1000

swim:
  enabled: false

compose:
  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"
    durability: persistent
    storage:
      - path: "/tmp/wtc_coherence_disk.dat"
        bdev_type: "file"
        capacity_limit: "2GB"
        score: 0.2
        persistence_level: "temporary"
    dpe:
      dpe_type: "max_bw"
    targets:
      neighborhood: 1
      default_target_timeout_ms: 30000
      poll_period_ms: 5000

  - mod_name: clio_cte_core
    pool_name: cte_volatile
    pool_query: local
    pool_id: "540.0"
    durability: volatile
    storage:
      - path: "ram::wtc_coherence_dram"
        bdev_type: "ram"
        capacity_limit: "512MB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
    targets:
      neighborhood: 1

  - mod_name: clio_cte_replication
    pool_name: clio_cte_replication
    pool_query: local
    pool_id: "561.0"
    next_pool_id: "512.0"
    num_replicas: 1
    cache_score: 1.0
    replica_score: 0.2

  - mod_name: clio_cte_core_persist_write_back
    pool_name: clio_cte_core_persist_write_back
    pool_query: local
    pool_id: "567.0"
    next_volatile: "540.0"
    next_persistent: "561.0"
    fill: on_read_miss
    evict: lru
    flush_period_ms: 10000
    fallback_to_persistent: true

  - mod_name: clio_cte_core_shm_cache_writethru
    pool_name: clio_cte_core_shm_cache_writethru
    pool_query: local
    pool_id: "568.0"
    next_pool_id: "567.0"
    entry_pool_id: "564.0"
    md_only: true
    capacity: "128M"
    log_depth: 16384
    max_blobs: 16384

  # The indexer above the cache (the default chain order): clients bind to
  # it (entry_pool_id) and map the md_only cache segment below.
  - mod_name: clio_cte_indexer
    pool_name: clio_cte_indexer
    pool_query: local
    pool_id: "564.0"
    next_pool_id: "568.0"
