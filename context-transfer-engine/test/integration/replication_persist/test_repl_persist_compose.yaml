---
# Replication persistence test (issue #886): a volatile RAM tier + a
# persistent file tier, the replication chimod composed over the CTE, and a
# metadata WAL — the same shape as the default ~/.clio/clio.yaml. Phase 1
# CachedPuts 50 blobs (DRAM primary + disk replica); the runtime is then
# stopped and rebooted, and phase 2 verifies the disk replicas survived
# while the DRAM primaries did not.
runtime:
  num_threads: 4
  queue_depth: 256
  conf_dir: /tmp/clio_repl_persist_test

compose:
  - mod_name: clio_cte_core
    pool_name: cte_repl_persist
    pool_query: local
    pool_id: "512.0"
    restart: true
    storage:
      - path: "ram::repl_persist_ram"
        bdev_type: ram
        capacity_limit: 64MB
        score: 1.0

      - path: /tmp/clio_repl_persist_test/cte_disk.dat
        bdev_type: file
        capacity_limit: 64MB
        score: 0.2
        persistence_level: "temporary"
    performance:
      metadata_log_path: /tmp/clio_repl_persist_test/metadata.log
      transaction_log_capacity: 32MB
      flush_metadata_period_ms: 0
      flush_data_period_ms: 0
    dpe:
      dpe_type: "max_bw"

  - mod_name: clio_cte_replication
    pool_name: clio_cte_replication
    pool_query: local
    pool_id: "561.0"
    restart: true
    next_pool_id: "512.0"
    num_replicas: 1
    cache_score: 1.0
    replica_score: 0.2
