---
# CTE multi-node COHERENCY test - 4-node cluster (Docker).
#
# Same shape as test/integration/distributed/clio_config.yaml, but every node
# runs the test as a CLIENT (coherency needs different nodes touching the same
# blobs), and each node owns one file-backed storage target so we can see where
# blob data actually lands.

memory:
  main_segment_size: auto
  client_data_segment_size: 2GB
  runtime_data_segment_size: 2GB

networking:
  port: 8080
  neighborhood_size: 32
  hostfile: /workspace/context-transfer-engine/test/integration/coherency/hostfile

logging:
  level: info
  file: /tmp/clio.log

runtime:
  num_threads: 8
  queue_depth: 1024
  local_sched: "default"
  heartbeat_interval: 1000

compose:
  # CTE core (pool 512.0). Blobs hash-route by (tag_id, blob_name) across the
  # containers of this pool, so a blob written on one node generally lives on
  # another -- which is what makes the coherency assertions meaningful.
  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: /mnt/hdd1
        bdev_type: file
        capacity_limit: 4GB
        score: 1.0
    dpe:
      dpe_type: max_bw
    targets:
      neighborhood: 4
      default_target_timeout_ms: 30000
      poll_period_ms: 5000
    performance:
      target_stat_interval_ms: 5000
      blob_cache_size_mb: 1024
      max_concurrent_operations: 64
      score_threshold: 0.7
      score_difference_threshold: 0.05
