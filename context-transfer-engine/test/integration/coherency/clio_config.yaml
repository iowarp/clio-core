---
# WRP configuration for the 4-node CTE memory-coherency integration test.
# Mirrors test/integration/distributed/clio_config.yaml (same cte_core pool
# 512.0 across 4 nodes); only the hostfile path differs (points at this dir).
# test_cte_coherency connects to pool 512.0 as a client on every node.

# Memory segment configuration
memory:
  main_segment_size: auto
  client_data_segment_size: 2GB
  runtime_data_segment_size: 2GB

# Network configuration
networking:
  port: 8080
  neighborhood_size: 32
  hostfile: /workspace/context-transfer-engine/test/integration/coherency/hostfile

# Logging configuration
logging:
  level: info
  file: /tmp/clio.log

# Runtime configuration
runtime:
  num_threads: 16
  queue_depth: 1024
  local_sched: "default"
  heartbeat_interval: 1000

# Compose section - declarative pool creation.
# CTE Core ChiMod, pool 512.0 (clio_cte/core/constants.h), name "cte_main".
compose:
  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: /mnt/hdd1
        bdev_type: file
        capacity_limit: 10GB
        score: 0.25
      - path: /mnt/hdd2
        bdev_type: file
        capacity_limit: 10GB
        score: 0.25
      - path: /mnt/hdd3
        bdev_type: file
        capacity_limit: 10GB
        score: 0.25
      - path: /mnt/hdd4
        bdev_type: file
        capacity_limit: 10GB
        score: 0.25
    dpe:
      dpe_type: max_bw
    targets:
      neighborhood: 4
      default_target_timeout_ms: 30000
      poll_period_ms: 5000
    performance:
      target_stat_interval_ms: 5000
      blob_cache_size_mb: 16384
      max_concurrent_operations: 64
      score_threshold: 0.7
      score_difference_threshold: 0.05
