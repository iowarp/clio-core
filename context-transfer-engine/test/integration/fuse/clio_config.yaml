---
# WRP Configuration for FUSE Integration Testing
# Single-node configuration with RAM storage

runtime:
  num_threads: 4
  queue_depth: 256

compose:
  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: /mnt/cte_fuse_ram
        bdev_type: ram
        capacity_limit: 100MB

  # clio-fs creates no pools and assumes no pool id: clio_cte_fuse finds this
  # pool by name (clio_cte_filesystem) and routes through its next_pool_id.
  - mod_name: clio_cte_filesystem
    pool_name: clio_cte_filesystem
    pool_query: local
    pool_id: "560.0"
    next_pool_id: "512.0"
