# Compose for the descriptor-layer adapter tests (POSIX, STDIO, MPI-IO, VFD).
# clio-fs creates no pools and assumes no pool ids: the interceptors find the
# filesystem pool by name (clio_cte_filesystem) and use the chain it names.
compose:
  - mod_name: clio_cte_core
    pool_name: cte_adapter_test
    pool_query: local
    pool_id: 512.0
    targets:
      neighborhood: 1
    storage:
      - path: "ram::cte_adapter_test_ram"
        bdev_type: "ram"
        capacity_limit: "1GB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"

  - mod_name: clio_cte_filesystem
    pool_name: clio_cte_filesystem
    pool_query: local
    pool_id: 560.0
    next_pool_id: 512.0
