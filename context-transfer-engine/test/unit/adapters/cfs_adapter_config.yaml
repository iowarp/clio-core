# Compose for the descriptor-layer adapter tests (POSIX, STDIO, MPI-IO, VFD).
# clio-fs creates no pools and assumes no pool ids: the interceptors find the
# filesystem pool by name (clio_cte_filesystem) and use the chain it names.
compose:
  - mod_name: clio_cte_core
    pool_name: cte_adapter_test
    pool_query: local
    pool_id: 512.0
    targets:
      neighborhood: 1
    storage:
      - path: "ram::cte_adapter_test_ram"
        bdev_type: "ram"
        capacity_limit: "1GB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"

  # The shm cache: the CTE client's shared-memory path. Create hands its
  # segment keys to every client of pool 512, and the filesystem (and the
  # HDF5 VFD's read tier above it) read committed pages from it directly.
  # Without it every read takes the task path (correct, never a cache hit).
  - mod_name: clio_cte_core_shm_cache_writethru
    pool_name: clio_cte_core_shm_cache_writethru
    pool_query: local
    pool_id: 568.0
    next_pool_id: 512.0
    md_only: false
    capacity: "128M"
  - mod_name: clio_cte_filesystem
    pool_name: clio_cte_filesystem
    pool_query: local
    pool_id: 560.0
    next_pool_id: 568.0
