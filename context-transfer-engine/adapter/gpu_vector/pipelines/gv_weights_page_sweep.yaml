# Model weights, out-of-core: page size 16 KB -> 4 MB at a FIXED 16 GB dataset.
#
# 16 GB of weights against an 8188 MB GPU -- 2x VRAM -- with a 4 GB kHBM tier,
# so 12 GB spills to the host and the run pages throughout. Uncompressed: this
# sweep isolates page size, and a codec would change how many bytes each fault
# moves.
#
# THE DATASET IS HELD EXACTLY CONSTANT. The benchmark's size is
# blocks * pages * page_kb, so sweeping page size alone would also change the
# working set and make the two effects inseparable. page_kb and pages are
# therefore ZIPPED so their product stays 16 GB at every point:
#
#     page_kb     16     64    256   1024   4096
#     pages    16384   4096   1024    256     64
#     ---------------------------------------------
#     GB          16     16     16     16     16
#
# The access pattern is a RE-READ: every pass walks the whole weight matrix
# again, so unlike k-means (stream, no reuse) a cache can hit across passes.
# That makes this the workload where large pages have the most to gain from
# amortising faults and the least to lose from over-fetching, since every byte
# of a fetched page is eventually used.
#
# Page size here is the VECTOR's page size only. The data's flat-block
# granularity is pinned at 64 KB inside the benchmark (kFlatGranuleBytes), so
# the generated bytes are IDENTICAL at every page size -- otherwise this sweep
# would be comparing different datasets rather than different paging, which is
# the confound the Gray-Scott sweep has and cannot avoid.
#
# blocks is fixed at 64. It cannot join this sweep as a second axis: holding
# the dataset constant requires pages = 16GB/(blocks*page_kb), so pages would
# have to depend on both axes at once, which a zip cannot express. The block
# axis is covered separately by gv_weights_cache_sweep.
#
# What to read in the output:
#   kernel_ms       measured kernel time (best of `repeat`), EXCLUDES setup;
#                   jarvis's `runtime` column is whole-process wall clock
#   faults          the paging work the page-size axis moves
#   checksum_ok     0 means the run corrupted data and its timings are void
#   fits_in_hbm     expected 0 here: 16 GB cannot fit a 4 GB tier, and a 1
#                   would mean this row is not the out-of-core case
#
# Requires: clio_gpu_vector_weights_bench on PATH (<build>/bin), a CUDA device,
#           ~17 GB of host RAM for the spill tier.
#
# Usage (from the repo root):
#   export PATH=$PWD/build-coro/bin:$PATH
#   jarvis repo add ./jarvis_clio_core
#   jarvis ppl run yaml \
#     context-transfer-engine/adapter/gpu_vector/pipelines/gv_weights_page_sweep.yaml

config:
  name: gv_weights_page_sweep
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gpu_vector_weights
      pkg_name: gvw

      blocks: 64
      threads: 256
      rt_threads: 8
      hbm_mb: 4096
      hbm_only: false
      slots: 8

      compressed: false
      cpu_codec: false
      flat_pct: 0
      no_prefetch: false
      yieldable: true
      repeat: 3

      vram_budget_gb: 7.0
      timeout_sec: 1800
      output_dir: "/tmp/clio_gpu_vector_weights_page"

      # Overwritten by the sweep.
      page_kb: 1024
      pages: 256

vars:
  # ZIPPED: same loop group, so the product stays 16 GB. Separate groups would
  # take the cross product and the working set would range from 1 GB to 4 TB.
  gvw.page_kb: [16, 64, 256, 1024, 4096]
  gvw.pages:   [16384, 4096, 1024, 256, 64]

loop:
  - [gvw.page_kb, gvw.pages]   # 5 points, dataset constant at 16 GB

repeat: 1

run_timeout: 1800

output: "/home/llogan/Documents/Projects/iowarp/core/results/gv_weights_page_sweep"

post: |
  runs = results['results']
  ok = [r for r in runs if r['status'] == 'success']
  logger.info(f"post: {len(ok)}/{len(runs)} combinations succeeded")

  bad = []
  for r in runs:
      st = r.get('stats') or {}
      if r['status'] != 'success':
          bad.append((r['variables'], f"status={r['status']}"))
      elif 'kernel_ms' not in st:
          bad.append((r['variables'],
                      'NO STATS: no benchmark output -- not on PATH, out of '
                      'device memory, or started inside the previous cell\'s '
                      'VRAM teardown window'))
      elif not st.get('checksum_ok'):
          bad.append((r['variables'],
                      'CHECKSUM MISMATCH: the run corrupted data, timings void'))
      elif st.get('put_errors'):
          bad.append((r['variables'],
                      f"{st['put_errors']} writeback(s) failed -- the tier "
                      f"could not hold the data"))
      elif st.get('logical_mb') and abs(st['logical_mb'] - 16384) > 1:
          # THE DATASET MUST BE CONSTANT. This sweep zips page_kb with pages so
          # their product is fixed; if a cell reports a different logical size
          # then the two did not move together and the cell is measuring
          # dataset size, not page size. A run where the package failed to
          # pass --page-kb produced exactly this: 16384/4096/1024/256 MB
          # across the axis, and a spurious 92x "page-size effect".
          bad.append((r['variables'],
                      f"dataset is {st['logical_mb']:.0f}MB, not 16384MB -- "
                      f"page_kb and pages did not move together, so this is "
                      f"not a page-size comparison"))
      elif st.get('fits_in_hbm'):
          bad.append((r['variables'],
                      'fits_in_hbm=1: this row is NOT out-of-core and is not '
                      'comparable with the others'))
  for v, why in bad:
      logger.warning(f"post: SUSPECT {v}: {why}")

  pages = sorted({r['variables']['gvw.page_kb'] for r in ok})
  cell = {r['variables']['gvw.page_kb']: (r.get('stats') or {}) for r in ok}

  lines = [f"cells: {len(ok)}/{len(runs)} succeeded, {len(bad)} suspect",
           "16 GB of weights = 2x VRAM (8188 MB), kHBM 4096 MB, uncompressed",
           '', 'page_kb,kernel_ms,GB/s,faults,logical_mb,fits_in_hbm']
  for p in pages:
      s = cell.get(p, {})
      lines.append(f"{p},{s.get('kernel_ms', '')},{s.get('gbps', '')},"
                   f"{s.get('faults', '')},{s.get('logical_mb', '')},"
                   f"{s.get('fits_in_hbm', '')}")

  times = [(p, cell.get(p, {}).get('kernel_ms')) for p in pages]
  times = [(p, v) for p, v in times if v]
  if times:
      bp, bv = min(times, key=lambda kv: kv[1])
      wp, wv = max(times, key=lambda kv: kv[1])
      lines += ['', f'page-size effect: best {bv:.0f}ms at {bp}KB, '
                f'worst {wv:.0f}ms at {wp}KB, ratio {wv / bv:.2f}x']
      # Faults should fall in exact proportion to page size on a re-read
      # workload; a departure means the cache is changing the picture too.
      f0 = cell.get(pages[0], {}).get('faults')
      fN = cell.get(pages[-1], {}).get('faults')
      if f0 and fN:
          lines.append(f'faults {f0:.0f} -> {fN:.0f} over a '
                       f'{pages[-1] // pages[0]}x page-size increase '
                       f'(ideal would be {pages[-1] // pages[0]}x fewer)')

  open('weights_page_summary.txt', 'w').write('\n'.join(lines) + '\n')
  logger.info('post: wrote weights_page_summary.txt')

  try:
      import matplotlib
      matplotlib.use('Agg')
      import matplotlib.pyplot as plt
      fig, ax = plt.subplots(figsize=(7, 4.5))
      ax.plot(pages, [cell.get(p, {}).get('kernel_ms') for p in pages],
              marker='o')
      ax.set_xscale('log', base=2); ax.set_xlabel('page size (KB)')
      ax.set_ylabel('kernel time (ms)')
      ax.set_title('Model weights, 16 GB (2x VRAM), page size at fixed dataset')
      fig.tight_layout(); fig.savefig('weights_page.png', dpi=130)
      logger.info('post: wrote weights_page.png')
  except ImportError:
      logger.warning('post: matplotlib unavailable, skipping the plot '
                     '(weights_page_summary.txt has the same numbers)')
