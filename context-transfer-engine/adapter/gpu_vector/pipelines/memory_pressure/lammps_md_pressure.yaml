# lammps_md memory-pressure x parallelism study (paged edition).
#
# ANCHOR PROBLEM: calibrated so the MPI baseline of this workload peaks
# at ~6 GB VRAM on the collection GPU (see calibrate_6gb.py; measured
# lattice=126 -> 6319 MB peak MPI).
# The paged edition runs the SAME problem while:
#   1. the page cache is swept 1-6 GB via --vram-mb;
#   2. blocks are swept 1 .. 67 = 80% of the 84 concurrent blocks an
#      RTX 5080 carries at the one-block-per-SM scale of these kernels.
# CACHE AXIS = --slots (x/v caches; 512KB..1.1GB measured at these
# values). --vram-mb was removed with the shared-cache redesign, and the
# NEIGHBOR-LIST cache (5.05 GB at lattice 126) is residency-sized by
# design (NlSlots/nl_cap in the bench) -- sweeping it below residency is
# future bench work, so total VRAM here spans ~5.4-6.3 GB, not 1-6 GB.
# page_kb=256: at lattice=126 a rowchunk held span is 230 KB, over the
# default 64 KB page ("raise --page-kb to at least 225").
# Full CTE stack per cell (hbm-resident cache + RAM tier + file tier
# where the bench supports it); CLIO_PREFAULT=0 for warmed memory.

config:
  name: gv_lammps_md_pressure
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: lammps_md
      variant: paged
      lattice: 126
      steps: 20
      ckpt: 5
      page_kb: 256
      prefault: "0"
      timeout_sec: 1800
      output_dir: /tmp/clio_gv/lammps_md_pressure
      slots: 128
      blocks: 1

vars:
  wl.slots: [128, 256, 512, 896]
  wl.blocks: [1, 16, 32, 67]

loop:
  - [wl.slots]
  - [wl.blocks]

repeat: 1
output: "${HOME}/gv_pipeline_results/lammps_md_pressure"

post: |
  import matplotlib
  matplotlib.use('Agg')
  import matplotlib.pyplot as plt
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  bad = df[df.get('gates_pass', 0) != 1]
  if len(bad):
      logger.warning(f'{len(bad)} cells failed gates -- excluded from figures')
  df = df[df.gates_pass == 1]
  tcol = 'ms_per_step'
  fig, axes = plt.subplots(1, 3, figsize=(16, 4.2))
  for cache, g in df.groupby('wl.slots'):
      g = g.sort_values('wl.blocks')
      axes[0].plot(g['wl.blocks'], g[tcol], 'o-', label=f'{cache} slots')
  axes[0].set_xlabel('CUDA blocks'); axes[0].set_ylabel('ms / step')
  axes[0].set_title('lammps_md paged: time vs parallelism x cache')
  axes[0].legend(fontsize=8); axes[0].set_xscale('log', base=2)
  for blocks, g in df.groupby('wl.blocks'):
      g = g.sort_values('wl.slots')
      axes[1].plot(g['wl.slots'], g[tcol], 's-', label=f'{blocks} blocks')
  axes[1].set_xlabel('x/v cache slots'); axes[1].set_ylabel('ms / step')
  axes[1].set_title('lammps_md paged: time vs cache x parallelism')
  axes[1].legend(fontsize=8)
  if 'faults' in df.columns:
      for blocks, g in df.groupby('wl.blocks'):
          g = g.sort_values('wl.slots')
          axes[2].plot(g['wl.slots'], g['faults'], '^-',
                       label=f'{blocks} blocks')
      axes[2].set_xlabel('x/v cache slots'); axes[2].set_ylabel('page faults')
      axes[2].set_title('lammps_md paged: I/O (faults) vs cache')
      axes[2].legend(fontsize=8)
  fig.tight_layout(); fig.savefig('lammps_md_pressure.png', dpi=130)
  logger.info('wrote lammps_md_pressure.png')
