# lbann memory-pressure x parallelism study (paged edition).
#
# ANCHOR PROBLEM: calibrated so the MPI baseline of this workload peaks
# at ~6 GB VRAM on the collection GPU (see calibrate_6gb.py; measured
# in=4096 H=172032 batch=256 -> 6121 MB peak; the paged vector is the WEIGHTS only (~2.9 GB), so the cache axis tops out at residency).
# The paged edition runs the SAME problem while:
#   1. the page cache is swept 0.5-2.9 GB (the weights vector size);
#   2. blocks are swept 1 .. 67 = 80% of the 84 concurrent blocks an
#      RTX 5080 carries at the one-block-per-SM scale of these kernels.
# page_kb=672: a page must hold WHOLE rows of both W1 (in=4096 -> 16 KB
# rows) and W2 (rows of H floats = 672 KB exactly); 672 KB is their LCM.
# lr=0.0001: the default 0.01 diverges to NaN losses at this H and the
# loss gate fails on nan != nan (the weight gate still passes bit-equal:
# paging is fine, the optimizer is not).
# blocks top out at 64, not 67: the model-parallel split needs blocks to
# divide H and O into whole pages (same constraint class as the MPI
# edition's H %% nranks == 0), and 67 divides neither 4096 W1-pages nor
# 64 W2-pages.
# Full CTE stack per cell (hbm-resident cache + RAM tier + file tier
# where the bench supports it); CLIO_PREFAULT=0 for warmed memory.

config:
  name: gv_lbann_pressure
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: lbann
      variant: paged
      in_dim: 4096
      hidden: 172032
      out_dim: 64
      batch: 256
      steps: 5
      lr: 0.0001
      page_kb: 672
      prefault: "0"
      timeout_sec: 1800
      output_dir: /tmp/clio_gv/lbann_pressure
      cache_mb: 512
      blocks: 1

vars:
  wl.cache_mb: [512, 1024, 2048, 2944]
  wl.blocks: [1, 16, 32, 64]

loop:
  - [wl.cache_mb]
  - [wl.blocks]

repeat: 1
output: "${HOME}/gv_pipeline_results/lbann_pressure"

post: |
  import matplotlib
  matplotlib.use('Agg')
  import matplotlib.pyplot as plt
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  bad = df[df.get('gates_pass', 0) != 1]
  if len(bad):
      logger.warning(f'{len(bad)} cells failed gates -- excluded from figures')
  df = df[df.gates_pass == 1]
  tcol = 'ms_per_step'
  fig, axes = plt.subplots(1, 3, figsize=(16, 4.2))
  for cache, g in df.groupby('wl.cache_mb'):
      g = g.sort_values('wl.blocks')
      axes[0].plot(g['wl.blocks'], g[tcol], 'o-', label=f'{cache} MB cache')
  axes[0].set_xlabel('CUDA blocks'); axes[0].set_ylabel('ms / step')
  axes[0].set_title('lbann paged: time vs parallelism x cache')
  axes[0].legend(fontsize=8); axes[0].set_xscale('log', base=2)
  for blocks, g in df.groupby('wl.blocks'):
      g = g.sort_values('wl.cache_mb')
      axes[1].plot(g['wl.cache_mb'], g[tcol], 's-', label=f'{blocks} blocks')
  axes[1].set_xlabel('page cache (MB)'); axes[1].set_ylabel('ms / step')
  axes[1].set_title('lbann paged: time vs cache x parallelism')
  axes[1].legend(fontsize=8)
  if 'faults' in df.columns:
      for blocks, g in df.groupby('wl.blocks'):
          g = g.sort_values('wl.cache_mb')
          axes[2].plot(g['wl.cache_mb'], g['faults'], '^-',
                       label=f'{blocks} blocks')
      axes[2].set_xlabel('page cache (MB)'); axes[2].set_ylabel('page faults')
      axes[2].set_title('lbann paged: I/O (faults) vs cache')
      axes[2].legend(fontsize=8)
  fig.tight_layout(); fig.savefig('lbann_pressure.png', dpi=130)
  logger.info('wrote lbann_pressure.png')
