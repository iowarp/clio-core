# GNN training over a paged feature matrix: page size x block count.
#
# 16 GiB feature matrix (33,554,432 nodes x 128-d float32) against an 8188 MB
# GPU -- 2x VRAM, so the matrix is genuinely out-of-core and the gather pages
# for the whole run.
#
# The access pattern here is a GATHER: each training window pulls scattered
# node rows, which is a different shape again from the other four workloads
# (flush writes, weights re-reads, k-means streams, Gray-Scott slides a
# window). Whether page size helps or hurts a gather is the open question --
# a large page amortises the fault but also drags in rows the window never
# touches, which is the opposite of the streaming case where every byte of a
# fetched page gets used.
#
# PAGE SIZE IS IN KB, converted by the package. The binary takes
# CLIO_GNN_PAGE_ROWS and a row is dim*4 = 512 B, so page_kb 16 -> 32 rows,
# 4096 -> 8192 rows. Expressing it in KB keeps this axis directly comparable
# with the other four sweeps instead of leaving one workload in rows.
#
# WHY THE AXES STOP WHERE THEY DO. The page cache costs
# gather_blocks * pages_per_block * page_kb of DEVICE memory on top of the
# 4 GiB kHBM tier. At 4 MB x 64 blocks x 8 slots that is 2 GB, so 6 GB total --
# already near the 7 GB budget on an 8 GB card. The package refuses anything
# over budget up front rather than letting it die after printing a header,
# which is how three cells of the k-means sweep were lost before the guard
# existed.
#
# What to read in the output:
#   epoch_s        the trainer's own training time. jarvis's `runtime` column
#                  is whole-process wall clock and INCLUDES ingesting 16 GiB,
#                  which dominates it -- do not use it as the benchmark time.
#   faults         paging work; the number the page-size axis moves
#   hbm_used_ok    0 means the kHBM tier received nothing, which is a
#                  misconfiguration rather than a result: the DPE ranks by a
#                  predicted bandwidth model and has been measured leaving a
#                  correctly sized HBM tier empty
#   read_verify_ok the trainer's own 8/8 page check
#   final_loss     the LAST epoch's loss (the trainer prints epoch0 -> epoch1
#                  on one line, so this is easy to misread)
#
# Requires: test_gpu_vector_gnn_train on PATH (<build>/bin), a CUDA device,
#           ~45 GiB of host RAM at peak (two transient copies of the
#           16 GiB matrix plus the 12 GiB tier).
#
# Usage (from the repo root):
#   export PATH=$PWD/build-coro/bin:$PATH
#   jarvis repo add ./jarvis_clio_core
#   jarvis ppl run yaml \
#     context-transfer-engine/adapter/gpu_vector/pipelines/gv_gnn_page_block_sweep.yaml

config:
  name: gv_gnn_page_block_sweep
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gnn_train
      pkg_name: gnn

      # 33,554,432 x 128 x 4 B = 16 GiB = 2x VRAM.
      nodes: 33554432
      dim: 128
      classes: 40
      hidden: 64
      epochs: 2

      hbm_mib: 4096
      # Sized to exactly the 12 GiB the kHBM tier cannot hold.
      #
      # AND "ram", NOT "pinned" -- a measured constraint, not a preference.
      # The trainer's synthetic path transiently holds TWO host copies of the
      # matrix (A0 is built before the loader's copy is dropped at
      # test_gpu_vector_gnn_train_gpu.cc:964), so peak is 32 GiB of matrix on
      # top of the tier. cudaMallocHost pinned pages are unswappable and
      # unreclaimable, so a pinned tier of 12-20 GiB pushed the peak past what
      # this 60 GiB host could give and the run was OOM-KILLED (exit 137, with
      # NO error in the log -- just a truncated header, which reads exactly
      # like a hang). Measured at 16 GiB: pinned 12288 -> exit 137;
      # ram 12288 -> completes, kHBM 4096 + DRAM 12288, read verify 8/8.
      #
      # The cost is real and should be stated with any result: "ram" is
      # pageable, so device transfers stage through an internal driver buffer
      # and the host tier is slower than a pinned one would be. That penalises
      # the tier for its allocation type rather than its speed -- but it is
      # the only way to reach 2x VRAM on this host without the ingest-file
      # path, which never materialises the matrix in host RAM at all.
      dram_mib: 12288
      dram_type: "ram"

      # Uncompressed: this sweep isolates paging. A codec would change how many
      # bytes each fault moves and confound the page-size axis.
      compress_lib: 0

      pages_per_block: 8
      window: 256
      vram_budget_gb: 7.0
      timeout_sec: 3600
      output_dir: "/tmp/clio_gnn_train"

      # Overwritten by the sweep.
      page_kb: 1024
      gather_blocks: 32

vars:
  # All are multiples of the 512 B row, so each holds a whole number of rows.
  gnn.page_kb: [16, 64, 256, 1024, 4096]
  gnn.gather_blocks: [16, 64]

loop:
  - [gnn.page_kb]
  - [gnn.gather_blocks]
  # => 5 page sizes x 2 block counts = 10 combinations

repeat: 1

run_timeout: 3600

output: "/home/llogan/Documents/Projects/iowarp/core/results/gv_gnn_page_block_sweep"

post: |
  runs = results['results']
  ok = [r for r in runs if r['status'] == 'success']
  logger.info(f"post: {len(ok)}/{len(runs)} combinations succeeded")

  # Trust checks first: a timing from a run that did not verify its pages, or
  # whose kHBM tier stayed empty, is not a slow result but an invalid one.
  bad = []
  for r in runs:
      st = r.get('stats') or {}
      if r['status'] != 'success':
          bad.append((r['variables'], f"status={r['status']}"))
      elif 'epoch_s' not in st:
          bad.append((r['variables'],
                      'NO STATS: no trainer output -- either '
                      'test_gpu_vector_gnn_train is not on PATH, or the cell '
                      'exceeded device memory'))
      elif not st.get('read_verify_ok'):
          bad.append((r['variables'],
                      'read verify FAILED -- paged data did not match a host '
                      'GetBlob, so the timings are void'))
      elif not st.get('hbm_used_ok'):
          bad.append((r['variables'],
                      'kHBM tier received 0 MiB -- misconfigured, not a '
                      'result; this row is not comparable'))
      elif st.get('put_err') or st.get('get_err'):
          bad.append((r['variables'],
                      f"put_err={st.get('put_err')} get_err={st.get('get_err')}"))
  for v, why in bad:
      logger.warning(f"post: SUSPECT {v}: {why}")

  pages = sorted({r['variables']['gnn.page_kb'] for r in ok})
  blocks = sorted({r['variables']['gnn.gather_blocks'] for r in ok})
  cell = {(r['variables']['gnn.page_kb'], r['variables']['gnn.gather_blocks']):
          (r.get('stats') or {}) for r in ok}

  def grid(metric, fmt='{:.2f}'):
      out = ['page_kb\\blocks,' + ','.join(str(b) for b in blocks)]
      for p in pages:
          row = [str(p)]
          for b in blocks:
              v = cell.get((p, b), {}).get(metric)
              row.append(fmt.format(v) if isinstance(v, (int, float)) else '')
          out.append(','.join(row))
      return out

  lines = [f"cells: {len(ok)}/{len(runs)} succeeded, {len(bad)} suspect",
           "16 GiB feature matrix = 2x VRAM (8188 MB), kHBM 4096 MiB",
           '', 'epoch_s (trainer time, excludes 16 GiB ingest):'] \
          + grid('epoch_s')
  lines += ['', 'faults:'] + grid('faults', '{:.0f}')
  lines += ['', 'gather_s:'] + grid('gather_s')
  lines += ['', 'kHBM used MiB:'] + grid('hbm_used_mib', '{:.0f}')

  # Correctness across cells: page size and block count must not change the
  # arithmetic, so the final loss should agree closely. Unlike the stencil
  # benchmarks the reduction here is over a fixed batch order, so a real
  # divergence would be a paging bug.
  losses = [(k, v.get('final_loss')) for k, v in cell.items() if v.get('final_loss')]
  if losses:
      lo = min(l for _, l in losses)
      hi = max(l for _, l in losses)
      lines += ['', f'final_loss across all cells: {lo:.6f} .. {hi:.6f} '
                f'(spread {(hi / lo - 1) * 100:.4f}%)']
      if (hi / lo - 1) > 1e-3:
          lines.append('  WARNING: the loss should not depend on page size or '
                       'block count; a spread here indicates a paging bug')

  lines += ['', 'page-size effect at each block count (slowest/fastest):']
  for b in blocks:
      col = [(p, cell.get((p, b), {}).get('epoch_s')) for p in pages]
      col = [(p, v) for p, v in col if v]
      if col:
          bp, bv = min(col, key=lambda kv: kv[1])
          wp, wv = max(col, key=lambda kv: kv[1])
          lines.append(f'  blocks={b:<4} best={bv:.2f}s at {bp}KB, '
                       f'worst={wv:.2f}s at {wp}KB, ratio={wv / bv:.2f}x')

  open('gnn_summary.txt', 'w').write('\n'.join(lines) + '\n')
  logger.info('post: wrote gnn_summary.txt')

  try:
      import matplotlib
      matplotlib.use('Agg')
      import matplotlib.pyplot as plt
      fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(11, 4.5))
      for b in blocks:
          ax1.plot(pages, [cell.get((p, b), {}).get('epoch_s') for p in pages],
                   marker='o', label=f'{b} blocks')
      ax1.set_xscale('log', base=2); ax1.set_xlabel('page size (KB)')
      ax1.set_ylabel('training time (s)'); ax1.set_title('page size')
      ax1.legend(fontsize=8)
      for b in blocks:
          ax2.plot(pages, [cell.get((p, b), {}).get('faults') for p in pages],
                   marker='o', label=f'{b} blocks')
      ax2.set_xscale('log', base=2); ax2.set_yscale('log')
      ax2.set_xlabel('page size (KB)'); ax2.set_ylabel('faults')
      ax2.set_title('paging work'); ax2.legend(fontsize=8)
      fig.suptitle('GNN training, 16 GiB feature matrix (2x VRAM)')
      fig.tight_layout(); fig.savefig('gnn_page_block.png', dpi=130)
      logger.info('post: wrote gnn_page_block.png')
  except ImportError:
      logger.warning('post: matplotlib unavailable, skipping the plot '
                     '(gnn_summary.txt has the same numbers)')
