# lammps_md (LJ melt, --md NVE deck) MPI baseline -- the one workload
# with a real CHECKPOINT phase, so it carries the I/O axis.
#
# Axes:
#   lattice  VRAM axis: natoms = 4*lattice^3; x/v/f + resort + list
#            buffers all scale with it (the bench prints its analytic
#            per-rank VRAM; we record the nvidia-smi peak beside it).
#   steps    runtime axis.
#   ckpt     checkpoint every N steps; 0 = never. With ckpt_dir set the
#            checkpoint is STAGED D2H and then WRITTEN DURABLY (O_DSYNC
#            file I/O) -- this is the workload's I/O, and the summary
#            splits stage vs durable cost per checkpoint.
config:
  name: gv_lammps_md_mpi_sweep
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: lammps_md
      variant: mpi
      nprocs: 1
      lattice: 20
      steps: 100
      ckpt: 0
      ckpt_dir: /tmp/clio_gv/lammps_ckpt
      prefault: "0"
      timeout_sec: 900
      output_dir: /tmp/clio_gv/lammps_md_mpi_sweep

vars:
  wl.lattice: [20, 30, 40]
  wl.steps: [50, 100]
  wl.ckpt: [0, 25, 10, 5]

loop:
  - [wl.lattice]
  - [wl.steps]
  - [wl.ckpt]

repeat: 1
output: "${HOME}/gv_pipeline_results/lammps_md_mpi_sweep"

post: |
  import matplotlib
  matplotlib.use('Agg')
  import matplotlib.pyplot as plt
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  bad = df[df.get('gates_pass', 0) != 1]
  if len(bad):
      logger.warning(f'{len(bad)} cells failed gates -- excluded from figures')
  df = df[df.gates_pass == 1]
  fig, axes = plt.subplots(1, 3, figsize=(15, 4))
  nock = df[df['wl.ckpt'] == 0]
  for steps, g in nock.groupby('wl.steps'):
      g = g.sort_values('wl.lattice')
      axes[0].plot(4 * g['wl.lattice'] ** 3, g['bench_ms'], 'o-',
                   label=f'{steps} steps')
  axes[0].set_xlabel('atoms'); axes[0].set_ylabel('run time (ms)')
  axes[0].set_title('lammps_md MPI: runtime vs atoms x steps')
  axes[0].legend()
  one = nock[nock['wl.steps'] == nock['wl.steps'].max()]
  one = one.sort_values('wl.lattice')
  axes[1].plot(4 * one['wl.lattice'] ** 3, one['vram_delta_mb'], 's-',
               color='tab:red', label='nvidia-smi peak')
  if 'vram_mb_analytic' in one:
      axes[1].plot(4 * one['wl.lattice'] ** 3, one['vram_mb_analytic'],
                   '^--', color='tab:blue', label='bench analytic')
  axes[1].set_xlabel('atoms'); axes[1].set_ylabel('VRAM (MB)')
  axes[1].set_title('lammps_md MPI: peak VRAM vs atoms')
  axes[1].legend()
  # Checkpoint I/O overhead: run time vs checkpoint PERIOD at the largest
  # problem (ckpt=0 plotted as the no-I/O floor).
  big = df[(df['wl.lattice'] == df['wl.lattice'].max()) &
           (df['wl.steps'] == df['wl.steps'].max())].copy()
  big = big.sort_values('wl.ckpt')
  lbl = [('never' if c == 0 else f'every {c}') for c in big['wl.ckpt']]
  axes[2].bar(lbl, big['bench_ms'], color='tab:green')
  axes[2].set_xlabel('checkpoint period (steps)')
  axes[2].set_ylabel('run time (ms)')
  axes[2].set_title('lammps_md MPI: checkpoint frequency cost\n'
                    '(stage D2H + durable write per checkpoint)')
  fig.tight_layout(); fig.savefig('lammps_md_mpi_sweep.png', dpi=130)
  logger.info('wrote lammps_md_mpi_sweep.png')
