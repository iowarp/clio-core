# weights MPI baseline: re-read passes over a device-resident array.
#
# Axes: dataset size (VRAM axis: each rank holds its whole element range)
# x passes (runtime axis: one Allreduce'd sweep per pass). No I/O phase.
# CAUTION: rank 0 recomputes the reference sum on the HOST serially, so
# very large data_mb inflates wall clock without touching the GPU numbers.
config:
  name: gv_weights_mpi_sweep
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: weights
      variant: mpi
      nprocs: 1
      steps: 3          # passes
      data_mb: 512
      prefault: "0"
      timeout_sec: 600
      output_dir: /tmp/clio_gv/weights_mpi_sweep

vars:
  wl.data_mb: [256, 512, 1024, 2048]
  wl.steps: [1, 3, 9]

loop:
  - [wl.data_mb]
  - [wl.steps]

repeat: 1
output: "${HOME}/gv_pipeline_results/weights_mpi_sweep"

post: |
  import matplotlib
  matplotlib.use('Agg')
  import matplotlib.pyplot as plt
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  bad = df[df.get('gates_pass', 0) != 1]
  if len(bad):
      logger.warning(f'{len(bad)} cells failed gates -- excluded from figures')
  df = df[df.gates_pass == 1]
  fig, axes = plt.subplots(1, 2, figsize=(11, 4))
  for passes, g in df.groupby('wl.steps'):
      g = g.sort_values('wl.data_mb')
      axes[0].plot(g['wl.data_mb'], g['bench_ms'], 'o-',
                   label=f'{passes} passes')
  axes[0].set_xlabel('dataset (MB)'); axes[0].set_ylabel('GPU time (ms)')
  axes[0].set_title('weights MPI: runtime vs dataset x passes')
  axes[0].legend(); axes[0].set_xscale('log', base=2)
  one = df[df['wl.steps'] == sorted(df['wl.steps'].unique())[0]]
  one = one.sort_values('wl.data_mb')
  axes[1].plot(one['wl.data_mb'], one['vram_delta_mb'], 's-', color='tab:red')
  axes[1].plot(one['wl.data_mb'], one['wl.data_mb'], '--', color='gray',
               label='dataset size (y=x)')
  axes[1].set_xlabel('dataset (MB)'); axes[1].set_ylabel('VRAM delta (MB)')
  axes[1].set_title('weights MPI: peak VRAM vs dataset (nvidia-smi)')
  axes[1].legend()
  fig.tight_layout(); fig.savefig('weights_mpi_sweep.png', dpi=130)
  logger.info('wrote weights_mpi_sweep.png')
