# lbann (2-layer MLP training) MPI baseline, model-parallel.
#
# Axes: hidden width (VRAM axis: W1 = in x H and W2 = H x out both scale
# with H) x batch (activation footprint + work per step) x steps
# (runtime axis). No checkpoint phase.
#
# HARD CONSTRAINT: hidden % nprocs == 0 and out % nprocs == 0, or the
# binary exits rc=2 -- keep the swept widths divisible by any nprocs used.
config:
  name: gv_lbann_mpi_sweep
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: lbann
      variant: mpi
      nprocs: 1
      hidden: 4096
      batch: 64
      steps: 5
      prefault: "0"
      timeout_sec: 600
      output_dir: /tmp/clio_gv/lbann_mpi_sweep

vars:
  wl.hidden: [2048, 4096, 8192, 16384]
  wl.batch: [64, 256]
  wl.steps: [5, 20]

loop:
  - [wl.hidden]
  - [wl.batch]
  - [wl.steps]

repeat: 1
output: "${HOME}/gv_pipeline_results/lbann_mpi_sweep"

post: |
  import matplotlib
  matplotlib.use('Agg')
  import matplotlib.pyplot as plt
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  bad = df[df.get('gates_pass', 0) != 1]
  if len(bad):
      logger.warning(f'{len(bad)} cells failed gates -- excluded from figures')
  df = df[df.gates_pass == 1]
  fig, axes = plt.subplots(1, 2, figsize=(11, 4))
  base = df[df['wl.steps'] == sorted(df['wl.steps'].unique())[0]]
  for batch, g in base.groupby('wl.batch'):
      g = g.sort_values('wl.hidden')
      axes[0].plot(g['wl.hidden'], g['bench_ms'] / g['steps_run'], 'o-',
                   label=f'batch {batch}')
  axes[0].set_xlabel('hidden width H'); axes[0].set_ylabel('ms / step')
  axes[0].set_title('lbann MPI: step time vs H x batch')
  axes[0].legend(); axes[0].set_xscale('log', base=2)
  one = base[base['wl.batch'] == sorted(base['wl.batch'].unique())[0]]
  one = one.sort_values('wl.hidden')
  axes[1].plot(one['wl.hidden'], one['vram_delta_mb'], 's-', color='tab:red')
  axes[1].set_xlabel('hidden width H'); axes[1].set_ylabel('VRAM delta (MB)')
  axes[1].set_title('lbann MPI: peak VRAM vs H (nvidia-smi)')
  fig.tight_layout(); fig.savefig('lbann_mpi_sweep.png', dpi=130)
  logger.info('wrote lbann_mpi_sweep.png')
