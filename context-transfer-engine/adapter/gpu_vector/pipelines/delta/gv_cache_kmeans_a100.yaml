# kmeans, PAGED, 2 NODES: PAGE CACHE RESIDENCY SWEEP AT A FIXED BLOCK COUNT.
#
#   1 workload x 5 residency rungs = 5 cells
#
# WHY BLOCKS ARE FIXED AND CACHE IS THE ONLY AXIS. Block count and cache
# size are not independent knobs in a paged kernel: every block PINS a
# window of pages while it computes, so the concurrent pinned floor is
# `blocks x window` and raising blocks raises the smallest cache that can
# legally run. Sweeping both at once therefore produces cells whose "10%
# cache" is really "the pinned set, which is all the cache there is", and
# the two effects are inseparable in the result. Pinning blocks makes the
# cache axis mean one thing.
#
# 432 BLOCKS = EXACTLY ONE A100 WAVE. Measured on the built binary, not
# assumed:
#
#   cuobjdump -res-usage build-clang/bin/clio_kmeans_paged_bench
#     AssignKernel  REG:64   SeedKernel  REG:64
#
# 65536 registers / 64 = 1024 threads resident per SM = FOUR 256-thread
# blocks per SM, and Delta's A100 has 108 SMs -> 432 blocks are concurrently
# resident at 50% occupancy. 432 is therefore the largest block count that
# adds parallelism rather than a second wave: at 1024 blocks the device runs
# one full wave plus a 160-block tail that idles 63% of the GPU, which shows
# up as a time increase that has nothing to do with the cache.
#
# (gv_launch_bounds.h notes the UNANNOTATED build lands on REG=192 -> one
# block/SM. The regcap is in effect here; REG=64 above is the proof. Any
# note claiming these kernels get one block per SM predates it.)
#
# kmeans PINS ONE PAGE PER BLOCK -- a block streams a contiguous chunk and
# holds a single page at a time -- so its pinned floor is 432 pages out of
# 32000, i.e. 1.35%. That is why kmeans can be swept down to a 10% cache at
# a full wave and grayscott (8 pages pinned per block, floor 10) cannot.
#
# THE RESIDENCY LADDER, and what the bench actually receives. --slots is
# PER BLOCK, and the pkg derives it as cache_mb*1024/(blocks*page_kb), so
# the swept quantity is the TOTAL cache -- which is what costs VRAM:
#
#   rung   cache_mb   slots/block   of 74 pages/block   true residency
#    10%      3200          7              74               9.5%
#    25%      8000         18              74              24.3%
#    50%     16000         37              74              50.0%
#    80%     25600         59              74              79.7%
#   100%     32000         74              74             100.0%  (resident)
#
# The 100% rung is the REFERENCE POINT, not a wasted cell: it is the same
# deck with paging switched off by construction (0 faults expected), so it
# is what the other four rungs are a slowdown against.
#
# DECK LEFT AT THE 32 GB/NODE ANCHOR, ITERATIONS CUT INSTEAD. --data-mb is
# GLOBAL and split, so 64000 is 32000 MB/node -- the same deck as
# gv_anchor32_* and gv_sweep_substrates_a100.yaml, which is what lets this
# CSV be read against them. The knob that was cut to fit the wall is
# --iters. Cutting the DECK instead would have removed the memory pressure
# that is the entire subject of a residency sweep.
#
# 8 iters, ARRIVED AT BY MEASUREMENT. The first run of this file used 2 and
# that was too few to see anything: faults fell 3.2x across the ladder while
# bench_ms stayed flat, because at 2 iterations one of them is compulsorily
# cold whatever the cache holds, so only half the accesses were cacheable
# and that half sat under a fixed ~40 s ingest. 8 makes it 1 cold to 7 warm.
# The measured cost was 70-80 s per cell at 2 iters against a 480 s cap, so
# the headroom for 8 was already there.
#
# NO FILE TIER (nvme_mb 0). With one, the end-of-run FlushData pushes this
# node's whole 32 GB share to disk -- minutes of wall clock measuring
# something this sweep is not asking about. Without one the flush is a
# clean no-op, because hbm and ram are both registered kVolatile.
#
# 20 MINUTE WALL, RESUMABLE. gpuA100x4 is ~2250 jobs deep and short
# requests backfill into gaps that hour-long ones wait days for. Expect
# ~150-250 s per cell at 8 iters, so the five may need a second job; if the wall lands
# first, RESUBMITTING THIS FILE CONTINUES IT -- jarvis resumes a pipeline
# test by ROW COUNT. timeout_sec 480 is deliberately under the wall: a cap
# shorter than the wall records the cell as completed=0, whereas the wall
# killing a running cell records nothing at all.
#
# FRESH RUN: `rm -rf $HOME/gv_pipeline_results/cache_kmeans` first, or a
# stale results.csv silently eats the first N cells and still reports
# success.
#
# Submit:  jarvis ppl submit gv_cache_kmeans_a100.yaml

scheduler:
  name: slurm
  account: bekn-delta-gpu
  partition: gpuA100x4
  nodes: 2
  ntasks_per_node: 1
  cpus_per_task: 16
  mem: 80g
  gpus_per_node: 1
  time: "00:20:00"
  job_name: gv_cache_km
  output: /u/llogan/gv_job_logs/gv_cache_km-%j.out
  error: /u/llogan/gv_job_logs/gv_cache_km-%j.err
  pre_cmds:
    - "source /u/llogan/clio-core/context-transfer-engine/adapter/gpu_vector/pipelines/delta/env.sh"
    - "scontrol show hostnames \"$SLURM_JOB_NODELIST\""
    - "srun -N 2 --ntasks-per-node=1 nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"

config:
  name: gv_cache_kmeans_a100
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: kmeans
      variant: paged
      nodes: 2
      node_launcher: "srun -N {n} --ntasks-per-node=1 --gpus-per-node=1"
      # A pipeline TEST builds a fresh pipeline per cell and the `scheduler:`
      # block binds self.hostfile only on the one it loaded, so the per-cell
      # pipelines see None. Name the scheduler's own file.
      hostfile: /u/llogan/.ppi-jarvis/shared/gv_cache_kmeans_a100/hostfile.txt
      cluster_port: 9433
      # ---- FIXED: everything that is not the cache -------------------
      blocks: 432
      threads: 256
      data_mb: 64000        # GLOBAL, split -> 32000 MB/node
      page_kb: 1024         # 32000 pages/node
      dims: 32              # page holds 262144 floats; 262144 % 32 == 0
      clusters: 16
      # ITERATIONS SIZED SO THE CACHE CAN ACTUALLY SHOW UP. Measured on
      # job 21721196 at steps=2: faults fell 3.2x across the ladder
      # (56896 -> 17842) while bench_ms did not move at all
      # (16887/17470/13406/16573 ms). The reason is compulsory misses --
      # at 2 iterations ONE of them is unavoidably cold however large the
      # cache is, so at most half the accesses were ever cacheable, and
      # that thin signal sat under a fixed ~40 s 32 GB ingest. At 8 the
      # ratio is 1 cold to 7 warm and the dynamic range is ~8x. The cells
      # ran 70-80 s against a 480 s cap, so this is spending headroom that
      # was already there, not risking it.
      steps: 8              # --iters
      repeat: 1
      ram_mb: 33280         # per-node share + slack; CLIO_PREFAULT=0 warms it
      nvme_mb: 0            # RAM-only stack: the end-of-run flush is a no-op
      prefault: "0"
      timeout_sec: 480
      barrier_sec: 300
      output_dir: /tmp/clio_gv/cache_kmeans

vars:
  # THE ONLY AXIS: total page cache, as a fraction of this node's 32000 MB.
  # 10% / 25% / 50% / 80% / 100%.
  wl.cache_mb: [3200, 8000, 16000, 25600, 32000]

loop:
  - [wl.cache_mb]

repeat: 1
output: "${HOME}/gv_pipeline_results/cache_kmeans"

post: |
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  pd.set_option('display.width', 240)

  # RESIDENCY IS THE AXIS, so put it in the table rather than making the
  # reader divide cache_mb by a deck size that lives only in a comment.
  DECK_MB_PER_NODE = 32000
  if 'wl.cache_mb' in df.columns:
      df['residency_pct'] = (100.0 * df['wl.cache_mb']
                             / DECK_MB_PER_NODE).round(1)

  cols = [c for c in ['residency_pct', 'wl.cache_mb', 'cache_setting',
                      'blocks_resolved', 'nodes', 'nodes_finished',
                      'completed', 'gates_pass', 'bench_ms', 'runtime',
                      'vram_peak_mb', 'faults', 'evicts', 'puts',
                      'get_errors', 'put_errors', 'centroid_checksum']
          if c in df.columns]
  logger.info('\n' + df[cols].to_string(index=False))

  # THE CURVE, against the resident rung. A residency sweep whose point is
  # "how much does paging cost" should print the slowdown, not leave it to
  # be eyeballed out of five raw numbers.
  ok = df[(df.get('completed', 0) == 1) & df['bench_ms'].notna()]
  if len(ok) and 'residency_pct' in ok.columns:
      full = ok[ok['residency_pct'] >= 100.0]
      if len(full):
          base = float(full['bench_ms'].min())
          curve = ok[['residency_pct', 'bench_ms']].copy()
          curve['x_resident'] = (curve['bench_ms'] / base).round(2)
          logger.info('\nkmeans paged, 432 blocks, 32 GB/node -- cost of a '
                      'smaller cache:\n'
                      + curve.sort_values('residency_pct').to_string(index=False))
      else:
          logger.warning('the 100%% rung did not produce a number, so there '
                         'is no resident baseline to divide by -- the other '
                         'rungs are absolute times only')

  # THE PRESSURE WITNESS. A sub-100% rung reporting ZERO faults did not run
  # the experiment: the cache was not actually smaller than the working set,
  # and that cell's time says nothing about paging.
  if 'faults' in df.columns:
      for _, r in df.iterrows():
          if r.get('completed', 0) != 1:
              continue
          f = r.get('faults')
          pct = r.get('residency_pct', 0)
          if pct < 100.0 and (pd.isna(f) or float(f or 0) == 0):
              logger.warning('NO FAULTS at the %s%% rung -- this cell was not '
                             'storage-bound and does not belong on the curve'
                             % pct)

  # A CAPPED CELL IS A RESULT, NOT A BLANK ROW.
  bad = df[df.get('completed', 0) != 1]
  for _, r in bad.iterrows():
      logger.warning('OVER THE 480 s CAP or FAILED: residency %s%% '
                     '(cache_mb=%s, runtime=%s, nodes_finished=%s)'
                     % (r.get('residency_pct'), r.get('wl.cache_mb'),
                        r.get('runtime'), r.get('nodes_finished')))

  if len(df) < 5:
      logger.warning('only %d of 5 rungs have rows -- the wall landed first; '
                     'RESUBMIT THIS FILE to continue (jarvis resumes by row '
                     'count)' % len(df))
  elif not len(bad):
      logger.info('all 5 residency rungs completed')
