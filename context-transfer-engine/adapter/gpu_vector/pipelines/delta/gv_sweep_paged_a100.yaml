# CACHE x BLOCKS, PAGED, ALL SIX WORKLOADS, 2 nodes.
#
# Half one of the substrate sweep. The other half is
# gv_sweep_substrates_a100.yaml (mpi/nccl/nvshmem x blocks). They are split
# because CACHE IS NOT AN AXIS FOR A RESIDENT SUBSTRATE: mpi, nccl and
# nvshmem have no page cache, so sweeping cache_mb across them would run
# 216 cells that differ in nothing and report it as data. Blocks is the
# axis they share, and it is swept identically in both files so the two
# CSVs join on (workload, blocks).
#
#   this file          6 workloads x 4 cache x 4 blocks = 96 cells
#   substrates file    6 workloads x 3 variants x 4 blocks = 72 cells
#
# PER-WORKLOAD LADDERS, NOT ONE GLOBAL LIST. A single cache_mb list cannot
# serve six workloads whose decks differ by 4x: 4096..32768 MB spans an
# eighth to all of a 32 GB deck, and covers lbann's twice over, which
# would make its whole cache axis a flat line at zero faults. cache_ladder
# / blocks_ladder carry a per-workload rung list and cache_level /
# blocks_level select the rung, so every workload is swept over the same
# FRACTION of its own deck. `s<N>` in a cache ladder means slots rather
# than MB -- lammps_md sweeps slots, not a byte budget.
#
# CALIBRATION IS NOT UNIFORM ACROSS THESE SIX -- read this before trusting
# a cross-workload comparison. kmeans, weights, grayscott and gmx carry the
# measured 32 GB/node anchors from gv_anchor32_*. lbann and lammps_md have
# no 32 GB anchor and never have: lbann's H=921600 reached 17763 MB rather
# than 32 GB (VRAM is not linear in H the way the 6 GB point suggested) and
# both blew their caps at their previous step counts. Their rows here use
# the largest sizes actually observed to run, so their DECKS ARE SMALLER
# and their absolute times are not comparable to the other four. Within a
# workload -- across cache and blocks, and against the substrates file --
# they are.
#
# THE SIZE KNOB IS GLOBAL AND SPLIT, except weights. kmeans and grayscott
# split --data-mb across nodes, gmx splits K, lbann splits H and O,
# lammps_md splits the lattice. weights' --pages is per block PER NODE, so
# its model already grows with the node count and 32000 is the per-node
# figure. Getting this backwards gives half the intended problem on one
# workload and twice it on another with nothing in the output to say so.
#
# 15 MINUTES PER CELL, HARD. timeout_sec kills a cell at 900 s and the row
# lands with completed=0 rather than eating the allocation. The post block
# names every cell that hit it -- a workload whose TIGHT cache rungs cannot
# finish in 15 minutes is itself the finding.
#
# 900, not 600: at cache_level 1 the cache is an EIGHTH of the deck, so
# nearly every access misses. The first attempt at this sweep capped at
# 600 s and the two cells that genuinely ran (cache_level 1, blocks 32 and
# 64) were still going at the cap. Expect the tight rungs to be slow and
# expect some of them to cap anyway; that is the shape of the answer, not
# a malfunction. THE SWEEP WILL LIKELY NEED A RESUBMIT OR TWO to clear all
# 96 cells inside the 12 h wall -- resubmitting this file continues it.
#
# RESUME. jarvis resumes a pipeline test by ROW COUNT, so a job that hits
# the wall clock continues where it stopped if you resubmit this file. For
# a FRESH sweep, `rm -rf $HOME/gv_pipeline_results/sweep_paged` first --
# otherwise a stale results.csv silently eats the first N cells and the run
# still reports success.
#
# Submit:  jarvis ppl submit gv_sweep_paged_a100.yaml

scheduler:
  name: slurm
  account: bekn-delta-gpu
  partition: gpuA100x4
  nodes: 2
  ntasks_per_node: 1
  cpus_per_task: 16
  mem: 80g
  gpus_per_node: 1
  time: "12:00:00"
  job_name: gv_sweep_paged
  output: /u/llogan/gv_job_logs/gv_sweep_paged-%j.out
  error: /u/llogan/gv_job_logs/gv_sweep_paged-%j.err
  pre_cmds:
    - "source /u/llogan/clio-core/context-transfer-engine/adapter/gpu_vector/pipelines/delta/env.sh"
    - "scontrol show hostnames \"$SLURM_JOB_NODELIST\""
    - "srun -N 2 --ntasks-per-node=1 nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"

config:
  name: gv_sweep_paged_a100
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: kmeans
      variant: paged
      nodes: 2
      node_launcher: "srun -N {n} --ntasks-per-node=1 --gpus-per-node=1"
      # A pipeline TEST builds a fresh pipeline per cell and the `scheduler:`
      # block binds self.hostfile only on the one it loaded, so the per-cell
      # pipelines see None. Name the scheduler's own file.
      hostfile: /u/llogan/.ppi-jarvis/shared/gv_sweep_paged_a100/hostfile.txt
      cluster_port: 9427
      # Threads pinned on every cell. Left unset each binary uses its own
      # default (the paged benches disagree: kmeans 256, weights 32), and a
      # comparison across cells then measures launch geometry instead of
      # the axis under test. The substrates file pins the SAME 256.
      threads: 256
      prefault: "0"
      timeout_sec: 900
      barrier_sec: 300
      output_dir: /tmp/clio_gv/sweep_paged

vars:
  # ---- zipped per workload -------------------------------------------
  wl.workload: [kmeans, weights, grayscott, gmx,    lbann,  lammps_md]
  wl.data_mb:  [64000,  32000,   64000,     0,      0,      0]
  wl.page_kb:  [1024,   1024,    1024,      32768,  672,    256]
  # Host RAM tier. 0 derives it from data_mb (per-node share + slack),
  # which is right for the three that declare one; the other three declare
  # it because they do not use --data-mb at all.
  wl.ram_mb:   [33280,  33280,   33280,     35840,  20480,  16384]
  # ITERATIONS CUT ~5x, DECK LEFT AT 32 GB/node. The first run of this
  # sweep used the gv_anchor32_* step counts, but those were calibrated for
  # FULL-CACHE runs (~125-250 s). A cache sweep exists to run at an EIGHTH
  # of the deck, which is several times more work per step, so at 20 steps
  # only cache_level 4 -- the rung that defeats the purpose -- ever
  # finished: 14 of 16 kmeans cells hit the cap, at 600 s and again at
  # 900 s. Cutting steps rather than the deck keeps the 32 GB memory
  # pressure, which is the thing a cache sweep is actually measuring.
  # Measured anchor to size against: kmeans cache_level 4 ran 224 s at 20
  # iters, so 4 iters lands near 45 s of compute plus the one-shot ~40 s
  # 32 GB ingest, leaving real headroom under the 900 s cap for the tight
  # rungs.
  wl.steps:    [4,      0,       4,         0,      2,      4]
  wl.repeat:   [1,      4,       1,         1,      0,      0]
  wl.dims:     [32,     0,       0,         0,      0,      0]
  wl.clusters: [16,     0,       0,         0,      0,      0]
  wl.mesh_k:   [0,      0,       0,         2048,   0,      0]
  wl.atoms:    [0,      0,       0,         200000, 0,      0]
  wl.lattice:  [0,      0,       0,         0,      0,      126]
  wl.ckpt:     [0,      0,       0,         0,      0,      5]
  wl.in_dim:   [0,      0,       0,         0,      4096,   0]
  wl.hidden:   [0,      0,       0,         0,      921600, 0]
  wl.out_dim:  [0,      0,       0,         0,      64,     0]
  wl.batch:    [0,      0,       0,         0,      256,    0]
  wl.lr:       [0,      0,       0,         0,      0.0001, 0]
  # gmx: skip the dense in-VRAM reference. There is no room for a second
  # 34 GB copy; the conservation gate still runs.
  wl.no_dense: [false,  false,   false,     true,   false,  false]
  # File tier. It is the ONLY non-volatile tier in this stack, so the
  # end-of-run flush pushes this node's whole share into it -- undersized,
  # the flush fills it and then fails per blob with rc 12 AFTER freeing
  # each blob's volatile blocks. -1 sizes it from the per-node deck; 0 is
  # a RAM-only stack where the flush is a clean no-op. See _nvme_tier_mb.
  wl.nvme_mb:  [-1,     -1,      -1,        0,      0,      0]
  # ---- the two swept axes, per-workload rungs ------------------------
  # Each ladder spans ~1/8 of that workload's per-node deck up to roughly
  # all of it, so cache_level means the same FRACTION everywhere.
  wl.cache_ladder:
    - "4096,8192,16384,32768"     # kmeans     32 GB/node
    - "4096,8192,16384,32768"     # weights    32 GB/node
    - "4096,8192,16384,32768"     # grayscott  32 GB/node
    - "4096,8192,16384,32768"     # gmx        34 GB/node
    - "1024,2048,4096,8192"       # lbann      ~8.9 GB/node (H=921600 -> 17763 MB global)
    - "s128,s256,s512,s896"       # lammps_md  slots, not MB
  wl.blocks_ladder:
    - "32,64,128,256"
    - "32,64,128,256"
    - "32,64,128,256"
    - "32,64,128,256"
    - "16,32,64,128"              # lbann capped lower; 256 blew its cap before
    - "32,64,128,256"
  wl.cache_level:  [1, 2, 3, 4]
  wl.blocks_level: [1, 2, 3, 4]

loop:
  - [wl.workload, wl.data_mb, wl.page_kb, wl.ram_mb, wl.steps, wl.repeat,
     wl.dims, wl.clusters, wl.mesh_k, wl.atoms, wl.lattice, wl.ckpt,
     wl.in_dim, wl.hidden, wl.out_dim, wl.batch, wl.lr, wl.no_dense,
     wl.nvme_mb, wl.cache_ladder, wl.blocks_ladder]
  - [wl.cache_level]
  - [wl.blocks_level]

repeat: 1
output: "${HOME}/gv_pipeline_results/sweep_paged"

post: |
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  pd.set_option('display.width', 240)
  cols = [c for c in ['wl.workload', 'cache_setting', 'blocks', 'nodes',
                      'nodes_finished', 'completed', 'gates_pass', 'bench_ms',
                      'runtime', 'vram_peak_mb', 'faults', 'evicts', 'puts',
                      'get_errors', 'put_errors']
          if c in df.columns]
  logger.info('\n' + df[cols].to_string(index=False))

  # The grid, per workload. Rungs rather than raw MB on the index: the
  # ladders differ per workload, so level is the only comparable label.
  for wl, g in df.groupby('wl.workload'):
      if 'bench_ms' in g and g['bench_ms'].notna().any():
          piv = g.pivot_table(index='wl.cache_level', columns='wl.blocks_level',
                              values='bench_ms', aggfunc='min')
          logger.info('\n%s -- bench_ms by (cache_level x blocks_level):\n%s'
                      % (wl, piv.to_string()))

  # A cell the 600 s cap killed is a finding, not noise: that (workload,
  # cache, blocks) belongs in its own pipeline with a longer wall.
  bad = df[df.get('completed', 0) != 1]
  for _, r in bad.iterrows():
      logger.warning('OVER THE 10 MIN CAP or FAILED: %s cache_level=%s '
                     'blocks_level=%s (runtime=%s, nodes_finished=%s)'
                     % (r['wl.workload'], r.get('wl.cache_level'),
                        r.get('wl.blocks_level'), r.get('runtime'),
                        r.get('nodes_finished')))
  if not len(bad):
      logger.info('all %d cells completed inside the 10 min cap' % len(df))
  else:
      over = sorted(set(bad['wl.workload']))
      logger.warning('%d/%d cells failed or timed out; workloads affected: %s'
                     % (len(bad), len(df), ', '.join(over)))
