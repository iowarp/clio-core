# How long does a 32 GB-VRAM problem take on the RESIDENT substrates?
#
# Six workloads, MPI edition, sized so the problem occupies ~32 GB of VRAM on
# one A100-40GB. Companion to the paged numbers: same problems, same GPU, so
# the runtimes are comparable across substrates rather than merely coexisting
# in one table.
#
# ONE RANK, ON PURPOSE. The paged edition runs on a single GPU with a 32 GB
# cache, so the only configuration comparable to it is a single GPU holding
# the same 32 GB resident. At nprocs=2 MPI would SHARD the problem and each
# GPU would hold 16 GB -- a different measurement wearing the same label.
# (Whether the comm substrates actually communicate is a separate question,
# already answered at 2 ranks by gv_variant_matrix_a100.yaml.)
#
# ANCHORS, scaled from the measured 6 GB set by the ratio 32768/6144 = 5.333:
#   kmeans/weights/grayscott  data_mb 6000 -> 32000       (linear)
#   gmx    mesh = K^3*8 B; K = 1616 -> 32196 MB. K MUST BE A MULTIPLE OF 16
#          or the paged sibling's --page-kb (K^2*8/1024) is not an integer
#          and the bench refuses ("not a square u64 plane"). K=1624 fails.
#
# STEPS=100, and that is the point of this revision. At 1-2 steps the paged
# sibling was dominated by a ONE-SHOT 32 GB ingest that MPI never pays: its
# counters showed evicts=0 everywhere and faults exactly equal to the page
# count (weights 32000 faults / 32000 pages), i.e. compulsory first-touch
# misses, not capacity pressure. 100 steps amortises that ingest, so the
# ratio this measures is steady-state cost rather than cold-start cost.
#
# lbann and lammps_md are NOT here: both exceeded the 120 s cap at their
# previous step counts, and lbann's H=921600 reached only 17763 MB rather
# than 32 GB, so its anchor needs calibrating (VRAM is not linear in H the
# way the 6 GB point suggested) before its runtime means anything.
#
# gmx has no iteration knob on the MPI side (the pkg passes only --k and
# --atoms), so it stays a single spread+gather and its cell is ~1 s.
#
# Submit:  jarvis ppl submit gv_anchor32_mpi_a100.yaml

scheduler:
  name: slurm
  account: bekn-delta-gpu
  partition: gpuA100x4
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 16
  mem: 60g
  gpus_per_node: 1
  time: "00:08:00"
  job_name: gv_anchor32_mpi
  output: /u/llogan/gv_job_logs/gv_anchor32_mpi-%j.out
  error: /u/llogan/gv_job_logs/gv_anchor32_mpi-%j.err
  pre_cmds:
    - "source /u/llogan/clio-core/context-transfer-engine/adapter/gpu_vector/pipelines/delta/env.sh"
    - "nvidia-smi --query-gpu=name,memory.total --format=csv,noheader"

config:
  name: gv_anchor32_mpi_a100
  pkgs:
    - pkg_type: jarvis_clio_core.clio_gv_workload
      pkg_name: wl
      workload: kmeans
      variant: mpi
      nprocs: 1
      mpi_launcher: "mpirun -n {n} --oversubscribe --bind-to none"
      prefault: "0"
      # 120 s: the whole point is that a resident substrate should be fast at
      # this size. A cell that needs longer is itself the finding, and the
      # cap keeps six of them inside a 9-minute request.
      timeout_sec: 400
      output_dir: /tmp/clio_gv/anchor32_mpi

vars:
  wl.workload: [gmx,    weights, grayscott, kmeans]
  wl.steps:    [0,      100,     100,       100]
  wl.data_mb:  [0,      32000,   32000,     32000]
  wl.atoms:    [200000, 0,       0,         0]
  wl.mesh_k:   [1616,   0,       0,         0]

loop:
  - [wl.workload, wl.steps, wl.data_mb, wl.atoms, wl.mesh_k]

repeat: 1
output: "${HOME}/gv_pipeline_results/anchor32_mpi"

post: |
  import pandas as pd, os
  df = pd.read_csv(os.path.join(output_dir, 'results.csv'))
  cols = [c for c in ['wl.workload', 'completed', 'gates_pass', 'bench_ms',
                      'ms_per_step', 'runtime', 'vram_peak_mb']
          if c in df.columns]
  logger.info('\n' + df[cols].to_string(index=False))
