# CACHE-SIZE TREND: all four workloads, one pipeline, coverage 0.5 -> 0.1.
#
# THE QUESTION: does shrinking the page cache cost performance, and at what
# rate? Five coverage points per workload, so the answer is a slope rather
# than a pair of endpoints.
#
# ONE PIPELINE, FOUR PACKAGES. jarvis starts Application packages in order, so
# each cell runs weights, then k-means, then Gray-Scott, then GNN at the SAME
# coverage. The cache_frac vars are ZIPPED into a single loop group for that
# reason -- listing them in separate groups would take their cross product and
# ask for 625 cells of mismatched coverage instead of 5 aligned ones.
#
# 5 coverage points x 4 workloads = 20 runs.
#
# FAULTS IN BULK, AND A CHEAP CACHE. The page size is 1 MB, so every fault
# moves a megabyte rather than a scatter of small reads, and the slot counts
# stay in the 64-320 range. Both matter for the "cache must be cheap to
# manage" constraint:
#   - Lookup is O(d) with d = min(8, pages_per_block) since the d-left hash
#     index replaced a full-table scan, so search cost no longer grows with
#     the cache at all.
#   - Bytes per fault is reported below; at 1 MB pages it should read 1.0,
#     which is the check that faults really are arriving in bulk.
#
# SIZING (verified to give an integer slot count at every point):
#   dataset 10240 MB = 1.25x this card's 8188 MB, so it is genuinely
#   out-of-core; 16 blocks x 640 pages/block x 1 MB.
#
#     coverage   slots/block   total cache   + 1 GB tier
#       0.5          320          5120 MB       6.0 GB
#       0.4          256          4096 MB       5.0 GB
#       0.3          192          3072 MB       4.0 GB
#       0.2          128          2048 MB       3.0 GB
#       0.1           64          1024 MB       2.0 GB
#
#   all within the 7 GB device budget.
#
# EVICTION POLICY: kEvictLru, the current default. THIS MATTERS FOR READING
# THE RESULT. Measured on weights at 3/4 coverage, LRU gives a 7.2% hit rate
# at 10922 ms while the frequency policy gives 28.1% at 5120 ms -- because LRU
# on a cyclic re-read evicts precisely the page needed soonest. So a flat or
# weak trend here may be a property of the policy rather than of cache sizing.
# Re-running under CLIO_GV_EVICT_POLICY=1 would separate the two.
#
# Requires: clio_gpu_vector_{weights,kmeans,grayscott}_bench and
#           test_gpu_vector_gnn_train on PATH (<build>/bin), a CUDA device,
#           ~25 GB of host RAM (GNN holds the matrix plus its host tier).
#
# Usage (from the repo root):
#   export PATH=$PWD/build-coro/bin:$PATH
#   jarvis repo add ./jarvis_clio_core
#   jarvis ppl run yaml \
#     context-transfer-engine/adapter/gpu_vector/pipelines/gv_cache_trend.yaml

# ENVIRONMENT. jarvis overlays this dict onto the captured environment.
#
config:
  name: gv_cache_trend
  # ENVIRONMENT -- MUST LIVE INSIDE `config:`, NOT AT THE TOP LEVEL.
  #
  # `jarvis ppl run yaml` is a pipeline TEST: it takes test_def['config'],
  # dumps that sub-dict to a temp yaml, and loads THAT as the pipeline. Only
  # what is inside `config:` survives the round trip. A top-level `env:` is
  # silently dropped -- jarvis logs "no 'env' field in pipeline", auto-builds
  # the environment, and the run proceeds looking entirely normal with the
  # variable never set. Three full runs completed that way before the absent
  # "CLIO_PREFAULT=" line in the bdev log gave it away.
  #
  # 2GB pre-faults a bounded PREFIX of each shm-backed RAM tier at compose
  # rather than populating it incrementally as allocations cross the
  # watermark; without it the first write to each host-tier page takes a minor
  # fault and a zeroed page inside the measured window. Note "0" is
  # special-cased to the WHOLE mapping, which is not what is wanted here.
  env:
    CLIO_PREFAULT: "2GB"
  pkgs:
    # ---- 1. WEIGHTS: full re-read, the most reuse for a cache to capture ----
    - pkg_type: jarvis_clio_core.clio_gpu_vector_weights
      pkg_name: gvw
      data_mb: 10240
      page_kb: 1024
      blocks: 16
      hbm_mb: 1024
      hbm_only: false
      threads: 256
      rt_threads: 8
      compressed: false
      cpu_codec: false
      flat_pct: 0
      no_prefetch: false
      # THE COROUTINE KERNEL. Without it the binary picks a path its own source
      # calls "single-threaded per block on purpose" -- a cell that runs in 53s
      # took over 600s, and it was nearly recorded as a code regression.
      yieldable: true
      repeat: 3
      vram_budget_gb: 7.0
      timeout_sec: 3600
      output_dir: "/tmp/gv_trend_weights"
      slots: 8
      pages: 640
      cache_mb: 0
      cache_frac: 0.5

    # ---- 2. K-MEANS: streaming read, no intra-pass reuse ----
    - pkg_type: jarvis_clio_core.clio_gpu_vector_kmeans
      pkg_name: km
      data_mb: 10240
      page_kb: 1024
      blocks: 16
      hbm_mb: 1024
      hbm_only: false
      dims: 32
      clusters: 16
      iters: 2
      threads: 256
      repeat: 3
      timeout_sec: 3600
      vram_budget_gb: 7.0
      output_dir: "/tmp/gv_trend_kmeans"
      slots: 8
      cache_mb: 0
      cache_frac: 0.5

    # ---- 3. GRAY-SCOTT: sliding window, the only short reuse distance ----
    - pkg_type: jarvis_clio_core.clio_gpu_vector_grayscott
      pkg_name: gs
      data_mb: 10240
      page_kb: 1024
      blocks: 16
      hbm_mb: 1024
      hbm_only: false
      threads: 256
      steps: 2
      repeat: 3
      Du: 0.2
      Dv: 0.1
      F: 0.02
      K: 0.048
      dt: 1.0
      vram_budget_gb: 7.0
      timeout_sec: 3600
      output_dir: "/tmp/gv_trend_grayscott"
      slots: 16
      cache_mb: 0
      cache_frac: 0.5

    # ---- 4. GNN: gather over scattered rows ----
    - pkg_type: jarvis_clio_core.clio_gnn_train
      pkg_name: gnn
      # 20971520 x 128 x 4 B = 10240 MB, matching the others.
      nodes: 20971520
      dim: 128
      classes: 40
      hidden: 64
      epochs: 2
      page_kb: 1024
      gather_blocks: 16
      hbm_mib: 1024
      # Sized to hold what the kHBM tier cannot. "ram" not "pinned": the
      # trainer transiently holds two host copies of the matrix and pinned
      # pages are unswappable, which OOM-killed the run (exit 137, no message,
      # reads exactly like a hang).
      dram_mib: 10240
      dram_type: "ram"
      compress_lib: 0
      window_mb: 256
      vram_budget_gb: 7.0
      timeout_sec: 3600
      output_dir: "/tmp/gv_trend_gnn"
      pages_per_block: 8
      cache_mb: 0
      cache_frac: 0.5

vars:
  gvw.cache_frac: [0.5, 0.4, 0.3, 0.2, 0.1]
  km.cache_frac:  [0.5, 0.4, 0.3, 0.2, 0.1]
  gs.cache_frac:  [0.5, 0.4, 0.3, 0.2, 0.1]
  gnn.cache_frac: [0.5, 0.4, 0.3, 0.2, 0.1]

# ONE zipped group: all four workloads advance to the same coverage together.
loop:
  - [gvw.cache_frac, km.cache_frac, gs.cache_frac, gnn.cache_frac]

repeat: 1

run_timeout: 7200

output: "/home/llogan/Documents/Projects/iowarp/core/results/gv_cache_trend"

post: |
  # STATS ARE READ FROM EACH BENCHMARK'S OWN LOG, NOT FROM `results`.
  #
  # jarvis merges every package's stats into ONE flat dict per cell, so four
  # workloads in one pipeline COLLIDE on shared key names: weights and k-means
  # both emit `kernel_ms`, and all four emit `faults`/`evicts`/`gbps`. Last
  # writer wins, silently. The first version of this script reported k-means'
  # time in the weights row and a single workload's faults for all four -- the
  # numbers looked entirely plausible, which is what made it dangerous.
  #
  # Each benchmark's own summary line carries `slots=`, so coverage is
  # recovered as slots/640 rather than assumed from ordering.
  import glob, re, os
  PPB = 640.0
  BLOCKS = 16
  ANSI = re.compile(r'\x1b\[[0-9;]*m')

  def field(line, key):
      m = re.search(r'(?:^|\s)' + key + r'=([0-9.]+)', line)
      return float(m.group(1)) if m else None

  def scan(d, marker):
      out = {}
      for fn in glob.glob(os.path.join(d, '*.log')):
          try:
              txt = ANSI.sub('', open(fn, errors='replace').read())
          except OSError:
              continue
          last = None
          for ln in txt.splitlines():
              if marker in ln:
                  last = ln
          if last is None:
              continue
          sl = field(last, 'slots')
          if sl is None:
              continue
          out[round(sl / PPB, 2)] = last
      return out

  def gnn_scan(d):
      out = {}
      for fn in glob.glob(os.path.join(d, '*.log')):
          try:
              txt = ANSI.sub('', open(fn, errors='replace').read())
          except OSError:
              continue
          m = re.search(r'_sl(\d+)_', os.path.basename(fn))
          e = re.findall(r'ETERNIA: .*?\(([0-9.]+)s\)', txt)
          f = re.findall(r'PAGING: faults=(\d+)', txt)
          if not m or not e:
              continue
          out[round(int(m.group(1)) / PPB, 2)] = (float(e[-1]),
                                                  int(f[-1]) if f else None)
      return out

  W = [('weights',   scan('/tmp/gv_trend_weights',   'GVW mode='),   'ms',      'ms'),
       ('kmeans',    scan('/tmp/gv_trend_kmeans',    'KMEANS '),     'ms',      'ms'),
       ('grayscott', scan('/tmp/gv_trend_grayscott', 'GRAYSCOTT '),  'ms',      'ms')]

  lines = ['cache-size trend: dataset 10240 MB (1.25x VRAM), 16 blocks x 1 MB '
           'pages, kHBM tier 1024 MB',
           'eviction policy: kEvictLru  (see the header -- this bounds the '
           'conclusion)',
           '',
           'coverage = total page cache / dataset; slots/block = coverage * 640',
           '']

  for name, data, key, unit in W:
      covs = sorted(data.keys(), reverse=True)
      lines += [f'=== {name}']
      lines.append(f"  {'coverage':>9} {'slots/blk':>10} {'cache MB':>9} "
                   f"{'time ' + unit:>11} {'faults':>9} {'achGB/s':>9} "
                   f"{'memcpyPin':>10} {'memcpyPg':>9} {'%of pg':>7} {'vs 0.5':>9}")
      base = None
      for c in covs:
          ln = data[c]
          val = field(ln, key)
          ft = field(ln, 'faults')
          slots = int(round(c * PPB))
          cache = BLOCKS * slots * 1024 / 1024.0
          if base is None:
              base = val
          mbf = (ft * 1024 / 1024.0 / ft) if ft else None   # 1 MB pages
          # ACHIEVED = the benchmark's own GB/s: logical bytes the kernel
          # touched over the timed window.
          #
          # Do NOT derive this as faults x page / time. `faults` is a lifetime
          # counter and does not always span the SAME window as `ms` -- weights
          # runs 4 passes and times one, so that formula overcounts it 4x and
          # produced an impossible 272-322% of the memcpy ceiling.
          #
          # Compared against the PAGEABLE probe: the CTE's RAM tier is pageable
          # shm, so that is the ceiling the paging path actually competes with.
          # Where the miss rate is ~100% (weights, k-means) logical == wire.
          pin = field(ln, 'memcpy_pin_gbps')
          pg = field(ln, 'memcpy_page_gbps')
          wire = field(ln, 'GB/s')
          frac = (wire / pg * 100) if (wire and pg) else None
          lines.append(f'  {c:>9.1f} {slots:>10} {cache:>9.0f} {val:>11.1f} '
                       f'{(int(ft) if ft else 0):>9} '
                       f'{(f"{wire:.2f}" if wire else "-"):>9} '
                       f'{(f"{pin:.2f}" if pin else "-"):>10} '
                       f'{(f"{pg:.2f}" if pg else "-"):>9} '
                       f'{(f"{frac:.0f}%" if frac else "-"):>7} '
                       f'{(val / base - 1) * 100:>+8.1f}%')
      lines += ['', '  marginal cost of removing each 0.1 of coverage:']
      for i in range(len(covs) - 1):
          a, b = covs[i], covs[i + 1]
          va, vb = field(data[a], key), field(data[b], key)
          if va:
              lines.append(f'    {a:.1f} -> {b:.1f}: {(vb / va - 1) * 100:+6.1f}%'
                           f'   ({va:.1f} -> {vb:.1f} {unit})')
      lines.append('')

  g = gnn_scan('/tmp/gv_trend_gnn')
  covs = sorted(g.keys(), reverse=True)
  lines += ['=== gnn',
            f"  {'coverage':>9} {'slots/blk':>10} {'cache MB':>9} "
            f"{'epoch_s':>11} {'faults':>9} {'vs 0.5':>9}"]
  base = None
  for c in covs:
      sec, ft = g[c]
      slots = int(round(c * PPB))
      if base is None:
          base = sec
      lines.append(f'  {c:>9.1f} {slots:>10} {BLOCKS * slots:>9} {sec:>11.2f} '
                   f'{(ft if ft else 0):>9} {(sec / base - 1) * 100:>+8.1f}%')
  lines += ['', '  marginal cost of removing each 0.1 of coverage:']
  for i in range(len(covs) - 1):
      a, b = covs[i], covs[i + 1]
      lines.append(f'    {a:.1f} -> {b:.1f}: '
                   f'{(g[b][0] / g[a][0] - 1) * 100:+6.1f}%'
                   f'   ({g[a][0]:.2f} -> {g[b][0]:.2f} s)')

  lines += ['',
            'BULK: 1 MB pages, so every fault moves 1.00 MB. Faults are bulk '
            'transfers by construction here, which is why more of them costs '
            'so little.']

  open('cache_trend_summary.txt', 'w').write('\n'.join(lines) + '\n')
  logger.info('post: wrote cache_trend_summary.txt')
