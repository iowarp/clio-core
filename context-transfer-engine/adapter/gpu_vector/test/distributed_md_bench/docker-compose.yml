# 2-node distributed run of the md BENCHMARK itself.
#
# The other md harnesses gate a focused distributed TEST: distributed_md_paged
# proves the paged halo exchange is coherent across nodes, and distributed_md
# runs the MPI/NVSHMEM benches as real multi-rank jobs. Neither runs
# clio_lammps_md_paged_bench -- the melt deck with the STATICS, RESORT and NVE
# gates -- against a CTE that spans machines. This does.
#
# What it gates: that the full benchmark, gates and all, still produces the
# right physics when its pages are placed by a DPE that can put them on
# ANOTHER NODE. A single-node run never exercises a remote get or put on the
# paging path; here every fault may cross the wire.
#
# ONE DOMAIN, SPLIT. Both nodes open the SAME vectors -- one tag namespace --
# and each owns a contiguous slab of z-planes (--nodes/--node). The force
# stencil reaches one plane past a slab edge and the resort's gather reaches
# one in y and z, so every step each node publishes its slab AS a generation
# and demands its neighbours' halo AT that generation. There is no barrier
# between the publish and the read; the generation is the barrier.
#
# It was two independent decks in separate tag namespaces, which exercised
# concurrent paging load but shared no data -- set GVMB_TAG1/GVMB_TAG2 to
# --tag-prefix values and GVMB_DECOMP1/2 to empty to get that back.
#
# THE DECOMPOSED MODE WORKS. Turn it on with:
#
#   GVMB_TAG1= GVMB_TAG2= GVMB_DECOMP1="--nodes 2 --node 0" \
#   GVMB_DECOMP2="--nodes 2 --node 1" \
#   GVMB_ARGS="--lattice 28 --steps 20 --blocks 16" ./run_md_bench_distributed.sh
#
# lattice 28 is not a taste: a slab must end on a page boundary because the
# cache transfers whole pages, and only nb a multiple of 16 gives a z-plane
# that is a whole number of them (nb=16, 128 KB, two pages). The bench refuses
# anything else rather than corrupt quietly.
#
# WHAT WORKS: the partition AND the exchange. lattice 28, 2 nodes, 20 steps:
# E0 = -592121.595111, matching the single-node reference to the digit, and
# drift 8.4e-07 against single-node 7.92e-07 -- 1.06x. Both nodes agree
# exactly; STATICS, RESORT and NVE all pass.
#
# MD_NO_HALO=1 IS THE CONTROL AND IT NOW BITES: drift 2.28e-05 (27x worse),
# x faults 36 instead of 116, generational refetch 0 instead of 80. That
# gap is the proof the exchange is load-bearing rather than incidentally
# correct -- for a long time it did NOT hold, because the publish was
# flushing pages it had never fetched and SubmitFlushRanges drops a page it
# cannot Find, silently, before it ever builds a task. Watch `flush_dropped=`
# in the paging line: anything but 0 means writebacks are being thrown away.
#
# STILL MISSING: migration handoff. The resort is correct while atoms stay in
# their own slab; once one crosses a boundary the owning node has to hand it
# over, and nothing does that yet.
#
# NEITHER NODE MAY LEAVE WHILE THE OTHER IS STILL PAGING. The runtime dies
# with the process, and a peer whose pages live on the departing node then
# waits forever -- node1 exiting 0 hung node2 in the NVE loop seconds later.
#
# A finished bench therefore BARRIERS on its peer through the shared
# /workspace mount rather than sleeping a fixed time: a 45s linger was not
# enough once node2, which starts later and contends with node1, ran past it.
# Each node touches .done_<id> and waits for its peer's, up to GVMB_BARRIER
# seconds. The bench's own status is preserved across the wait, so a real
# failure still fails the container.
#
#   HOST_WORKSPACE=$(pwd) BUILD_DIR=build ./run_md_bench_distributed.sh
#
# Both containers share the host GPU through the nvidia runtime. The CUDA
# toolkit comes from the HOST mount (deps-cpu has none); driver libs are
# injected by the nvidia container runtime.
x-node: &node
  image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
  init: true
  runtime: nvidia
  stop_grace_period: 5s
  security_opt:
    - seccomp:unconfined
  # UNLIMITED memlock. cudaHostRegister charges against RLIMIT_MEMLOCK, and
  # docker's default (64 MB) makes the RAM tier's best-effort span pinning
  # fail SILENTLY once a big deck's tier outgrows it -- leaving holes in the
  # pinned tiling, and a cuda copy that crosses a pinned/unpinned seam fails
  # with "invalid argument" (mixed registration in one range is illegal).
  # Measured as 6 gpu_api recoveries per lattice-41 run.
  ulimits:
    memlock: -1
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ${HOST_WORKSPACE:?set HOST_WORKSPACE to the repo root}:/workspace:rw
    - ${CUDA_HOME:-/usr/local/cuda-13.3}:/usr/local/cuda:ro
    - /usr/lib/x86_64-linux-gnu/nvcomp:/usr/lib/x86_64-linux-gnu/nvcomp:ro
    - ${CUSZP_LIB_DIR:-/tmp}:/opt/cuszp-lib:ro
  working_dir: /workspace
  mem_limit: 8g

services:
  gvmb-node1:
    <<: *node
    container_name: gvmb-node1
    hostname: gvmb-node1
    networks:
      gvmb-cluster: { ipv4_address: 172.24.0.10 }
    environment:
      - NODE_ID=1
      - PEER_ID=2
      - NODE_IP=172.24.0.10
      - GVMB_START_DELAY=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MD_NO_HALO=${MD_NO_HALO:-}
      - GVMB_BARRIER=${GVMB_BARRIER:-600}
      - CLIO_GEN_LOG=${CLIO_GEN_LOG:-}
      - MD_RESORT_CHECK=${MD_RESORT_CHECK:-}
      - MD_NO_INTERIOR=${MD_NO_INTERIOR:-}
      - MD_RESORT_DEBUG=${MD_RESORT_DEBUG:-}
      - CLIO_MULTI_INLINE=${CLIO_MULTI_INLINE:-}
      - MD_NO_OVERLAP=${MD_NO_OVERLAP:-}
      - CLIO_GV_ADMIT=${CLIO_GV_ADMIT:-}
      - MD_TRACE=${MD_TRACE:-}
      - MD_VERIFY_REFAULT=${MD_VERIFY_REFAULT:-}
      - MD_VR_HALO=${MD_VR_HALO:-}
      - CLIO_NUM_CONTAINERS=${GVMB_NODES:-2}
      - GVMB_NODES=${GVMB_NODES:-2}
      # Per-node so the tiers can be made ASYMMETRIC: point node1 at a
      # config whose tier is far smaller than its working set and its pages
      # have nowhere to go but node2, which is how this harness proves the
      # paging path actually crosses the wire rather than merely coexisting
      # with a cluster.
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/${GVMB_CONF1:-gvmb_conf.yaml}
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
    command: ["sh", "-c", "cd /tmp && sleep $${GVMB_START_DELAY:-0}; /workspace/${BUILD_DIR:-build}/bin/clio_lammps_md_paged_bench --md ${GVMB_TAG1---tag-prefix n1_} ${GVMB_ARGS:---lattice 20 --steps 20 --blocks 16} ${GVMB_DECOMP1:-}; rc=$$?; touch /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$NODE_ID; w=0; while [ $$(ls /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_* 2>/dev/null | wc -l) -lt $${GVMB_NODES:-2} ] && [ $$w -lt $${GVMB_BARRIER:-600} ]; do sleep 1; w=$$((w+1)); done; exit $$rc"]
    entrypoint: []

  gvmb-node2:
    <<: *node
    container_name: gvmb-node2
    hostname: gvmb-node2
    networks:
      gvmb-cluster: { ipv4_address: 172.24.0.11 }
    environment:
      - NODE_ID=2
      - PEER_ID=1
      - NODE_IP=172.24.0.11
      # Let node1 compose the pools first; both nodes declare `pool_query:
      # local`, and racing the creation is not what this harness is testing.
      - GVMB_START_DELAY=8
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MD_NO_HALO=${MD_NO_HALO:-}
      - GVMB_BARRIER=${GVMB_BARRIER:-600}
      - CLIO_GEN_LOG=${CLIO_GEN_LOG:-}
      - MD_RESORT_CHECK=${MD_RESORT_CHECK:-}
      - MD_NO_INTERIOR=${MD_NO_INTERIOR:-}
      - MD_RESORT_DEBUG=${MD_RESORT_DEBUG:-}
      - CLIO_MULTI_INLINE=${CLIO_MULTI_INLINE:-}
      - MD_NO_OVERLAP=${MD_NO_OVERLAP:-}
      - CLIO_GV_ADMIT=${CLIO_GV_ADMIT:-}
      - MD_TRACE=${MD_TRACE:-}
      - MD_VERIFY_REFAULT=${MD_VERIFY_REFAULT:-}
      - MD_VR_HALO=${MD_VR_HALO:-}
      - CLIO_NUM_CONTAINERS=${GVMB_NODES:-2}
      - GVMB_NODES=${GVMB_NODES:-2}
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/${GVMB_CONF2:-gvmb_conf.yaml}
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
    command: ["sh", "-c", "cd /tmp && sleep $${GVMB_START_DELAY:-0}; /workspace/${BUILD_DIR:-build}/bin/clio_lammps_md_paged_bench --md ${GVMB_TAG2---tag-prefix n2_} ${GVMB_ARGS:---lattice 20 --steps 20 --blocks 16} ${GVMB_DECOMP2:-}; rc=$$?; touch /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$NODE_ID; w=0; while [ $$(ls /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_* 2>/dev/null | wc -l) -lt $${GVMB_NODES:-2} ] && [ $$w -lt $${GVMB_BARRIER:-600} ]; do sleep 1; w=$$((w+1)); done; exit $$rc"]
    entrypoint: []

  gvmb-node3:
    <<: *node
    container_name: gvmb-node3
    hostname: gvmb-node3
    profiles: ["four"]
    networks:
      gvmb-cluster: { ipv4_address: 172.24.0.12 }
    environment:
      - NODE_ID=3
      - PEER_ID=1
      - NODE_IP=172.24.0.12
      - GVMB_START_DELAY=12
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MD_NO_HALO=${MD_NO_HALO:-}
      - GVMB_BARRIER=${GVMB_BARRIER:-600}
      - CLIO_GEN_LOG=${CLIO_GEN_LOG:-}
      - MD_RESORT_CHECK=${MD_RESORT_CHECK:-}
      - MD_NO_INTERIOR=${MD_NO_INTERIOR:-}
      - MD_RESORT_DEBUG=${MD_RESORT_DEBUG:-}
      - CLIO_MULTI_INLINE=${CLIO_MULTI_INLINE:-}
      - MD_NO_OVERLAP=${MD_NO_OVERLAP:-}
      - CLIO_GV_ADMIT=${CLIO_GV_ADMIT:-}
      - MD_TRACE=${MD_TRACE:-}
      - MD_VERIFY_REFAULT=${MD_VERIFY_REFAULT:-}
      - MD_VR_HALO=${MD_VR_HALO:-}
      - CLIO_NUM_CONTAINERS=${GVMB_NODES:-2}
      - GVMB_NODES=${GVMB_NODES:-2}
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/${GVMB_CONF3:-gvmb_conf4.yaml}
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
    command: ["sh", "-c", "cd /tmp && sleep $${GVMB_START_DELAY:-0}; /workspace/${BUILD_DIR:-build}/bin/clio_lammps_md_paged_bench --md ${GVMB_TAG3---tag-prefix n3_} ${GVMB_ARGS:---lattice 20 --steps 20 --blocks 16} ${GVMB_DECOMP3:-}; rc=$$?; touch /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$NODE_ID; w=0; while [ $$(ls /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_* 2>/dev/null | wc -l) -lt $${GVMB_NODES:-2} ] && [ $$w -lt $${GVMB_BARRIER:-600} ]; do sleep 1; w=$$((w+1)); done; exit $$rc"]
    entrypoint: []

  gvmb-node4:
    <<: *node
    container_name: gvmb-node4
    hostname: gvmb-node4
    profiles: ["four"]
    networks:
      gvmb-cluster: { ipv4_address: 172.24.0.13 }
    environment:
      - NODE_ID=4
      - PEER_ID=1
      - NODE_IP=172.24.0.13
      - GVMB_START_DELAY=16
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MD_NO_HALO=${MD_NO_HALO:-}
      - GVMB_BARRIER=${GVMB_BARRIER:-600}
      - CLIO_GEN_LOG=${CLIO_GEN_LOG:-}
      - MD_RESORT_CHECK=${MD_RESORT_CHECK:-}
      - MD_NO_INTERIOR=${MD_NO_INTERIOR:-}
      - MD_RESORT_DEBUG=${MD_RESORT_DEBUG:-}
      - CLIO_MULTI_INLINE=${CLIO_MULTI_INLINE:-}
      - MD_NO_OVERLAP=${MD_NO_OVERLAP:-}
      - CLIO_GV_ADMIT=${CLIO_GV_ADMIT:-}
      - MD_TRACE=${MD_TRACE:-}
      - MD_VERIFY_REFAULT=${MD_VERIFY_REFAULT:-}
      - MD_VR_HALO=${MD_VR_HALO:-}
      - CLIO_NUM_CONTAINERS=${GVMB_NODES:-2}
      - GVMB_NODES=${GVMB_NODES:-2}
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/${GVMB_CONF4:-gvmb_conf4.yaml}
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
    command: ["sh", "-c", "cd /tmp && sleep $${GVMB_START_DELAY:-0}; /workspace/${BUILD_DIR:-build}/bin/clio_lammps_md_paged_bench --md ${GVMB_TAG4---tag-prefix n4_} ${GVMB_ARGS:---lattice 20 --steps 20 --blocks 16} ${GVMB_DECOMP4:-}; rc=$$?; touch /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$NODE_ID; w=0; while [ $$(ls /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_* 2>/dev/null | wc -l) -lt $${GVMB_NODES:-2} ] && [ $$w -lt $${GVMB_BARRIER:-600} ]; do sleep 1; w=$$((w+1)); done; exit $$rc"]
    entrypoint: []

networks:
  gvmb-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
