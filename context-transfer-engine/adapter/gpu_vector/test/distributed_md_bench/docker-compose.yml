# 2-node distributed run of the md BENCHMARK itself.
#
# The other md harnesses gate a focused distributed TEST: distributed_md_paged
# proves the paged halo exchange is coherent across nodes, and distributed_md
# runs the MPI/NVSHMEM benches as real multi-rank jobs. Neither runs
# clio_gpu_vector_md_bench -- the melt deck with the STATICS, RESORT and NVE
# gates -- against a CTE that spans machines. This does.
#
# What it gates: that the full benchmark, gates and all, still produces the
# right physics when its pages are placed by a DPE that can put them on
# ANOTHER NODE. A single-node run never exercises a remote get or put on the
# paging path; here every fault may cross the wire.
#
# Both nodes run the whole deck, each in its own tag namespace (--tag-prefix),
# because two processes creating "md_x" in one CTE would page into each
# other's blobs. Two independent benches also mean the runtime is servicing
# concurrent paging traffic from both, which is the load a single node cannot
# produce.
#
# NEITHER NODE MAY LEAVE WHILE THE OTHER IS STILL PAGING. The runtime dies
# with the process, and a peer whose pages live on the departing node then
# waits forever -- node1 exiting 0 hung node2 in the NVE loop seconds later.
#
# A finished bench therefore BARRIERS on its peer through the shared
# /workspace mount rather than sleeping a fixed time: a 45s linger was not
# enough once node2, which starts later and contends with node1, ran past it.
# Each node touches .done_<id> and waits for its peer's, up to GVMB_BARRIER
# seconds. The bench's own status is preserved across the wait, so a real
# failure still fails the container.
#
#   HOST_WORKSPACE=$(pwd) BUILD_DIR=build ./run_md_bench_distributed.sh
#
# Both containers share the host GPU through the nvidia runtime. The CUDA
# toolkit comes from the HOST mount (deps-cpu has none); driver libs are
# injected by the nvidia container runtime.
x-node: &node
  image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
  init: true
  runtime: nvidia
  stop_grace_period: 5s
  security_opt:
    - seccomp:unconfined
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ${HOST_WORKSPACE:?set HOST_WORKSPACE to the repo root}:/workspace:rw
    - ${CUDA_HOME:-/usr/local/cuda-13.3}:/usr/local/cuda:ro
    - /usr/lib/x86_64-linux-gnu/nvcomp:/usr/lib/x86_64-linux-gnu/nvcomp:ro
    - ${CUSZP_LIB_DIR:-/tmp}:/opt/cuszp-lib:ro
  working_dir: /workspace
  mem_limit: 8g

services:
  gvmb-node1:
    <<: *node
    container_name: gvmb-node1
    hostname: gvmb-node1
    networks:
      gvmb-cluster: { ipv4_address: 172.24.0.10 }
    environment:
      - NODE_ID=1
      - PEER_ID=2
      - NODE_IP=172.24.0.10
      - GVMB_START_DELAY=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CLIO_NUM_CONTAINERS=2
      # Per-node so the tiers can be made ASYMMETRIC: point node1 at a
      # config whose tier is far smaller than its working set and its pages
      # have nowhere to go but node2, which is how this harness proves the
      # paging path actually crosses the wire rather than merely coexisting
      # with a cluster.
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/${GVMB_CONF1:-gvmb_conf.yaml}
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
    command: ["sh", "-c", "cd /tmp && sleep $${GVMB_START_DELAY:-0}; /workspace/${BUILD_DIR:-build}/bin/clio_gpu_vector_md_bench --md --tag-prefix n1_ ${GVMB_ARGS:---lattice 20 --steps 20 --blocks 16}; rc=$$?; touch /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$NODE_ID; w=0; while [ ! -f /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$PEER_ID ] && [ $$w -lt $${GVMB_BARRIER:-600} ]; do sleep 1; w=$$((w+1)); done; exit $$rc"]
    entrypoint: []

  gvmb-node2:
    <<: *node
    container_name: gvmb-node2
    hostname: gvmb-node2
    networks:
      gvmb-cluster: { ipv4_address: 172.24.0.11 }
    environment:
      - NODE_ID=2
      - PEER_ID=1
      - NODE_IP=172.24.0.11
      # Let node1 compose the pools first; both nodes declare `pool_query:
      # local`, and racing the creation is not what this harness is testing.
      - GVMB_START_DELAY=8
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CLIO_NUM_CONTAINERS=2
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/${GVMB_CONF2:-gvmb_conf.yaml}
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
    command: ["sh", "-c", "cd /tmp && sleep $${GVMB_START_DELAY:-0}; /workspace/${BUILD_DIR:-build}/bin/clio_gpu_vector_md_bench --md --tag-prefix n2_ ${GVMB_ARGS:---lattice 20 --steps 20 --blocks 16}; rc=$$?; touch /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$NODE_ID; w=0; while [ ! -f /workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/.done_$$PEER_ID ] && [ $$w -lt $${GVMB_BARRIER:-600} ]; do sleep 1; w=$$((w+1)); done; exit $$rc"]
    entrypoint: []

networks:
  gvmb-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
