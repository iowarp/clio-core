# Cluster config for the 4-node distributed md BENCHMARK harness.
#
# Same shape as distributed_md_paged/gvmd_conf.yaml, with its own port and
# subnet so all the harnesses can be up at once without fighting.
#
# This is the config md_bench would otherwise write for itself. It only
# reaches the bench because the bench now leaves an already-set
# CLIO_SERVER_CONF alone -- that is the whole reason a distributed md_bench
# run is possible.
networking:
  port: 9415
  hostfile: "/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_bench/hostfile4"

runtime:
  num_threads: 8
  queue_depth: 8192
  first_busy_wait: 2000000000

gpu:
  queue_depth: 8192

compose:
  - mod_name: clio_bdev
    pool_name: "ram::gvmb_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "1GB"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: "ram::gvmb_ram"
        bdev_type: "ram"
        capacity_limit: "2GB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
