# Cluster config for the 4-node distributed gpu_vector test. Every node's
# in-process runtime loads this; the hostfile makes them one cluster, and the
# compose section gives each node a local RAM tier for the CTE to place pages
# in -- pages hash across nodes at the BLOB level (PodPut/PodGet forwarding),
# so the cluster's aggregate storage is the vector's backing store.
networking:
  port: 9413
  hostfile: "/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed/hostfile"

runtime:
  num_threads: 4
  queue_depth: 8192
  first_busy_wait: 2000000000

gpu:
  queue_depth: 8192
