# Cluster config for the generic distributed paged-workload harness.
#
# Its own port and subnet so it can be up at the same time as the md
# harnesses (9413-9415 and 9423, subnets 172.22-172.24, are taken).
#
# This is the config each bench would otherwise write for itself. It only
# reaches them because every paged bench now leaves an already-set
# CLIO_SERVER_CONF alone -- that guard is what makes a distributed run of
# anything other than md possible at all.
#
# THE COMPOSE SCHEMA IS NOT THE ONE THE BENCHES WRITE INLINE. Pool ids are
# STRINGS of the form "major.minor" -- a bare `pool_id: 512` is rejected at
# load with "Invalid UniqueId format, expected 'major.minor'" -- and a core
# pool declares `storage:`, not `tiers:`. Copied from
# distributed_md_bench/gvmb_conf.yaml, which is the shape that works.
networking:
  port: 9425
  hostfile: "/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_workloads/hostfile"

runtime:
  num_threads: 8
  queue_depth: 8192
  # Workers that fall back to sleeping add their sleep to every fault, and a
  # fault here is a round trip that may cross the wire. Keep them spinning.
  first_busy_wait: 2000000000

gpu:
  queue_depth: 8192

compose:
  - mod_name: clio_bdev
    pool_name: "ram::gvw_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "1GB"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: "ram::gvw_fast"
        bdev_type: "ram"
        capacity_limit: "4MB"
        score: 1.0
      - path: "ram::gvw_slow"
        bdev_type: "ram"
        capacity_limit: "2GB"
        score: 0.1
    dpe:
      dpe_type: "max_bw"
