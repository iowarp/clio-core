# 2-node distributed PAGED HALO EXCHANGE -- the coherence case MD needs.
#
# Every node runs the SAME binary (test_gpu_vector_md_distributed): an
# in-process runtime joins the cluster via the hostfile, then each round every
# node publishes its own slab of rows AS a generation and reads its
# neighbour's boundary row NAMING that generation.
#
# The distinguishing property, and the reason this harness exists alongside
# distributed/: the halo is ONE FIXED PAGE re-read every round, which the
# other test deliberately never does. There is no barrier between publish and
# read -- the generation is the barrier. See the test's header.
#
#   HOST_WORKSPACE=$(pwd) docker compose up --abort-on-container-failure
#
# Both containers share the host GPU through the nvidia runtime. The CUDA
# toolkit comes from the HOST mount (deps-cpu has none); driver libs are
# injected by the nvidia container runtime.
x-node: &node
  image: ${IOWARP_DOCKER_IMAGE:-iowarp/deps-cpu:latest}
  init: true
  runtime: nvidia
  stop_grace_period: 5s
  security_opt:
    - seccomp:unconfined
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ${HOST_WORKSPACE:?set HOST_WORKSPACE to the repo root}:/workspace:rw
    - ${CUDA_HOME:-/usr/local/cuda-13.3}:/usr/local/cuda:ro
    - /usr/lib/x86_64-linux-gnu/nvcomp:/usr/lib/x86_64-linux-gnu/nvcomp:ro
    - ${CUSZP_LIB_DIR:-/tmp}:/opt/cuszp-lib:ro
  working_dir: /workspace
  mem_limit: 8g

x-env: &common-env
  - NVIDIA_VISIBLE_DEVICES=all
  - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  - CLIO_NUM_CONTAINERS=2
  - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_paged/gvmd_conf.yaml
  - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
  - GVMD_ROWS=${GVMD_ROWS:-8}
  - GVMD_ROUNDS=${GVMD_ROUNDS:-4}
  - GVMD_BLOCKS=${GVMD_BLOCKS:-4}
  - GVMD_SLOTS=${GVMD_SLOTS:-4}
  - GVMD_BARRIER_TIMEOUT=${GVMD_BARRIER_TIMEOUT:-180}
  # The harness config composes a RAM tier per node, so client-driven
  # registration is off here (same as distributed/).
  - GVMD_REGISTER_TARGET=${GVMD_REGISTER_TARGET:-0}

services:
  gvmd-node1:
    <<: *node
    container_name: gvmd-node1
    hostname: gvmd-node1
    networks:
      gvmd-cluster: { ipv4_address: 172.23.0.10 }
    environment:
      - NODE_ID=1
      - NODE_IP=172.23.0.10
      - GVMD_START_DELAY=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CLIO_NUM_CONTAINERS=2
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_paged/gvmd_conf.yaml
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
      - GVMD_ROWS=${GVMD_ROWS:-8}
      - GVMD_ROUNDS=${GVMD_ROUNDS:-4}
      - GVMD_BLOCKS=${GVMD_BLOCKS:-4}
      - GVMD_SLOTS=${GVMD_SLOTS:-4}
      - GVMD_BARRIER_TIMEOUT=${GVMD_BARRIER_TIMEOUT:-180}
      - GVMD_REGISTER_TARGET=${GVMD_REGISTER_TARGET:-0}
    command: ["sh", "-c", "sleep $${GVMD_START_DELAY:-0}; exec /workspace/${BUILD_DIR:-build}/bin/test_gpu_vector_md_distributed"]
    entrypoint: []

  gvmd-node2:
    <<: *node
    container_name: gvmd-node2
    hostname: gvmd-node2
    networks:
      gvmd-cluster: { ipv4_address: 172.23.0.11 }
    environment:
      - NODE_ID=2
      - NODE_IP=172.23.0.11
      - GVMD_START_DELAY=6
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CLIO_NUM_CONTAINERS=2
      - CLIO_SERVER_CONF=/workspace/context-transfer-engine/adapter/gpu_vector/test/distributed_md_paged/gvmd_conf.yaml
      - LD_LIBRARY_PATH=/workspace/${BUILD_DIR:-build}/bin:/usr/local/cuda/lib64:/usr/lib/x86_64-linux-gnu/nvcomp/13:/opt/cuszp-lib:/usr/local/lib
      - GVMD_ROWS=${GVMD_ROWS:-8}
      - GVMD_ROUNDS=${GVMD_ROUNDS:-4}
      - GVMD_BLOCKS=${GVMD_BLOCKS:-4}
      - GVMD_SLOTS=${GVMD_SLOTS:-4}
      - GVMD_BARRIER_TIMEOUT=${GVMD_BARRIER_TIMEOUT:-180}
      - GVMD_REGISTER_TARGET=${GVMD_REGISTER_TARGET:-0}
    command: ["sh", "-c", "sleep $${GVMD_START_DELAY:-0}; exec /workspace/${BUILD_DIR:-build}/bin/test_gpu_vector_md_distributed"]
    entrypoint: []

networks:
  gvmd-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
