# Compose config for the compressor FUNCTIONAL tests.
#
# The tests used to run with NO config at all and create their CTE core pool
# programmatically with a default CreateParams. That pool has no storage
# targets, so the PutBlob at the end of a Compress had nowhere to land and
# returned an error. Composing the core pool here gives it a RAM tier, and the
# tests address that pool instead of building one without storage.

networking:
  port: 9417

runtime:
  num_threads: 4
  queue_depth: 1024

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "256MB"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "513.0"
    storage:
      - path: "ram::compressor_functional_tier"
        bdev_type: "ram"
        capacity_limit: "128MB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
