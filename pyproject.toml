[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "iowarp-core"
dynamic = ["version"]
description = "IOWarp Context Management Platform"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "IOWarp Team", email = "grc@illinoistech.edu"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pyyaml",
    "msgpack",
]

[project.scripts]
clio_run = "iowarp_core._cli:clio_run_main"
clio_cte_bench = "iowarp_core._cli:cte_bench_main"
clio_run_thrpt_bench = "iowarp_core._cli:run_thrpt_main"
clio_cte_fuse = "iowarp_core._cli:cte_fuse_main"

[project.urls]
Homepage = "https://iowarp.ai"
Repository = "https://github.com/iowarp/clio-core"
Documentation = "https://docs.iowarp.ai"

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
install.components = ["pip_package"]
wheel.packages = [
    "installers/pip/iowarp_core",
]
# Sets CMAKE_INSTALL_PREFIX = <wheel>/platlib/iowarp_core, so every install()
# DESTINATION is package-relative ("lib", "bin", "ext", ...) instead of having
# to manually prefix each one with iowarp_core/.  The single exception is the
# .pth file, which uses DESTINATION ".." in CMakeLists.txt to escape one level
# up so it lands at site-packages root.  Must stay in sync with the
# installers/pip/pyproject.toml copy used by local `pip install installers/pip`.
wheel.install-dir = "iowarp_core"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "ON"
CLIO_CORE_STATIC_DEPS = "ON"
CLIO_CORE_ENABLE_RUNTIME = "ON"
CLIO_CORE_ENABLE_CTE = "ON"
CLIO_CORE_ENABLE_CAE = "ON"
CLIO_CORE_ENABLE_CEE = "ON"
CLIO_CORE_ENABLE_PYTHON = "ON"
CLIO_CORE_ENABLE_TESTS = "OFF"
CLIO_CORE_ENABLE_BENCHMARKS = "ON"
CLIO_CORE_ENABLE_RPATH = "OFF"
CLIO_CORE_ENABLE_ZMQ = "ON"
CLIO_CORE_ENABLE_CEREAL = "ON"
CLIO_CORE_ENABLE_MPI = "OFF"
CLIO_CORE_ENABLE_HDF5 = "OFF"
CLIO_CORE_ENABLE_ELF = "OFF"
CLIO_CTE_ENABLE_COMPRESS = "OFF"
# FUSE adapter: OFF here is the macOS value; Linux and Windows wheels turn
# it ON via the per-OS overrides at the bottom of this file (#899).
CLIO_CTE_ENABLE_FUSE_ADAPTER = "OFF"
# Cache + replication chimods ship by default (#886/#899). They already
# default ON in CMake; pin them here so a future default flip cannot
# silently drop them from published wheels.
CLIO_CTE_ENABLE_CACHE = "ON"
CLIO_CTE_ENABLE_REPLICATION = "ON"
CLIO_CORE_ENABLE_ENCRYPT = "OFF"
CLIO_CORE_ENABLE_CUDA = "OFF"
CLIO_CORE_ENABLE_ROCM = "OFF"
CLIO_CORE_ENABLE_OPENMP = "OFF"
CLIO_CORE_ENABLE_IO_URING = "ON"
CTP_LOG_LEVEL = "1"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(iowarp-core VERSION (?P<value>[\d.]+)'

# ---------------------------------------------------------------------------
# Per-OS overrides (#899): ship the OS-specific FUSE adapter by default.
# `if.platform-system` regex-matches sys.platform ("linux", "win32",
# "darwin").
#   - Linux: libfuse3. The binary links libfuse3.so.3, which the wheel does
#     NOT bundle (see repair_wheel.sh — external system libs stay external);
#     users need their distro's fuse3/libfuse3 packages at mount time, as
#     documented in iowarp_core._cli.cte_fuse_main.
#   - Windows: WinFsp (https://winfsp.dev). The build finds WinFsp's
#     FUSE3-compatible SDK (adapter/libfuse/CMakeLists.txt); end users need
#     the WinFsp runtime installed.
#   - macOS: stays OFF — there is no fuse3 pkg-config on macOS (macFUSE
#     exposes the FUSE2 API), so the base define above applies.
#
# These MUST live here, not only in installers/pip/pyproject.toml: CI runs
# `cibuildwheel` from the repo root with no working-directory, so cibuildwheel
# builds THIS file's package. #899 added the overrides to the installers/pip
# copy only, so every published wheel silently shipped without the FUSE
# adapter -- and only the Windows wheel test caught it, because the Linux
# check tolerates a nonzero exit from the `clio_cte_fuse` console script,
# which exists as an entry point even when the binary behind it does not.
# ---------------------------------------------------------------------------
# inherit.cmake.define = "append" is load-bearing: without it an override's
# cmake.define table REPLACES the whole base table (verified against
# scikit-build-core 0.12 and re-verified against 1.0.3), silently dropping
# STATIC_DEPS and every other base define from the wheel build.
[[tool.scikit-build.overrides]]
if.platform-system = "linux"
inherit.cmake.define = "append"
cmake.define.CLIO_CTE_ENABLE_FUSE_ADAPTER = "ON"

[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.CLIO_CTE_ENABLE_FUSE_ADAPTER = "ON"

# ---------------------------------------------------------------------------
# GPU wheel variants. Selected by the CLIO_WHEEL_GPU environment variable at
# build time (build-pip.yml sets it per matrix entry). Each variant is
# published as its own distribution (iowarp-core-cuda12, iowarp-core-rocm6,
# iowarp-core-sycl) that installs the same `iowarp_core` import package;
# installers/pip/gpu_variant.py rewrites [project].name/dependencies, which
# overrides cannot change. Unset = the CPU wheel, unchanged.
#
# Architecture lists are fat builds so one wheel runs on every current
# laptop, desktop and datacenter part of that vendor (see the per-variant
# comments). Built for Linux x86_64 (manylinux_2_28) only.
# ---------------------------------------------------------------------------

# CUDA 12.9 (the first 12.x with sm_100/sm_120).
#   75  Turing: RTX 20, GTX 16, T4, laptop RTX 20
#   80  A100, A30
#   86  RTX 30 desktop/laptop, A-series workstation, A10/A40
#   89  RTX 40 desktop/laptop, L4, L40S, RTX Ada
#   90  H100, H200, GH200
#   100 B200, GB200
#   120 RTX 50 desktop/laptop, RTX PRO Blackwell  (+ PTX for newer GPUs)
# libcudart.so.12 comes from the nvidia-cuda-runtime-cu12 pip dependency
# (repair_wheel.sh points RPATH at it); the driver comes from the system.
[[tool.scikit-build.overrides]]
if.env.CLIO_WHEEL_GPU = "cuda12"
inherit.cmake.define = "append"
cmake.define.CLIO_CORE_ENABLE_CUDA = "ON"
cmake.define.CMAKE_CUDA_ARCHITECTURES = "75-real;80-real;86-real;89-real;90-real;100-real;120"
cmake.define.CMAKE_CUDA_COMPILER = "/usr/local/cuda-12.9/bin/nvcc"

# ROCm 6.4, HIP on AMD. Needs a system ROCm 6.x runtime (libamdhip64.so.6);
# RPATH includes /opt/rocm/lib.
#   gfx90a   MI210/MI250/MI250X (Frontier)
#   gfx942   MI300A/MI300X/MI325X (El Capitan)
#   gfx1030  RX 6800/6900, Radeon PRO W6800
#   gfx1100  RX 7900, Radeon PRO W7900/W7800
#   gfx1101  RX 7800/7700, Radeon PRO W7700
#   gfx1102  RX 7600, laptop RX 7000S/M
#   gfx1151  Ryzen AI Max (Strix Halo) laptops/mini-PCs
#   gfx1200  RX 9060
#   gfx1201  RX 9070, Radeon AI PRO R9700
[[tool.scikit-build.overrides]]
if.env.CLIO_WHEEL_GPU = "rocm6"
inherit.cmake.define = "append"
cmake.define.CLIO_CORE_ENABLE_ROCM = "ON"
cmake.define.CLIO_ROCM_HIP_PLATFORM = "amd"
cmake.define.ROCM_ROOT = "/opt/rocm"
cmake.define.CMAKE_HIP_ARCHITECTURES = "gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1151;gfx1200;gfx1201"

# SYCL via oneAPI DPC++, spir64 (JIT). One SPIR-V image runs on every Intel
# GPU with a Level Zero/OpenCL driver: Arc/Xe laptop iGPUs (Meteor/Lunar/
# Arrow Lake), Arc A/B desktop, Data Center GPU Max (Aurora). AOT
# (spir64_gen) accepts only one SYCL_DEVICE, so it would drop all but one of
# these. libsycl comes from the intel-sycl-rt pip dependency.
[[tool.scikit-build.overrides]]
if.env.CLIO_WHEEL_GPU = "sycl"
inherit.cmake.define = "append"
cmake.define.CLIO_CORE_ENABLE_SYCL = "ON"
cmake.define.SYCL_TARGET = "spir64"
cmake.define.CMAKE_C_COMPILER = "icx"
cmake.define.CMAKE_CXX_COMPILER = "icpx"
